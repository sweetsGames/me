<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ガイドラインに基づくPWA・全画面表示のためのviewport設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ホームランきょうそう</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホームラン">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>

<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * {
    box-sizing: border-box; user-select: none; -webkit-user-select: none;
    margin: 0; padding: 0; touch-action: none; font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
  }
  body {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: #87CEEB; display: flex; flex-direction: column;
  }
  #game-area {
    position: relative; flex: 1; width: 100%; max-width: 600px; margin: 0 auto;
    background: #4caf50; box-shadow: 0 0 15px rgba(0,0,0,0.2); overflow: hidden;
  }
  canvas {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  
  /* UI Overlay */
  #ui-layer {
    position: absolute; top: max(10px, var(--sat)); left: max(10px, var(--sal)); right: max(10px, var(--sar));
    display: flex; justify-content: space-between; pointer-events: none; padding: 0 10px; z-index: 10;
  }
  .hud-box {
    background: rgba(255, 255, 255, 0.9); border: 4px solid #388e3c; border-radius: 12px;
    padding: 8px 15px; font-size: clamp(16px, 5vw, 24px); font-weight: bold; color: #1b5e20;
    box-shadow: 0 4px 0 #2e7d32;
  }
  
  /* Messages */
  #message-box {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(32px, 8vw, 48px); font-weight: bold; text-align: center;
    color: white; text-shadow: 3px 3px 0 #d32f2f, -2px -2px 0 #d32f2f, 2px -2px 0 #d32f2f, -2px 2px 0 #d32f2f;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; width: 100%;
  }

  /* Controls */
  #controls {
    position: absolute; bottom: max(20px, var(--sab)); left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 400px; z-index: 30;
  }
  .swing-btn {
    width: 100%; padding: 20px 0; background: #ff5722; border: none; border-bottom: 8px solid #d84315;
    border-radius: 40px; font-size: clamp(28px, 7vw, 36px); font-weight: bold; color: white;
    cursor: pointer; pointer-events: auto; touch-action: manipulation; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  .swing-btn:active {
    transform: translateY(8px); border-bottom-width: 0px; margin-bottom: 8px; box-shadow: none;
  }

  /* Screens */
  .screen {
    position: absolute; inset: 0; background: rgba(255, 250, 240, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  h1 { font-size: clamp(32px, 9vw, 48px); color: #ff9800; margin-bottom: 20px; text-shadow: 2px 2px 0 #fff; text-align: center;}
  .desc { font-size: clamp(16px, 4.5vw, 22px); color: #333; margin-bottom: 30px; font-weight: bold; text-align: center; line-height: 1.5; }
  
  /* Difficulty Buttons */
  .btn-group {
    display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 280px;
  }
  .diff-btn {
    padding: 15px; border: none; border-radius: 30px;
    font-size: clamp(20px, 6vw, 28px); font-weight: bold; color: white; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2);
  }
  .diff-btn:active { transform: translateY(6px); box-shadow: none; margin-bottom: 6px;}

  .btn-return {
    background: #ff5722; border-radius: 30px; padding: 15px 50px; border: none;
    font-size: clamp(24px, 7vw, 32px); color: white; font-weight: bold; box-shadow: 0 6px 0 #d84315;
    margin-top: 20px;
  }
  .btn-return:active { transform: translateY(6px); box-shadow: none; margin-bottom: 6px;}
  
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="game-area">
  <canvas id="c"></canvas>
  
  <div id="ui-layer">
    <div class="hud-box"><span id="pitch-count">1</span>/10きゅう</div>
    <div class="hud-box">ホームラン: <span id="hr-count">0</span></div>
  </div>
  
  <div id="message-box"></div>
  
  <div id="controls">
    <button id="swing-btn" class="swing-btn hide">うつ！</button>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen">
    <h1>ホームラン<br>きょうそう⚾</h1>
    <div class="desc">ゲージが<span style="color:red">あか色</span>のところで<br>「うつ！」をおそう！</div>
    
    <div class="btn-group">
      <button class="diff-btn" style="background:#00c853;" onclick="startGame(0)">超かんたん</button>
      <button class="diff-btn" style="background:#ff9800;" onclick="startGame(1)">かんたん</button>
      <button class="diff-btn" style="background:#f44336;" onclick="startGame(2)">むずかしい</button>
      <button class="diff-btn" style="background:#9c27b0;" onclick="startGame(3)">超むずかしい</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="screen hide">
    <h1>おつかれさま！</h1>
    <div class="desc">ホームランの かず<br><span id="final-score" style="font-size: 2em; color: #d32f2f;">0</span> ほん</div>
    <button class="btn-return" onclick="showStartScreen()">もどる</button>
  </div>
</div>

<script>
// --- Web Audio API ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let actx;

function initAudio() {
    if (!actx) actx = new AudioContext();
    if (actx.state === 'suspended') actx.resume();
}

function playSound(type) {
    if (!actx) return;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    const now = actx.currentTime;
    
    if (type === 'pitch') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'swing') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'homerun') {
        osc.type = 'square'; [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => osc.frequency.setValueAtTime(freq, now + i*0.15));
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.7); osc.start(now); osc.stop(now + 0.7);
    } else if (type === 'out') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(150, now + 0.4);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(now); osc.stop(now + 0.4);
    }
}

// --- Canvas設定 ---
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() {
    W = c.width = c.parentElement.clientWidth;
    H = c.height = c.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// --- ゲーム設定・状態 ---
const DIFFICULTIES = [
    { hitMin: 0.85, hitMax: 1.25, hrMin: 0.92, hrMax: 1.10, showGauge: true },  // 0: 超かんたん
    { hitMin: 0.90, hitMax: 1.15, hrMin: 0.98, hrMax: 1.05, showGauge: true },  // 1: かんたん (前回基準)
    { hitMin: 0.95, hitMax: 1.10, hrMin: 1.00, hrMax: 1.035, showGauge: true }, // 2: むずかしい
    { hitMin: 0.95, hitMax: 1.10, hrMin: 1.00, hrMax: 1.035, showGauge: false } // 3: 超むずかしい
];
let currentDiff = 1; // 現在の難易度

let state = 'title';
let pitchCount = 0;
let hrCount = 0;
const MAX_PITCHES = 10;
let timer = 0;

let ball = { t: 0, speed: 0, endX: 0, hitState: 0 }; 
let flyBall = { x: 0, y: 0, vx: 0, vy: 0, gravity: 0, scale: 1, timer: 0, maxTime: 0 };
let swingAnim = 0;

const UI_PITCH = document.getElementById('pitch-count');
const UI_HR = document.getElementById('hr-count');
const MSG = document.getElementById('message-box');
const SWING_BTN = document.getElementById('swing-btn');

function showMsg(text, color) {
    MSG.innerText = text; MSG.style.color = color || 'white'; MSG.style.opacity = 1;
}
function hideMsg() { MSG.style.opacity = 0; }

// --- 描画ロジック ---
function drawBatterView() {
    ctx.fillStyle = '#4caf50'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, W, H*0.25);
    
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.ellipse(W/2, H*0.35, 60, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W/2, H*0.8, 120, Math.PI, 0, true); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.moveTo(W/2, H*0.75); ctx.lineTo(W/2+20, H*0.73); ctx.lineTo(W/2+20, H*0.78); ctx.lineTo(W/2, H*0.82); ctx.lineTo(W/2-20, H*0.78); ctx.lineTo(W/2-20, H*0.73); ctx.fill();
    
    ctx.font = "40px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText("🐒", W/2, H*0.35);

    // タイミングゲージの描画 (難易度設定に従う)
    let diffObj = DIFFICULTIES[currentDiff];
    if (diffObj.showGauge && (state === 'pitch' || state === 'wait' || state === 'swinging')) {
        let barW = W * 0.8;
        let barH = 24;
        let barX = W * 0.1;
        let barY = H * 0.55; 
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 10); ctx.fill();
        
        let tStart = 0.4;
        let tEnd = 1.3;
        let tSpan = tEnd - tStart;
        
        // ヒットゾーン（黄色）
        let hitStart = (diffObj.hitMin - tStart) / tSpan * barW;
        let hitW = (diffObj.hitMax - diffObj.hitMin) / tSpan * barW;
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(barX + hitStart, barY, hitW, barH);
        
        // ホームランゾーン（赤）
        let hrStart = (diffObj.hrMin - tStart) / tSpan * barW;
        let hrW = (diffObj.hrMax - diffObj.hrMin) / tSpan * barW;
        ctx.fillStyle = '#f44336';
        ctx.fillRect(barX + hrStart, barY, hrW, barH);
        
        ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 10); ctx.stroke();
        
        if (state === 'pitch' || state === 'swinging') {
            let cursorX = barX + ((ball.t - tStart) / tSpan) * barW;
            if (cursorX < barX) cursorX = barX;
            if (cursorX > barX + barW) cursorX = barX + barW;
            
            ctx.fillStyle = '#000';
            ctx.fillRect(cursorX - 3, barY - 5, 6, barH + 10);
            ctx.font = "20px sans-serif"; ctx.textBaseline="bottom";
            ctx.fillText("⚾", cursorX, barY - 5);
        }
    }

    ctx.textBaseline = "alphabetic";
    if (swingAnim > 0) {
        ctx.save();
        ctx.translate(W/2 - 20, H*0.75); 
        let rotation = (Math.PI / 1.5) * (1 - swingAnim/15);
        ctx.rotate(rotation);
        ctx.font = "70px sans-serif"; ctx.fillText("🏏", -10, 0);
        ctx.restore();
        ctx.font = "80px sans-serif"; ctx.fillText("🧍", W/2 - 60, H*0.8);
        swingAnim--;
    } else {
        ctx.font = "80px sans-serif"; ctx.fillText("🧍", W/2 - 60, H*0.8);
        ctx.font = "60px sans-serif"; ctx.fillText("🏏", W/2 - 35, H*0.75);
    }

    if (state === 'pitch' || state === 'wait') {
        let bx = W/2; let by = H*0.33;
        if (state === 'pitch') {
            bx = W/2 + (ball.endX - W/2) * ball.t;
            by = H*0.33 + (H*0.75 - H*0.33) * ball.t;
        }
        ctx.font = "30px sans-serif"; ctx.textBaseline="middle";
        ctx.fillText("⚾", bx, by);
    }
}

function drawStadiumView() {
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.moveTo(W/2, H*0.8); ctx.lineTo(W/2+100, H*0.6); ctx.lineTo(W/2, H*0.4); ctx.lineTo(W/2-100, H*0.6); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.fillRect(W/2-15, H*0.8-10, 30, 20); ctx.fillRect(W/2+90, H*0.6-10, 20, 20);
    ctx.fillRect(W/2-10, H*0.4-10, 20, 20); ctx.fillRect(W/2-110, H*0.6-10, 20, 20);
    ctx.strokeStyle = '#0277bd'; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.arc(W/2, H*0.8, H*0.55, Math.PI*1.1, Math.PI*1.9); ctx.stroke();

    if (state === 'fly') {
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath(); ctx.ellipse(flyBall.x, H*0.8 - (H*0.8 - flyBall.y)*0.8, 15*flyBall.scale, 5*flyBall.scale, 0, 0, Math.PI*2); ctx.fill();
        ctx.font = (20 * flyBall.scale) + "px sans-serif";
        ctx.fillText("⚾", flyBall.x, flyBall.y);
    }
}

// --- メインループ ---
function update() {
    if (state === 'pitch') {
        ball.t += ball.speed;
        if (ball.t > 1.3) {
            playSound('out'); showMsg("ストライク！", "#ffeb3b");
            state = 'result'; timer = 90;
        }
    } else if (state === 'fly') {
        flyBall.x += flyBall.vx; flyBall.y += flyBall.vy; flyBall.vy += flyBall.gravity;
        flyBall.timer++;
        
        if (flyBall.vy < 0) flyBall.scale += 0.03; else flyBall.scale = Math.max(0.5, flyBall.scale - 0.03);

        if (flyBall.timer > flyBall.maxTime) {
            state = 'result'; timer = 120;
            if (ball.hitState === 2) {
                playSound('homerun'); showMsg("すごい！\nホームラン！", "#ffd700");
                hrCount++; UI_HR.innerText = hrCount;
            } else {
                playSound('out'); showMsg("おしい！\nフライだ...", "#90caf9");
            }
        }
    } else if (state === 'result') {
        timer--;
        if (timer <= 0) {
            hideMsg();
            if (pitchCount >= MAX_PITCHES) endGame(); else nextPitch();
        }
    }

    if (state === 'fly' || (state === 'result' && ball.hitState > 0)) drawStadiumView();
    else drawBatterView();
    
    requestAnimationFrame(update);
}

// --- ゲーム進行制御 ---
function startGame(level) {
    currentDiff = level;
    initAudio();
    document.getElementById('start-screen').classList.add('hide');
    document.getElementById('result-screen').classList.add('hide');
    SWING_BTN.classList.remove('hide');
    pitchCount = 0; hrCount = 0;
    UI_PITCH.innerText = pitchCount + 1; UI_HR.innerText = hrCount;
    hideMsg(); nextPitch();
}

function nextPitch() {
    pitchCount++;
    if(pitchCount <= MAX_PITCHES) UI_PITCH.innerText = pitchCount;
    ball.hitState = 0; state = 'wait';
    
    setTimeout(() => {
        ball.t = 0;
        ball.speed = 0.012 + Math.random() * 0.006;
        ball.endX = W/2 + (Math.random() - 0.5) * 120;
        playSound('pitch'); state = 'pitch';
    }, 1000);
}

function endGame() {
    SWING_BTN.classList.add('hide'); state = 'title';
    document.getElementById('final-score').innerText = hrCount;
    document.getElementById('result-screen').classList.remove('hide');
    if (hrCount >= 5) playSound('homerun'); else playSound('out');
}

function showStartScreen() {
    document.getElementById('result-screen').classList.add('hide');
    document.getElementById('start-screen').classList.remove('hide');
}

// --- スイング判定 ---
SWING_BTN.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state !== 'pitch') return;
    
    playSound('swing');
    swingAnim = 15;
    let timing = ball.t;
    let diffObj = DIFFICULTIES[currentDiff]; // 選択された難易度
    
    // ヒットの判定
    if (timing >= diffObj.hitMin && timing <= diffObj.hitMax) {
        playSound('hit');
        state = 'swinging';
        
        setTimeout(() => {
            state = 'fly';
            flyBall.x = W/2; flyBall.y = H*0.8; flyBall.scale = 1; flyBall.timer = 0;
            
            // ホームランの判定
            if (timing >= diffObj.hrMin && timing <= diffObj.hrMax) {
                ball.hitState = 2;
                flyBall.vx = (Math.random() - 0.5) * 6; flyBall.vy = -14;
                flyBall.gravity = 0.2; flyBall.maxTime = 70;
            } else { 
                ball.hitState = 1;
                flyBall.vx = (Math.random() - 0.5) * 10; flyBall.vy = -10;
                flyBall.gravity = 0.5; flyBall.maxTime = 40;
            }
        }, 150);
    } else {
        state = 'swinging';
        setTimeout(() => {
            if(state === 'swinging') {
                showMsg("からぶり！", "#ffeb3b");
                playSound('out'); state = 'result'; timer = 90;
            }
        }, 300);
    }
});

requestAnimationFrame(update);
</script>
</body>
</html>
