<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ホームランきょうそう</title>

<!-- PWA・全画面表示設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホームラン">

<!-- Service Worker 登録スクリプト -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>

<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * {
    box-sizing: border-box; user-select: none; -webkit-user-select: none;
    margin: 0; padding: 0; touch-action: none; font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
  }
  body {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: #87CEEB; display: flex; flex-direction: column;
  }
  #game-area {
    position: relative; flex: 1; width: 100%; max-width: 600px; margin: 0 auto;
    background: #4caf50; box-shadow: 0 0 15px rgba(0,0,0,0.2); overflow: hidden;
  }
  canvas {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  
  /* UI Overlay */
  #ui-layer {
    position: absolute; top: max(10px, var(--sat)); left: max(10px, var(--sal)); right: max(10px, var(--sar));
    display: flex; justify-content: space-between; pointer-events: none; padding: 0 10px; z-index: 10;
  }
  .hud-box {
    background: rgba(255, 255, 255, 0.9); border: 4px solid #388e3c; border-radius: 12px;
    padding: 8px 15px; font-size: clamp(16px, 5vw, 24px); font-weight: bold; color: #1b5e20;
    box-shadow: 0 4px 0 #2e7d32;
  }
  
  /* Messages */
  #message-box {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(32px, 8vw, 48px); font-weight: bold; text-align: center;
    color: white; text-shadow: 3px 3px 0 #d32f2f, -2px -2px 0 #d32f2f, 2px -2px 0 #d32f2f, -2px 2px 0 #d32f2f;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; width: 100%;
  }

  /* Controls */
  #controls {
    position: absolute; bottom: max(20px, var(--sab)); left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 400px; z-index: 30;
  }
  .swing-btn {
    width: 100%; padding: 20px 0; background: #ff5722; border: none; border-bottom: 8px solid #d84315;
    border-radius: 40px; font-size: clamp(28px, 7vw, 36px); font-weight: bold; color: white;
    cursor: pointer; pointer-events: auto; touch-action: manipulation; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  .swing-btn:active {
    transform: translateY(8px); border-bottom-width: 0px; margin-bottom: 8px; box-shadow: none;
  }

  /* Screens */
  .screen {
    position: absolute; inset: 0; background: rgba(255, 250, 240, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  h1 { font-size: clamp(36px, 10vw, 56px); color: #ff9800; margin-bottom: 20px; text-shadow: 2px 2px 0 #fff; text-align: center;}
  .desc { font-size: clamp(20px, 6vw, 28px); color: #333; margin-bottom: 40px; font-weight: bold; text-align: center; line-height: 1.5; }
  .start-btn {
    background: #4caf50; border-bottom: 8px solid #2e7d32; border-radius: 30px; padding: 15px 50px;
    font-size: clamp(24px, 7vw, 32px); color: white; font-weight: bold; border-left:none; border-right:none; border-top:none;
    cursor: pointer;
  }
  .start-btn:active { transform: translateY(8px); border-bottom-width: 0px; }
  
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="game-area">
  <canvas id="c"></canvas>
  
  <div id="ui-layer">
    <div class="hud-box"><span id="pitch-count">1</span>/10きゅう</div>
    <div class="hud-box">ホームラン: <span id="hr-count">0</span></div>
  </div>
  
  <div id="message-box"></div>
  
  <div id="controls">
    <button id="swing-btn" class="swing-btn hide">うつ！</button>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen">
    <h1>ホームラン<br>きょうそう⚾</h1>
    <div class="desc">ボールがきたら<br>タイミングよく<br>「うつ！」をおそう！</div>
    <button class="start-btn" onclick="startGame()">スタート</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="screen hide">
    <h1>おつかれさま！</h1>
    <div class="desc">ホームランの かず<br><span id="final-score" style="font-size: 1.5em; color: #d32f2f;">0</span> ほん</div>
    <button class="start-btn" onclick="showStartScreen()">もういっかい</button>
  </div>
</div>

<script>
// --- Web Audio API (効果音シンセサイザー) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let actx;

function initAudio() {
    if (!actx) actx = new AudioContext();
    if (actx.state === 'suspended') actx.resume();
}

function playSound(type) {
    if (!actx) return;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    const now = actx.currentTime;
    
    if (type === 'pitch') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'swing') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'homerun') {
        osc.type = 'square';
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            osc.frequency.setValueAtTime(freq, now + i*0.15);
        });
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.7);
        osc.start(now); osc.stop(now + 0.7);
    } else if (type === 'out') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
}

// --- Canvas & ゲーム設定 ---
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() {
    W = c.width = c.parentElement.clientWidth;
    H = c.height = c.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ゲーム状態変数
let state = 'title'; // title, wait, pitch, fly, result
let pitchCount = 0;
let hrCount = 0;
const MAX_PITCHES = 10;
let timer = 0;

// ボール情報
let ball = { t: 0, speed: 0, endX: 0, hitState: 0 }; // hitState: 0=なし, 1=フライ, 2=ホームラン
// 飛んでいくボール情報
let flyBall = { x: 0, y: 0, vx: 0, vy: 0, gravity: 0, scale: 1, timer: 0, maxTime: 0 };

const UI_PITCH = document.getElementById('pitch-count');
const UI_HR = document.getElementById('hr-count');
const MSG = document.getElementById('message-box');
const SWING_BTN = document.getElementById('swing-btn');

function showMsg(text, color) {
    MSG.innerText = text;
    MSG.style.color = color || 'white';
    MSG.style.opacity = 1;
}
function hideMsg() {
    MSG.style.opacity = 0;
}

// --- 画面描画ロジック ---
// 1. バッターボックス視点
function drawBatterView() {
    // 背景(芝生と空)
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, W, H*0.25);
    
    // ピッチャーマウンド
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.ellipse(W/2, H*0.35, 60, 20, 0, 0, Math.PI*2); ctx.fill();
    // ホームベース周りの土
    ctx.beginPath(); ctx.arc(W/2, H*0.8, 120, Math.PI, 0, true); ctx.fill();
    // ホームベース
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.moveTo(W/2, H*0.75); ctx.lineTo(W/2+20, H*0.73); ctx.lineTo(W/2+20, H*0.78); ctx.lineTo(W/2, H*0.82); ctx.lineTo(W/2-20, H*0.78); ctx.lineTo(W/2-20, H*0.73); ctx.fill();
    
    // ピッチャー(奥)
    ctx.font = "40px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText("🐒", W/2, H*0.35);

    // バッター(手前)
    ctx.font = "80px sans-serif";
    if (state === 'swinging') {
        ctx.save(); ctx.translate(W/2 - 60, H*0.8); ctx.rotate(-Math.PI/4); ctx.fillText("🏏", 0, 0); ctx.restore();
    } else {
        ctx.fillText("🧍", W/2 - 60, H*0.8);
    }

    // ボール描画
    if (state === 'pitch' || state === 'wait') {
        let bx = W/2; let by = H*0.33; let bSize = 10;
        if (state === 'pitch') {
            bx = W/2 + (ball.endX - W/2) * ball.t;
            by = H*0.33 + (H*0.75 - H*0.33) * ball.t;
            bSize = 10 + 35 * ball.t;
            // 影
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath(); ctx.ellipse(bx, H*0.35 + (H*0.8 - H*0.35)*ball.t, bSize*0.8, bSize*0.3, 0, 0, Math.PI*2); ctx.fill();
        }
        ctx.font = bSize*2 + "px sans-serif"; ctx.textBaseline="middle";
        ctx.fillText("⚾", bx, by);
    }
}

// 2. スタジアム全体視点 (飛んでいる時)
function drawStadiumView() {
    // 芝生と内野の土
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.moveTo(W/2, H*0.8); ctx.lineTo(W/2+100, H*0.6); ctx.lineTo(W/2, H*0.4); ctx.lineTo(W/2-100, H*0.6); ctx.fill();
    // ベース
    ctx.fillStyle = 'white';
    ctx.fillRect(W/2-15, H*0.8-10, 30, 20); // ホーム
    ctx.fillRect(W/2+90, H*0.6-10, 20, 20); // 1塁
    ctx.fillRect(W/2-10, H*0.4-10, 20, 20); // 2塁
    ctx.fillRect(W/2-110, H*0.6-10, 20, 20); // 3塁
    
    // 外野フェンス
    ctx.strokeStyle = '#0277bd'; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.arc(W/2, H*0.8, H*0.55, Math.PI*1.1, Math.PI*1.9); ctx.stroke();

    // 飛んでいるボール
    if (state === 'fly') {
        // 影
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath(); ctx.ellipse(flyBall.x, H*0.8 - (H*0.8 - flyBall.y)*0.8, 15*flyBall.scale, 5*flyBall.scale, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.font = (20 * flyBall.scale) + "px sans-serif";
        ctx.fillText("⚾", flyBall.x, flyBall.y);
    }
}

// --- メインループ ---
function update() {
    if (state === 'pitch') {
        ball.t += ball.speed;
        // 見逃し判定
        if (ball.t > 1.3) {
            playSound('out');
            showMsg("ストライク！", "#ffeb3b");
            state = 'result'; timer = 90;
        }
    } else if (state === 'fly') {
        // パラボラ軌道の計算（放物線）
        flyBall.x += flyBall.vx;
        flyBall.y += flyBall.vy;
        flyBall.vy += flyBall.gravity; // 重力を足す
        flyBall.timer++;
        
        // 上昇中は大きく、下降中は小さく
        if (flyBall.vy < 0) flyBall.scale += 0.03;
        else flyBall.scale = Math.max(0.5, flyBall.scale - 0.03);

        // ボールが落ち切ったら結果判定へ
        if (flyBall.timer > flyBall.maxTime) {
            state = 'result'; timer = 120;
            if (ball.hitState === 2) {
                playSound('homerun');
                showMsg("すごい！\nホームラン！", "#ffd700");
                hrCount++;
                UI_HR.innerText = hrCount;
            } else {
                playSound('out');
                showMsg("おしい！\nフライだ...", "#90caf9");
            }
        }
    } else if (state === 'result') {
        timer--;
        if (timer <= 0) {
            hideMsg();
            if (pitchCount >= MAX_PITCHES) endGame();
            else nextPitch();
        }
    }

    // 描画の切り替え
    if (state === 'fly' || (state === 'result' && ball.hitState > 0)) {
        drawStadiumView();
    } else {
        drawBatterView();
    }
    
    // アニメーションをループさせる
    requestAnimationFrame(update);
}

// --- ゲーム進行制御 ---
function startGame() {
    initAudio();
    document.getElementById('start-screen').classList.add('hide');
    document.getElementById('result-screen').classList.add('hide');
    SWING_BTN.classList.remove('hide');
    
    pitchCount = 0; hrCount = 0;
    UI_PITCH.innerText = pitchCount + 1; UI_HR.innerText = hrCount;
    hideMsg();
    nextPitch();
}

function nextPitch() {
    pitchCount++;
    if(pitchCount <= MAX_PITCHES) UI_PITCH.innerText = pitchCount;
    ball.hitState = 0;
    state = 'wait';
    
    setTimeout(() => {
        ball.t = 0;
        // 少し遅めにして子供向けに調整
        ball.speed = 0.01 + Math.random() * 0.015;
        ball.endX = W/2 + (Math.random() - 0.5) * 150;
        
        playSound('pitch');
        state = 'pitch';
    }, 1000);
}

function endGame() {
    SWING_BTN.classList.add('hide');
    state = 'title';
    document.getElementById('final-score').innerText = hrCount;
    document.getElementById('result-screen').classList.remove('hide');
    if (hrCount >= 5) playSound('homerun');
    else playSound('out');
}

function showStartScreen() {
    document.getElementById('result-screen').classList.add('hide');
    document.getElementById('start-screen').classList.remove('hide');
}

// --- スイング判定 (タップ操作) ---
SWING_BTN.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state !== 'pitch') return;
    
    playSound('swing');
    let timing = ball.t; // t=1.0 がホームベース真上
    
    // ヒットの判定（少し甘めに調整）
    if (timing >= 0.8 && timing <= 1.2) {
        playSound('hit');
        state = 'swinging';
        
        setTimeout(() => {
            state = 'fly';
            flyBall.x = W/2; flyBall.y = H*0.8; flyBall.scale = 1; flyBall.timer = 0;
            
            if (timing >= 0.9 && timing <= 1.1) {
                // ホームラン (ジャストミート)
                ball.hitState = 2;
                flyBall.vx = (Math.random() - 0.5) * 6;
                flyBall.vy = -14;
                flyBall.gravity = 0.2; // 滞空時間が長い
                flyBall.maxTime = 70;
            } else {
                // フライ
                ball.hitState = 1;
                flyBall.vx = (Math.random() - 0.5) * 10;
                flyBall.vy = -10;
                flyBall.gravity = 0.5; // すぐ落ちる
                flyBall.maxTime = 40;
            }
        }, 150);
    } else {
        // 空振り
        state = 'swinging';
        setTimeout(() => {
            if(state === 'swinging') {
                showMsg("からぶり！", "#ffeb3b");
                playSound('out');
                state = 'result'; timer = 90;
            }
        }, 300);
    }
});

// 【修正箇所】最初からアニメーションループを開始しておく
requestAnimationFrame(update);
</script>
</body>
</html>
