<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ガイドラインに基づくPWA・全画面表示のためのviewport設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>みちつくり</title>

<!-- PWA・全画面表示設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#87CEEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="みちつくり">

<!-- Service Worker 登録スクリプト -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>

<style>
* { user-select: none; touch-action: none; font-family: sans-serif; color: white; box-sizing: border-box; }
body, .s { margin: 0; background: skyblue; display: grid; place-items: center; height: 100vh; height: 100dvh; }
button { padding: 15px; border: 0; border-radius: 9px; font-size: 18px; font-weight: bold; margin: 5px; width: 220px; cursor: pointer; }
button:active { transform: scale(0.95); }
.s { position: fixed; inset: 0; z-index: 9; }
#T { display: flex; flex-direction: column; justify-content: center; align-items: center; }
#T h1 { text-shadow: 2px 2px blue; margin: 0 0 20px 0; font-size: 36px; }
#U { font-weight: bold; position: absolute; top: 10%; font-size: 24px; color: #333; text-shadow: 1px 1px white; }
canvas { display: none; background: green; box-shadow: 0 4px 9px rgba(0,0,0,.3); max-width: 100vw; max-height: 80vh; object-fit: contain; }
#R { display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); }
#M { font-size: 60px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="s" id="T">
  <h1>みちつくり🚗</h1>
  <button onclick="st(0)" style="background:lime">かんたん</button>
  <button onclick="st(1)" style="background:orange">ふつう</button>
  <button onclick="st(2)" style="background:tomato">むずかしい</button>
  <button onclick="st(3)" style="background:purple">超むずかしい</button>
</div>
<div id="U"></div>
<canvas id="C"></canvas>
<div class="s" id="R">
  <h1 id="M"></h1>
  <button onclick="rst()" style="background:hotpink">戻る</button>
</div>

<script>
let X = C.getContext('2d'),
    cD = [[0,1], [1,2], [2,3], [3,0], [0,2], [1,3]],
    dx = [0, 1, 0, -1],
    dy = [-1, 0, 1, 0],
    w, sz, ox, B, z, cS, cT, eD, hD, cP, cx, cy, iP, eDly, stTm, N, tot, wTm, sd;

const F = (c, x, y, W, H) => { X.fillStyle = c; X.fillRect(x, y, W, H); },
      S = (E, v) => { E.style.display = v; };

window.onresize = () => {
    sz = Math.min(innerWidth * .94 / (N + 2.2), innerHeight * .6 / N) | 0;
    w = sz * N;
    ox = sz * 1.1 | 0;
    C.width = w + ox * 2;
    C.height = w;
    X.textAlign = 'center';
    X.textBaseline = 'middle';
};

const st = (v) => {
    N = v < 2 ? 3 : 4;
    tot = N * N;
    onresize();
    B = N == 3 ? [5,2,0,-1,4,1,0,0,5] : [5,5,2,0,-1,0,4,0,0,0,0,2,0,0,0,0];
    z = N == 3 ? 3 : 4;
    wTm = [20, 15, 12, 6][v];
    sd = [.0018, .0025, .0035, .0055][v];
    
    for (let i = 0; i < [12, 40, 60, 150][v]; i++) {
        let m = [-N, N, -1, 1][~~(Math.random() * 4)], n = z + m;
        if (n >= 0 && n < tot && !(z % N == 0 && m == -1) && !(z % N == N - 1 && m == 1)) {
            B[z] = B[n]; B[n] = -1; z = n;
        }
    }
    S(T, 'none'); S(R, 'none'); S(U, 'block'); S(C, 'block');
    cS = -1; cP = iP = 1; eDly = 0; stTm = Date.now();
    lp();
};

const lp = () => {
    if (!iP) return;
    if (cS < 0) {
        let L = wTm - ~~((Date.now() - stTm) / 1000);
        if (L <= 0) {
            cS = 0; U.innerText = '🏁 出発！';
        } else {
            U.innerText = '⏳ 出発まで: ' + L + '秒';
            cx = ox - sz / 2; cy = sz / 2;
        }
    } else if (cS == 0) {
        cP += sd;
        cx = ox - sz + cP * sz;
        if (cP >= 1) {
            let t = B[0];
            if (t >= 0 && cD[t].includes(3)) {
                hD = cD[t][0] == 3 ? cD[t][1] : cD[t][0];
                cS = 1; cP = cT = 0; eD = 3;
            } else {
                cS = 2; 
            }
        }
    } else if (cS == 1) {
        cP += sd;
        let tx = ox + (cT % N) * sz, ty = ~~(cT / N) * sz, hx = tx + sz / 2, hy = ty + sz / 2;
        if (cP <= .5) {
            let p = cP * 2, sx = hx + dx[eD] * sz / 2, sy = hy + dy[eD] * sz / 2;
            cx = sx + (hx - sx) * p; cy = sy + (hy - sy) * p;
        } else {
            let p = (cP - .5) * 2, ex = hx + dx[hD] * sz / 2, ey = hy + dy[hD] * sz / 2;
            cx = hx + (ex - hx) * p; cy = hy + (ey - hy) * p;
        }
        if (cP >= 1) {
            let n = cT + (hD == 0 ? -N : hD == 1 ? 1 : hD == 2 ? N : -1);
            if (hD == 1 && cT % N == N - 1) {
                if (cT == tot - 1) { cS = 3; cP = 0; } 
                else cS = 2; 
            } else if (hD == 3 && cT % N == 0 || n < 0 || n >= tot) {
                cS = 2; 
            } else {
                cT = n; eD = (hD + 2) % 4;
                let t = B[n];
                if (t >= 0 && cD[t].includes(eD)) {
                    hD = cD[t][0] == eD ? cD[t][1] : cD[t][0]; cP = 0;
                } else {
                    cS = 2; 
                }
            }
        }
    } else if (cS == 3) {
        cP += sd; cx = ox + w + cP * sz; cy = (N - .5) * sz;
    }
    
    X.clearRect(0, 0, w + ox * 2, w);
    F('orange', ox - sz, 0, sz, sz);
    F('orange', ox + w, (N - 1) * sz, sz, sz);
    
    X.fillStyle = 'white';
    X.font = 'bold ' + (sz * .45) + 'px sans-serif';
    X.fillText('A', ox - sz / 2, sz / 2);
    X.fillText('B', ox + w + sz / 2, (N - .5) * sz);
    
    for (let i = 0; i < tot; i++) {
        let x = ox + (i % N) * sz, y = ~~(i / N) * sz;
        if (B[i] < 0) {
            F('rgba(0,0,0,.3)', x, y, sz, sz);
            continue;
        }
        F('lime', x + 1, y + 1, sz - 2, sz - 2);
        X.strokeStyle = 'white'; X.lineWidth = sz * .3; X.lineCap = 'round';
        X.beginPath();
        let Xc = x + sz / 2, Yc = y + sz / 2;
        cD[B[i]].map(d => {
            X.moveTo(Xc, Yc); X.lineTo(Xc + dx[d] * sz / 2, Yc + dy[d] * sz / 2);
        });
        X.stroke();
        
        if (cS == 1 && i == cT) F('rgba(255,0,0,.3)', x, y, sz, sz);
    }
    
    if (cS != 2 || ~~(Date.now() / 200) % 2 == 0) {
        X.font = (sz * .6) + 'px sans-serif';
        X.fillText('🚗', cx, cy);
    }
    
    if (cS > 1 && !eDly) {
        eDly = 1;
        setTimeout(() => {
            S(R, 'flex');
            document.getElementById('M').innerText = cS == 3 ? '🎉 クリア！' : '💥 失敗...';
            iP = 0;
        }, 1000);
    }
    if (iP) requestAnimationFrame(lp);
};

// 【修正箇所】クリック時のスケーリング計算を導入し、パネルのズレを解消
C.onpointerdown = e => {
    if (cS > 1) return;
    let r = C.getBoundingClientRect(),
        scaleX = C.width / r.width,
        scaleY = C.height / r.height,
        x = (e.clientX - r.left) * scaleX - ox,
        y = (e.clientY - r.top) * scaleY,
        i = ~~(y / sz) * N + ~~(x / sz);
        
    if (x < 0 || x >= w || y < 0 || y >= w || (cS == 1 && i == cT)) return;
    
    if ((i == z - 1 && z % N != 0) || (i == z + 1 && z % N != N - 1) || i == z - N || i == z + N) {
        B[z] = B[i]; B[i] = -1; z = i;
    }
};

const rst = () => {
    S(T, 'flex'); S(R, 'none'); S(U, 'none'); S(C, 'none');
};
</script>
</body>
</html>
