<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>お弁当づくりパズル - レベル＆仕切り実装版</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { overscroll-behavior: none; touch-action: none; background: #fdf6e3; margin: 0; padding: 0; font-family: 'Rounded M+ 1c', sans-serif; }
  body { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 450px; height: 100%; max-height: 850px;
    background: #ffecd2; background-image: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.2);
  }

  /* 上部UI */
  #header { padding: max(15px, var(--sat)) 15px 10px; display: flex; justify-content: space-between; align-items: center; }
  .level-box { background: rgba(255,255,255,0.8); padding: 8px 15px; border-radius: 20px; font-size: 18px; font-weight: 900; color: #c0392b; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .goal-box { background: rgba(255,255,255,0.8); padding: 8px 15px; border-radius: 20px; font-size: 16px; font-weight: bold; color: #2c3e50; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  
  /* お弁当箱（盤面 9x9） */
  #board-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
    background: #d35400; /* お弁当箱の底の色 */
    border: 8px solid #8e44ad; border-radius: 15px; padding: 4px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 10px 15px rgba(0,0,0,0.2);
    position: relative; box-sizing: border-box; gap: 2px;
  }
  
  .cell { background: rgba(255, 255, 255, 0.3); border-radius: 4px; transition: background 0.2s; box-sizing: border-box; }
  
  /* 💡 3x3の仕切りを太線で表現 */
  .cell.border-right { border-right: 4px solid #8e44ad; }
  .cell.border-bottom { border-bottom: 4px solid #8e44ad; }

  .cell.filled { box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; font-size: 24px; }
  
  /* 消去アニメーション */
  @keyframes flash { 0% { background: white; transform: scale(1.1); z-index: 10; } 100% { background: rgba(255,255,255,0.3); transform: scale(1); z-index: 1; } }
  .cell.clearing { animation: flash 0.4s ease-out; }

  /* 候補ブロック置き場（トレイ） */
  #tray { height: 160px; background: rgba(255,255,255,0.5); border-top: 4px solid white; display: flex; justify-content: space-around; align-items: center; padding: 10px; padding-bottom: max(10px, var(--sab)); }
  .candidate-slot { width: 30%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
  
  /* ブロックコンテナ */
  .block-container { position: absolute; display: grid; gap: 2px; cursor: grab; user-select: none; z-index: 10; transition: transform 0.1s; }
  .block-container.dragging { z-index: 100; cursor: grabbing; transform: scale(1.0); opacity: 0.95; }
  .block-cell { border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.3); box-sizing: border-box; }

  /* オーバーレイ画面 */
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .title { font-size: 34px; color: #f1c40f; font-weight: 900; margin-bottom: 15px; text-shadow: 2px 2px 0 #d35400; text-align: center; line-height: 1.4; }
  .desc { background:white; color:#333; padding:20px; border-radius:15px; font-weight:bold; width:85%; text-align:center; line-height:1.6; }
  .btn { padding: 15px 40px; font-size: 22px; font-weight: bold; color: white; background: #e67e22; border: none; border-radius: 30px; box-shadow: 0 6px 0 #d35400; cursor: pointer; margin-top: 20px; transition: 0.1s; }
  .btn:active { transform: translateY(6px); box-shadow: none; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <div class="level-box">LEVEL <span id="ui-level">1</span></div>
    <div class="goal-box">目標: <span id="ui-goal">3</span> 回食べる！</div>
  </div>
  
  <div id="board-container">
    <div id="board"></div>
  </div>

  <div id="tray">
    <div class="candidate-slot" id="slot-0"></div>
    <div class="candidate-slot" id="slot-1"></div>
    <div class="candidate-slot" id="slot-2"></div>
  </div>

  <div id="start-screen" class="overlay show">
    <div class="title">🍱 お弁当づくり<br>ブロックパズル</div>
    <div class="desc">
      おかずをスワイプして詰めよう！<br><br>
      <b>「タテ1列」「ヨコ1列」</b>または<br>
      <b>「3×3の仕切り」</b>をすべて埋めると<br>
      パクッと食べられるよ😋<br><br>
      ※レベルが上がると、苦手な<br>お邪魔ピーマン(🫑)が出現！
    </div>
    <button class="btn" onclick="startGame(1)">スタート！</button>
  </div>

  <div id="level-clear" class="overlay">
    <h1 style="color:#2ecc71; font-size:40px; margin-bottom:10px;">ごちそうさま！</h1>
    <div class="desc" style="margin-bottom:20px; background:#e8f8f5;">
      目標達成！お弁当を完食したよ🎉<br>
      次はもっと難しいお弁当に挑戦だ！
    </div>
    <button class="btn" style="background:#27ae60; box-shadow:0 6px 0 #1e8449;" onclick="nextLevel()">次のレベルへ</button>
  </div>

  <div id="game-over" class="overlay">
    <h1 style="color:#e74c3c; font-size:40px; margin-bottom:10px;">おなかいっぱい…</h1>
    <div class="desc" style="margin-bottom:20px; background:#fdedec;">
      もうおかずを置く場所がないよ💦<br>
      すき間なく詰めるのがコツ！
    </div>
    <button class="btn" style="background:#e74c3c; box-shadow:0 6px 0 #c0392b;" onclick="startGame(currentLevel)">リトライ</button>
  </div>
</div>

<script>
// --- 音声 ---
let actx;
function initAudio() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); }
function playSound(type) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  if (type === 'put') { 
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  } else if (type === 'clear') { 
    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(1000, t+0.1); osc.frequency.setValueAtTime(1200, t+0.2);
    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'error') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    osc.start(t); osc.stop(t + 0.15);
  }
}

// --- ゲーム設定 ---
const BOARD_SIZE = 9;
let board = [];
let currentLevel = 1;
let targetClears = 0;
let currentClears = 0;
let cellSize = 0; // 盤面の1マスのサイズ（ドラッグ時の補正用）

const SHAPES = [
  { icon: '🍅', color: '#e74c3c', shape: [[1]] },
  { icon: '🥚', color: '#f1c40f', shape: [[1,1]] },
  { icon: '🥚', color: '#f1c40f', shape: [[1],[1]] },
  { icon: '🍙', color: '#ecf0f1', shape: [[1,1],[1,1]] },
  { icon: '🌭', color: '#d35400', shape: [[1,1,1]] },
  { icon: '🌭', color: '#d35400', shape: [[1],[1],[1]] },
  { icon: '🥦', color: '#27ae60', shape: [[1,0],[1,1]] },
  { icon: '🥦', color: '#27ae60', shape: [[1,1],[1,0]] },
  { icon: '🍤', color: '#f39c12', shape: [[1,1,1,1]] },
  { icon: '🍤', color: '#f39c12', shape: [[1],[1],[1],[1]] },
  { icon: '🥩', color: '#8e44ad', shape: [[1,1,1],[1,1,1]] },
  { icon: '🍄', color: '#cd6155', shape: [[0,1,0],[1,1,1]] } // キノコ追加
];

let candidates = [null, null, null];

// --- 初期化と描画 ---
const boardEl = document.getElementById('board');

function initBoard() {
  board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
  boardEl.innerHTML = '';
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      let cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      
      // 💡 3x3の仕切り線を表現（2、5行/列目の右下にボーダーを追加）
      if (r % 3 === 2 && r !== 8) cell.classList.add('border-bottom');
      if (c % 3 === 2 && c !== 8) cell.classList.add('border-right');
      
      boardEl.appendChild(cell);
    }
  }
  
  // マスのサイズを計算（ドラッグ時のスナップ精度向上のため）
  const updateCellSize = () => {
    const boardRect = boardEl.getBoundingClientRect();
    // padding(4px * 2) と border(8px * 2) を引いて、gap(2px * 8)を考慮した正確なセルサイズ
    cellSize = (boardRect.width - 24 - 16) / BOARD_SIZE; 
  };
  updateCellSize();
  window.addEventListener('resize', updateCellSize);
  setTimeout(updateCellSize, 100); // 描画直後のズレ防止
}

function updateBoardView() {
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      let cell = document.getElementById(`cell-${r}-${c}`);
      let val = board[r][c];
      if (val) {
        cell.className = `cell filled ${cell.classList.contains('border-bottom') ? 'border-bottom' : ''} ${cell.classList.contains('border-right') ? 'border-right' : ''}`;
        cell.style.backgroundColor = val.color;
        cell.innerText = val.icon;
      } else {
        cell.className = `cell ${cell.classList.contains('border-bottom') ? 'border-bottom' : ''} ${cell.classList.contains('border-right') ? 'border-right' : ''}`;
        cell.style.backgroundColor = '';
        cell.innerText = '';
      }
    }
  }
}

// 💡 レベル初期化（お邪魔ブロックの配置など）
function loadLevel(level) {
  currentLevel = level;
  document.getElementById('ui-level').innerText = currentLevel;
  
  // レベル×2回の消去が必要
  targetClears = 2 + currentLevel;
  currentClears = 0;
  updateGoalUI();
  
  initBoard();
  candidates = [null, null, null];
  
  // お邪魔ブロック（ピーマン）の配置
  let numObstacles = Math.floor(currentLevel * 1.5);
  let placed = 0;
  while(placed < numObstacles) {
    let r = Math.floor(Math.random() * BOARD_SIZE);
    let c = Math.floor(Math.random() * BOARD_SIZE);
    if (!board[r][c]) {
      board[r][c] = { icon: '🫑', color: '#117a65', isObstacle: true };
      placed++;
    }
  }
  updateBoardView();
  generateCandidates();
}

function updateGoalUI() {
  let remain = Math.max(0, targetClears - currentClears);
  document.getElementById('ui-goal').innerText = remain;
}

function generateCandidates() {
  let emptyCount = 0;
  for (let i = 0; i < 3; i++) {
    if (!candidates[i]) {
      let shapeDef = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      candidates[i] = shapeDef;
      renderCandidate(i, shapeDef);
      emptyCount++;
    }
  }
  if (emptyCount > 0) setTimeout(checkGameOver, 100);
}

function renderCandidate(index, shapeDef) {
  const slot = document.getElementById(`slot-${index}`);
  slot.innerHTML = '';
  if (!shapeDef) return;

  const blockCont = document.createElement('div');
  blockCont.className = 'block-container';
  
  const rows = shapeDef.shape.length;
  const cols = shapeDef.shape[0].length;
  // トレイ上では少し小さめ(30px)で表示
  const trayCellSize = 30;
  blockCont.style.gridTemplateColumns = `repeat(${cols}, ${trayCellSize}px)`;
  blockCont.style.gridTemplateRows = `repeat(${rows}, ${trayCellSize}px)`;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (shapeDef.shape[r][c]) {
        let cell = document.createElement('div');
        cell.className = 'block-cell';
        cell.style.backgroundColor = shapeDef.color;
        cell.innerText = shapeDef.icon;
        cell.style.gridRow = r + 1;
        cell.style.gridColumn = c + 1;
        cell.style.width = `${trayCellSize}px`;
        cell.style.height = `${trayCellSize}px`;
        cell.style.fontSize = '20px';
        blockCont.appendChild(cell);
      }
    }
  }

  slot.appendChild(blockCont);
  setupDrag(blockCont, index, shapeDef);
}

// --- 💡 ドラッグ＆ドロップ処理（スナップ精度の大幅向上） ---
function setupDrag(blockEl, index, shapeDef) {
  blockEl.addEventListener('pointerdown', (e) => {
    initAudio();
    blockEl.classList.add('dragging');
    
    const rows = shapeDef.shape.length;
    const cols = shapeDef.shape[0].length;

    // 💡 掴んだ瞬間に、ブロックのサイズを「盤面のセルサイズ」と全く同じに拡大する！
    // これにより、盤面上に持っていったときの配置ズレが100%なくなる。
    blockEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    blockEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
    
    Array.from(blockEl.children).forEach(c => {
      c.style.width = `${cellSize}px`;
      c.style.height = `${cellSize}px`;
      c.style.fontSize = '24px';
    });

    const rect = blockEl.getBoundingClientRect();
    // 指の位置とブロックの左上との距離（オフセット）を記憶
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;

    document.body.appendChild(blockEl);
    
    // 指で隠れないように、Y方向に少し上にずらして持つ（-40px）
    const yShift = 40;
    blockEl.style.left = `${e.clientX - offsetX}px`;
    blockEl.style.top = `${e.clientY - offsetY - yShift}px`;

    function onMove(ev) {
      blockEl.style.left = `${ev.clientX - offsetX}px`;
      blockEl.style.top = `${ev.clientY - offsetY - yShift}px`;
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      blockEl.classList.remove('dragging');

      // ブロックの現在の「見た目の左上座標」を取得
      const finalRect = blockEl.getBoundingClientRect();
      const boardRect = boardEl.getBoundingClientRect();
      
      // 盤面の左上（ボーダーやパディングの内側）を基準にした相対座標
      let relX = finalRect.left - (boardRect.left + 12); // border8 + padding4
      let relY = finalRect.top - (boardRect.top + 12);
      
      // 相対座標をセルサイズで割って、最も近い行・列を算出
      // gap(2px) も考慮して割る
      let targetC = Math.round(relX / (cellSize + 2));
      let targetR = Math.round(relY / (cellSize + 2));

      if (canPlace(shapeDef.shape, targetR, targetC)) {
        placeShape(shapeDef, targetR, targetC);
        candidates[index] = null;
        blockEl.remove();
        playSound('put');
        checkLines();
        
        if (!candidates[0] && !candidates[1] && !candidates[2]) {
          generateCandidates();
        } else {
          checkGameOver();
        }
      } else {
        playSound('error');
        // トレイに戻す時はサイズを元(30px)に戻す
        blockEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
        blockEl.style.gridTemplateRows = `repeat(${rows}, 30px)`;
        Array.from(blockEl.children).forEach(c => {
          c.style.width = '30px'; c.style.height = '30px'; c.style.fontSize = '20px';
        });
        document.getElementById(`slot-${index}`).appendChild(blockEl);
        blockEl.style.left = '';
        blockEl.style.top = '';
      }
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
  
  blockEl.ondragstart = () => false;
}

function canPlace(shapeMatrix, startR, startC) {
  const rows = shapeMatrix.length;
  const cols = shapeMatrix[0].length;
  
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (shapeMatrix[r][c]) {
        let boardR = startR + r;
        let boardC = startC + c;
        if (boardR < 0 || boardR >= BOARD_SIZE || boardC < 0 || boardC >= BOARD_SIZE) return false; 
        if (board[boardR][boardC] !== null) return false; 
      }
    }
  }
  return true;
}

function placeShape(shapeDef, startR, startC) {
  const shapeMatrix = shapeDef.shape;
  for (let r = 0; r < shapeMatrix.length; r++) {
    for (let c = 0; c < shapeMatrix[0].length; c++) {
      if (shapeMatrix[r][c]) {
        board[startR + r][startC + c] = { color: shapeDef.color, icon: shapeDef.icon, isObstacle: false };
      }
    }
  }
  updateBoardView();
}

// 💡 縦、横、および「3x3の仕切り」の消去判定
function checkLines() {
  let linesToClear = { rows: [], cols: [], areas: [] };

  // 1. 行のチェック
  for (let r = 0; r < BOARD_SIZE; r++) {
    if (board[r].every(cell => cell !== null)) linesToClear.rows.push(r);
  }
  
  // 2. 列のチェック
  for (let c = 0; c < BOARD_SIZE; c++) {
    let colFull = true;
    for (let r = 0; r < BOARD_SIZE; r++) {
      if (board[r][c] === null) { colFull = false; break; }
    }
    if (colFull) linesToClear.cols.push(c);
  }

  // 3. 💡 3x3エリア（仕切りの中）のチェック
  for (let ar = 0; ar < 3; ar++) {
    for (let ac = 0; ac < 3; ac++) {
      let areaFull = true;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (board[ar * 3 + r][ac * 3 + c] === null) { areaFull = false; break; }
        }
        if (!areaFull) break;
      }
      if (areaFull) linesToClear.areas.push({ r: ar * 3, c: ac * 3 });
    }
  }

  let totalClears = linesToClear.rows.length + linesToClear.cols.length + linesToClear.areas.length;

  if (totalClears > 0) {
    playSound('clear');
    currentClears += totalClears;
    updateGoalUI();
    
    // アニメーション用にクラスを追加
    linesToClear.rows.forEach(r => {
      for (let c = 0; c < BOARD_SIZE; c++) document.getElementById(`cell-${r}-${c}`).classList.add('clearing');
    });
    linesToClear.cols.forEach(c => {
      for (let r = 0; r < BOARD_SIZE; r++) document.getElementById(`cell-${r}-${c}`).classList.add('clearing');
    });
    linesToClear.areas.forEach(pos => {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) document.getElementById(`cell-${pos.r + r}-${pos.c + c}`).classList.add('clearing');
      }
    });

    // 消去とクリア判定
    setTimeout(() => {
      linesToClear.rows.forEach(r => { for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = null; });
      linesToClear.cols.forEach(c => { for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = null; });
      linesToClear.areas.forEach(pos => {
        for (let r = 0; r < 3; r++) { for (let c = 0; c < 3; c++) board[r + r][pos.c + c] = null; }
      });
      
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) document.getElementById(`cell-${r}-${c}`).classList.remove('clearing');
      }
      
      updateBoardView();
      
      if (currentClears >= targetClears) {
        // 目標達成！
        setTimeout(() => {
          document.getElementById('level-clear').classList.add('show');
        }, 300);
      } else {
        checkGameOver();
      }
    }, 400);
  }
}

function checkGameOver() {
  if (currentClears >= targetClears) return; // すでにクリア済みならスキップ
  
  let canPlay = false;
  for (let i = 0; i < 3; i++) {
    if (candidates[i]) {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (canPlace(candidates[i].shape, r, c)) {
            canPlay = true; break;
          }
        }
        if (canPlay) break;
      }
    }
    if (canPlay) break;
  }

  if (!canPlay) {
    setTimeout(() => {
      document.getElementById('game-over').classList.add('show');
    }, 500);
  }
}

function startGame(level) {
  initAudio();
  document.querySelectorAll('.overlay').forEach(el => el.classList.remove('show'));
  loadLevel(level);
}

function nextLevel() {
  startGame(currentLevel + 1);
}

// 初回読み込み時は描画だけしておく
initBoard();
</script>
</body>
</html>
