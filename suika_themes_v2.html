<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>くっつき知育スイカ</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  
  /* スマホの誤爆操作を完全ブロック */
  html, body { overscroll-behavior: none; touch-action: none; background: #2c3e50; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif; }
  
  body { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 400px; height: 100%; max-height: 750px;
    background: #ecf0f1; display: flex; flex-direction: column;
    box-shadow: 0 0 30px rgba(0,0,0,0.5); overflow: hidden;
  }

  /* 上部のスコア＆UIエリア */
  #ui-top {
    flex-shrink: 0; padding: max(15px, var(--sat)) 20px 10px;
    background: #34495e; color: white; display: flex; justify-content: space-between; align-items: center;
    z-index: 20; border-bottom: 4px solid #2c3e50;
  }
  .score-box { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
  .next-box {
    background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px;
    display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 14px;
  }
  #next-kanji {
    width: 36px; height: 36px; background: white; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    color: #333; font-size: 18px; font-weight: bold; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }

  /* ゲーム盤面エリア */
  #canvas-container { flex: 1; position: relative; background: #fdf6e3; overflow: hidden; width: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ゲームオーバー時のオーバーレイ */
  #game-over {
    position: absolute; inset: 0; background: rgba(44, 62, 80, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.5s;
  }
  #game-over.show { opacity: 1; pointer-events: auto; }
  #game-over h1 { color: #e74c3c; font-size: 40px; margin-bottom: 10px; text-shadow: 3px 3px 0 #fff; }
  #game-over .final-score { color: white; font-size: 24px; font-weight: bold; margin-bottom: 30px; }
  .retry-btn {
    padding: 15px 40px; font-size: 22px; font-weight: bold; color: white;
    background: #27ae60; border: none; border-radius: 30px;
    box-shadow: 0 6px 0 #1e8449; cursor: pointer;
  }
  .retry-btn:active { transform: translateY(6px); box-shadow: none; }

  /* 遊び方説明・テーマ選択画面 */
  #start-screen {
    position: absolute; inset: 0; background: rgba(253, 246, 226, 0.98);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 200; padding: 20px;
  }
  .title-logo { font-size: clamp(30px, 8vw, 38px); color: #c0392b; font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px 0 #fff, 4px 4px 0 #f39c12; text-align: center; line-height: 1.2;}
  
  .theme-box { background: white; border: 3px solid #f39c12; padding: 15px; border-radius: 16px; margin-bottom: 25px; width: 100%; max-width: 320px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
  .theme-title { font-weight: bold; color: #d35400; text-align: center; margin-bottom: 10px; font-size: 15px; }
  .theme-btn {
    width: 100%; padding: 12px; margin-bottom: 8px; font-size: 16px; font-weight: bold;
    border-radius: 10px; border: 2px solid #ecd8ba; background: #fffdf9; color: #6d4c20;
    cursor: pointer; transition: 0.1s;
  }
  .theme-btn.active { background: #e67e22; color: white; border-color: #d35400; box-shadow: 0 3px 0 #d35400; }
  
  .start-btn { padding: 16px 50px; font-size: 24px; font-weight: bold; color: white; background: #27ae60; border: none; border-radius: 40px; box-shadow: 0 6px 0 #1e8449; cursor: pointer; }
  .start-btn:active { transform: translateY(6px); box-shadow: none; }

  #header-btn-home { position: absolute; top: max(15px, var(--sat)); left: 15px; background: rgba(0,0,0,0.3); border: none; color: white; padding: 6px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; z-index: 50; cursor: pointer; }
</style>
</head>
<body>

<div id="game-wrapper">
  <button id="header-btn-home" onclick="showMenu()">◀ メニュー</button>
  
  <div id="ui-top">
    <div style="width:70px;"></div>
    <div class="score-box">SCORE: <span id="score">0</span></div>
    <div class="next-box">つぎ <div id="next-kanji">木</div></div>
  </div>

  <div id="canvas-container">
    <canvas id="c"></canvas>
  </div>

  <div id="game-over">
    <h1>あふれた！</h1>
    <div class="final-score">スコア: <span id="result-score">0</span></div>
    <button class="retry-btn" onclick="initGame()">もういちど！</button>
  </div>

  <div id="start-screen">
    <div class="title-logo">🍉くっつき<br>知育スイカ</div>
    
    <div class="theme-box">
      <div class="theme-title">あそぶテーマをえらぶ</div>
      <button class="theme-btn active" onclick="selectTheme('kanji')">🌳 くっつき漢字合体</button>
      <button class="theme-btn" onclick="selectTheme('money')">💰 お金の進化</button>
      <button class="theme-btn" onclick="selectTheme('planet')">🌍 宇宙の大きさ</button>
    </div>
    
    <button class="start-btn" onclick="startGame()">スタート！</button>
  </div>
</div>

<script>
// === 知育データ（テーマ別） ===
const THEME_DATA = {
  kanji: [
    { char: "一", read: "いち" }, { char: "二", read: "に" }, { char: "三", read: "さん" },
    { char: "木", read: "き" }, { char: "林", read: "はやし" }, { char: "森", read: "もり" },
    { char: "日", read: "ひ" }, { char: "昌", read: "あきらか" }, { char: "晶", read: "あきら" },
    { char: "炎", read: "ほのお" }, { char: "爆", read: "ばくはつ" }
  ],
  money: [
    { char: "①", read: "1えん" }, { char: "⑤", read: "5えん" }, { char: "⑩", read: "10えん" },
    { char: "㊿", read: "50えん" }, { char: "100", read: "100えん" }, { char: "500", read: "500えん" },
    { char: "千円", read: "1000えん" }, { char: "5千", read: "5000えん" }, { char: "1万", read: "1まんえん" },
    { char: "札束", read: "さつたば" }, { char: "金庫", read: "きんこ" }
  ],
  planet: [
    { char: "月", read: "つき" }, { char: "水星", read: "すいせい" }, { char: "火星", read: "かせい" },
    { char: "金星", read: "きんせい" }, { char: "地球", read: "ちきゅう" }, { char: "海王", read: "かいおうせい" },
    { char: "天王", read: "てんおうせい" }, { char: "土星", read: "どせい" }, { char: "木星", read: "もくせい" },
    { char: "太陽", read: "たいよう" }, { char: "銀河", read: "ぎんが" }
  ]
};

// 共通のサイズと色とスコア
const BASE_RADII = [16, 24, 34, 46, 60, 76, 94, 114, 136, 160, 186];
const BASE_COLORS = ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#a0c4ff", "#bdb2ff", "#ffc6ff", "#fffffc", "#ff9999", "#ff5555"];
const BASE_SCORES = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 100];

let currentTheme = 'kanji';
let currentTiers = [];

function selectTheme(theme) {
  currentTheme = theme;
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme));
  });
}

function buildTiers() {
  currentTiers = THEME_DATA[currentTheme].map((data, i) => ({
    char: data.char,
    read: data.read,
    r: BASE_RADII[i],
    color: BASE_COLORS[i],
    score: BASE_SCORES[i]
  }));
}

// === Audio ===
let actx;
function initAudio() {
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  if (actx.state === 'suspended') actx.resume();
}
function playDrop() {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(500, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
  gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
  osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t + 0.1);
}
function playMerge(tier) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.type = 'triangle'; 
  const baseFreq = 400 + tier * 60;
  osc.frequency.setValueAtTime(baseFreq, t); osc.frequency.setValueAtTime(baseFreq * 1.5, t + 0.05);
  gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
  osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t + 0.2);
}

// === Canvas & Game State ===
const c = document.getElementById('c'); const ctx = c.getContext('2d');
let W, H, dpr;
let balls = [], particles = [], floatingTexts = [];
let score = 0, nextTier = 0, currentX = 0;
let isGameOver = false, gameState = 'menu'; // 'menu', 'playing', 'gameover'
let dropCooldown = false;

// 物理演算（重力を前回の0.4から0.95へ大幅強化！）
const GRAVITY = 0.95;
const RESTITUTION = 0.15; // バウンドを抑えてサクサク感アップ
const SUBSTEPS = 8;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = c.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  c.width = W * dpr; c.height = H * dpr;
  ctx.resetTransform(); ctx.scale(dpr, dpr);
  if(gameState !== 'playing') currentX = W / 2;
}
window.addEventListener('resize', resize);

function showMenu() {
  gameState = 'menu';
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('game-over').classList.remove('show');
}

function startGame() {
  initAudio();
  buildTiers();
  document.getElementById('start-screen').style.display = 'none';
  initGame();
}

function initGame() {
  balls = []; particles = []; floatingTexts = [];
  score = 0; updateScore();
  isGameOver = false; gameState = 'playing'; dropCooldown = false;
  document.getElementById('game-over').classList.remove('show');
  resize(); pickNext();
  if(!window.animLoopStarted) { requestAnimationFrame(loop); window.animLoopStarted = true; }
}

function pickNext() {
  const maxDropTier = Math.min(3, Math.floor(score / 40) + 1);
  nextTier = Math.floor(Math.random() * maxDropTier);
  const nextEl = document.getElementById('next-kanji');
  nextEl.innerText = currentTiers[nextTier].char;
  nextEl.style.backgroundColor = currentTiers[nextTier].color;
  
  // 文字サイズ調整（文字数が長い場合）
  let len = currentTiers[nextTier].char.length;
  nextEl.style.fontSize = len > 2 ? '11px' : (len > 1 ? '14px' : '18px');
}

function updateScore() { document.getElementById('score').innerText = score; }

function spawnParticles(x, y, color) {
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 3;
    particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color: color });
  }
}

// ★ フリガナポップアップ追加
function spawnFloatingText(x, y, text) {
  floatingTexts.push({ x: x, y: y, text: text, life: 1.0 });
}

function updatePhysics(dt) {
  for (let b of balls) {
    b.vy += GRAVITY * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= 0.99; b.vy *= 0.99;
  }

  for (let b of balls) {
    if (b.x < b.r) { b.x = b.r; b.vx *= -RESTITUTION; }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -RESTITUTION; }
    if (b.y > H - b.r) { b.y = H - b.r; b.vy *= -RESTITUTION; }
  }

  let merges = [];
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      let a = balls[i], b = balls[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let distSq = dx*dx + dy*dy;
      let minDist = a.r + b.r;
      
      if (distSq < minDist * minDist) {
        let dist = Math.sqrt(distSq);
        if (dist === 0) { dist = 0.1; dx = 0.1; dy = 0; }

        if (a.tier === b.tier && a.tier < 10 && !a.marked && !b.marked) {
          a.marked = true; b.marked = true;
          merges.push({a: a, b: b}); continue;
        }

        let overlap = minDist - dist;
        let nx = dx / dist, ny = dy / dist;
        let totalMass = a.mass + b.mass;
        let aRatio = b.mass / totalMass, bRatio = a.mass / totalMass;

        a.x -= nx * overlap * aRatio; a.y -= ny * overlap * aRatio;
        b.x += nx * overlap * bRatio; b.y += ny * overlap * bRatio;

        let rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        let velAlongNormal = rvx * nx + rvy * ny;
        if (velAlongNormal < 0) {
          let jImpulse = -(1 + RESTITUTION) * velAlongNormal / (1 / a.mass + 1 / b.mass);
          a.vx -= jImpulse * nx / a.mass; a.vy -= jImpulse * ny / a.mass;
          b.vx += jImpulse * nx / b.mass; b.vy += jImpulse * ny / b.mass;
        }
      }
    }
  }

  if (merges.length > 0) {
    balls = balls.filter(b => !b.marked);
    for (let m of merges) {
      let nextT = m.a.tier + 1;
      let nx = (m.a.x + m.b.x) / 2, ny = (m.a.y + m.b.y) / 2;
      
      balls.push({
        x: nx, y: ny, vx: 0, vy: -3,
        tier: nextT, r: currentTiers[nextT].r, mass: currentTiers[nextT].r * currentTiers[nextT].r, marked: false
      });
      score += currentTiers[nextT].score;
      playMerge(nextT);
      spawnParticles(nx, ny, currentTiers[nextT].color);
      
      // ★合体時に読み方をポップアップ！
      spawnFloatingText(nx, ny, currentTiers[nextT].read);
    }
    updateScore();
  }
}

let overflowTimer = 0;
const GAMEOVER_Y = 120;

function checkGameOver() {
  if (gameState !== 'playing') return;
  let isOverflowing = false;
  for (let b of balls) {
    if (b.y - b.r < GAMEOVER_Y && Math.abs(b.vy) < 1.0) { isOverflowing = true; break; }
  }
  if (isOverflowing) {
    overflowTimer += 1/60;
    if (overflowTimer > 2.0) {
      gameState = 'gameover';
      document.getElementById('result-score').innerText = score;
      document.getElementById('game-over').classList.add('show');
    }
  } else { overflowTimer = 0; }
}

function loop() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'playing') {
    for (let i = 0; i < SUBSTEPS; i++) updatePhysics(1.0 / SUBSTEPS);
    checkGameOver();
  }

  // デッドライン
  ctx.strokeStyle = "rgba(231, 76, 60, 0.5)"; ctx.lineWidth = 3; ctx.setLineDash([10, 10]);
  ctx.beginPath(); ctx.moveTo(0, GAMEOVER_Y); ctx.lineTo(W, GAMEOVER_Y); ctx.stroke(); ctx.setLineDash([]);
  
  if(overflowTimer > 0 && gameState === 'playing') {
    ctx.fillStyle = `rgba(231, 76, 60, ${Math.sin(Date.now()/100)*0.2})`;
    ctx.fillRect(0, 0, W, GAMEOVER_Y);
  }

  // 落下ガイドと待機ボール
  if (!dropCooldown && gameState === 'playing') {
    ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(currentX, 40); ctx.lineTo(currentX, H); ctx.stroke();
    
    let tObj = currentTiers[nextTier];
    ctx.fillStyle = tObj.color;
    ctx.beginPath(); ctx.arc(currentX, 50, tObj.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#333"; 
    let fSize = tObj.char.length > 2 ? tObj.r*0.5 : (tObj.char.length > 1 ? tObj.r*0.65 : tObj.r*0.9);
    ctx.font = `bold ${fSize}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(tObj.char, currentX, 50);
  }

  // ボール描画
  for (let b of balls) {
    let tObj = currentTiers[b.tier];
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath(); ctx.arc(b.x, b.y + 4, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = tObj.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.stroke();

    ctx.fillStyle = "#333";
    let fSize = tObj.char.length > 2 ? b.r*0.5 : (tObj.char.length > 1 ? b.r*0.65 : b.r*0.9);
    ctx.font = `bold ${fSize}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(tObj.char, b.x, b.y + b.r*0.05);
  }

  // パーティクル
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.04;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6 * p.life, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // フリガナポップアップ演出
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y -= 2; ft.life -= 0.02;
    if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
    
    ctx.globalAlpha = ft.life;
    ctx.font = "bold 24px sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 5; ctx.strokeStyle = "#fff";
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = "#e74c3c";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1.0;
  }

  requestAnimationFrame(loop);
}

// === 操作 ===
function handleInput(clientX) {
  if (gameState !== 'playing') return;
  const rect = c.getBoundingClientRect(); const scaleX = c.width / rect.width;
  currentX = (clientX - rect.left) * scaleX / dpr;
  const maxR = currentTiers[nextTier].r;
  currentX = Math.max(maxR, Math.min(W - maxR, currentX));
}

function dropBall() {
  if (dropCooldown || gameState !== 'playing') return;
  playDrop();
  balls.push({ x: currentX, y: 50, vx: 0, vy: 0, tier: nextTier, r: currentTiers[nextTier].r, mass: currentTiers[nextTier].r * currentTiers[nextTier].r, marked: false });
  dropCooldown = true;
  setTimeout(() => { pickNext(); dropCooldown = false; }, 600); // クールダウンも短縮！
}

c.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); handleInput(e.clientX); });
c.addEventListener('pointermove', (e) => { e.preventDefault(); handleInput(e.clientX); });
c.addEventListener('pointerup', (e) => { e.preventDefault(); dropBall(); });
c.addEventListener('pointercancel', (e) => { e.preventDefault(); dropBall(); });

</script>
</body>
</html>
