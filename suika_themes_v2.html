<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>本格・知育スイカパズル</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  
  html, body { overscroll-behavior: none; touch-action: none; background: #e8dcc4; margin: 0; padding: 0; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif; }
  
  body { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  
  #game-wrapper {
    position: relative; width: calc(100% - 32px); max-width: 450px; height: calc(100% - 32px); max-height: 800px;
    background: #ecf0f1; display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; border-radius: 20px;
    margin: max(16px, var(--sat)) auto max(16px, var(--sab));
  }

  #header {
    flex-shrink: 0; padding: 12px 15px; background: #d35400; color: white;
    display: flex; justify-content: space-between; align-items: center; z-index: 20;
  }
  .header-btn { background: rgba(255,255,255,0.25); border: 2px solid white; color: white; padding: 6px 12px; border-radius: 15px; font-weight: bold; font-size: 13px; cursor: pointer; }
  
  .next-box {
    background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 20px;
    display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 13px;
  }
  #next-kanji {
    width: 30px; height: 30px; background: white; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    color: #333; font-size: 16px; font-weight: bold; box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .score-box { font-size: 16px; font-weight: bold; }

  #evolution-bar {
    flex-shrink: 0; background: #fff; padding: 10px 8px;
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 3px;
    border-bottom: 3px solid #ddd;
  }
  .evo-item { 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    background: #fdf6e3; border: 2px solid #ecd8ba; border-radius: 6px; 
    padding: 3px 5px; min-width: 32px; 
  }
  .evo-char { font-weight: bold; font-size: 13px; color: #333; }
  .evo-sub { font-size: 9px; color: #7f8c8d; margin-top: 1px; letter-spacing: -0.5px; }
  .evo-arrow { color: #bdc3c7; font-weight: bold; font-size: 11px; margin: 0 1px; }

  #canvas-container { flex: 1; position: relative; background: #fdf6e3; overflow: hidden; width: 100%; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #game-over {
    position: absolute; inset: 0; background: rgba(44, 62, 80, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.5s;
  }
  #game-over.show { opacity: 1; pointer-events: auto; }
  #game-over h1 { color: #e74c3c; font-size: 36px; margin-bottom: 10px; text-shadow: 2px 2px 0 #fff; }
  #game-over .final-score { color: white; font-size: 20px; font-weight: bold; margin-bottom: 25px; }
  .retry-btn { padding: 12px 30px; font-size: 20px; font-weight: bold; color: white; background: #27ae60; border: none; border-radius: 30px; box-shadow: 0 5px 0 #1e8449; cursor: pointer; }

  #start-screen {
    position: absolute; inset: 0; background: rgba(253, 246, 226, 0.98);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 200; padding: 20px;
  }
  .title-logo { font-size: clamp(26px, 7vw, 34px); color: #c0392b; font-weight: 900; margin-bottom: 25px; text-shadow: 2px 2px 0 #fff, 3px 3px 0 #f39c12; text-align: center; line-height: 1.3;}
  
  .theme-box { background: white; border: 3px solid #f39c12; padding: 15px; border-radius: 16px; margin-bottom: 25px; width: 100%; max-width: 320px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
  .theme-btn {
    width: 100%; padding: 12px 10px; margin-bottom: 8px; font-size: 15px; font-weight: bold;
    border-radius: 10px; border: 2px solid #ecd8ba; background: #fffdf9; color: #6d4c20;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
  }
  .theme-btn span.sub { font-size: 11px; font-weight: normal; margin-top: 4px; color: inherit; }
  .theme-btn.active { background: #e67e22; color: white; border-color: #d35400; box-shadow: 0 3px 0 #d35400; }
  
  .start-btn { padding: 16px 50px; font-size: 22px; font-weight: bold; color: white; background: #27ae60; border: none; border-radius: 40px; box-shadow: 0 6px 0 #1e8449; cursor: pointer; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <button class="header-btn" onclick="showMenu()">◀ メニュー</button>
    <div class="next-box">つぎ <div id="next-kanji"></div></div>
    <div class="score-box">SCORE: <span id="score">0</span></div>
  </div>

  <div id="evolution-bar"></div>

  <div id="canvas-container">
    <canvas id="c"></canvas>
  </div>

  <div id="game-over">
    <h1>あふれた！</h1>
    <div class="final-score">スコア: <span id="result-score">0</span></div>
    <button class="retry-btn" onclick="startGame()">もういちど！</button>
  </div>

  <div id="start-screen">
    <div class="title-logo">🍉本格物理！<br>知育パズルスイカ</div>
    
    <div class="theme-box">
      <div style="font-weight:bold; color:#d35400; text-align:center; margin-bottom:10px; font-size:14px;">あそぶテーマをえらぶ</div>
      
      <button class="theme-btn active" onclick="selectTheme('planet')">
        🌍 宇宙の大きさ
        <span class="sub">実際の体積比で星が進化！</span>
      </button>
      <button class="theme-btn" onclick="selectTheme('money')">
        💰 お金の進化
        <span class="sub">本物の硬貨・お札のサイズ比率！</span>
      </button>
      <button class="theme-btn" onclick="selectTheme('kanji')">
        🌳 漢字・部首合体
        <span class="sub">バラバラの部首（四角）を合体！</span>
      </button>
    </div>
    
    <button class="start-btn" onclick="startGame()">スタート！</button>
  </div>
</div>

<script>
// --- 誤爆防止 ---
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { 
  if (!e.target.closest('#evolution-bar')) { e.preventDefault(); }
}, { passive: false });

// --- 音声関連 ---
let actx;
function initAudio() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); }
function playSound(type, tier = 0) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  
  if (type === 'drop') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  } else if (type === 'merge') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(300 + tier * 50, t); osc.frequency.setValueAtTime(450 + tier * 50, t + 0.05);
    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  } else if (type === 'kanji_merge') { 
    osc.type = 'square'; osc.frequency.setValueAtTime(600, t); osc.frequency.setValueAtTime(800, t + 0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  }
}

// --- テーマ別データ定義（💡実際の比率に修正！） ---
const THEMES = {
  planet: {
    type: "linear",
    // 💡 実際の体積比（直径の立方根）に合わせたサイズ感！
    items: [
      { char: "月", sub: "3,474km", shape: "circle", r: 18, color: "#bdc3c7", score: 1 },
      { char: "水星", sub: "4,879km", shape: "circle", r: 20, color: "#85c1e9", score: 3 },
      { char: "火星", sub: "6,779km", shape: "circle", r: 22, color: "#e74c3c", score: 6 },
      { char: "金星", sub: "1.2万km", shape: "circle", r: 27, color: "#f1c40f", score: 10 },
      { char: "地球", sub: "1.2万km", shape: "circle", r: 28, color: "#2ecc71", score: 15 },
      { char: "海王星", sub: "4.9万km", shape: "circle", r: 43, color: "#3498db", score: 21 },
      { char: "天王星", sub: "5.0万km", shape: "circle", r: 44, color: "#1abc9c", score: 28 },
      { char: "土星", sub: "11.6万km", shape: "circle", r: 58, color: "#e67e22", score: 36 },
      { char: "木星", sub: "13.9万km", shape: "circle", r: 62, color: "#d35400", score: 45 },
      { char: "太陽", sub: "139万km", shape: "circle", r: 133, color: "#c0392b", score: 100 }
    ]
  },
  money: {
    type: "linear",
    // 💡 実際のミリ単位の比率！10円から50円への進化でサイズが小さくなるパズル要素
    items: [
      { char: "①", sub: "20.0mm", shape: "circle", r: 16, color: "#ecf0f1", score: 1, fric: 0.005, rest: 0.4 },
      { char: "⑤", sub: "22.0mm", shape: "circle", r: 17.6, color: "#f1c40f", score: 3, fric: 0.005, rest: 0.4 },
      { char: "⑩", sub: "23.5mm", shape: "circle", r: 18.8, color: "#e67e22", score: 6, fric: 0.005, rest: 0.4 },
      { char: "㊿", sub: "21.0mm", shape: "circle", r: 16.8, color: "#bdc3c7", score: 10, fric: 0.005, rest: 0.4 }, // 💡10円より小さい！
      { char: "100", sub: "22.6mm", shape: "circle", r: 18.1, color: "#ecf0f1", score: 15, fric: 0.005, rest: 0.4 },
      { char: "500", sub: "26.5mm", shape: "circle", r: 21.2, color: "#d4ac0d", score: 21, fric: 0.005, rest: 0.4 },
      // お札も現実の縦横比を再現
      { char: "千円", sub: "150mm", shape: "rect", w: 150, h: 76, color: "#a2d9ce", score: 30, fric: 0.8, rest: 0.05 },
      { char: "5千円", sub: "156mm", shape: "rect", w: 156, h: 76, color: "#d7bde2", score: 50, fric: 0.8, rest: 0.05 },
      { char: "1万円", sub: "160mm", shape: "rect", w: 160, h: 76, color: "#f5b041", score: 100, fric: 0.8, rest: 0.05 }
    ]
  },
  kanji: {
    type: "recipe",
    parts: [
      { char: "氵", shape: "rect", w: 25, h: 55, color: "#85c1e9", score: 1 },
      { char: "宀", shape: "rect", w: 60, h: 25, color: "#f5cba7", score: 1 },
      { char: "木", shape: "rect", w: 40, h: 40, color: "#a9dfbf", score: 1 },
      { char: "日", shape: "rect", w: 35, h: 35, color: "#f5b041", score: 1 },
      { char: "月", shape: "rect", w: 30, h: 50, color: "#f9e79f", score: 1 },
      { char: "人", shape: "rect", w: 25, h: 55, color: "#d7bde2", score: 1 }
    ],
    recipes: {
      "氵+木": { char: "沐", read: "もく", shape: "circle", r: 40, color: "#3498db", score: 10 },
      "宀+木": { char: "宋", read: "そう", shape: "circle", r: 40, color: "#d35400", score: 10 },
      "木+木": { char: "林", read: "はやし", shape: "circle", r: 40, color: "#27ae60", score: 10 },
      "日+月": { char: "明", read: "あかるい", shape: "circle", r: 40, color: "#f39c12", score: 10 },
      "人+木": { char: "休", read: "やすむ", shape: "circle", r: 40, color: "#9b59b6", score: 10 }
    },
    levels: [
      { char: "森", read: "もり", shape: "circle", r: 60, color: "#1e8449", score: 30 },
      { char: "晶", read: "あきら", shape: "circle", r: 85, color: "#e67e22", score: 60 },
      { char: "爆", read: "ばくはつ", shape: "circle", r: 120, color: "#c0392b", score: 150 }
    ]
  }
};

let currentTheme = 'planet';

// === Matter.js セットアップ ===
const Engine = Matter.Engine,
      Composite = Matter.Composite,
      Bodies = Matter.Bodies,
      Events = Matter.Events;

const engine = Engine.create();
engine.world.gravity.y = 1.2;

let L_WIDTH = 400;
let L_HEIGHT = 650; // resize()でスマホに合わせて自動調整
const GAMEOVER_Y = 120;

const c = document.getElementById('c');
const ctx = c.getContext('2d');
let displayScale = 1; // 💡 座標変換用のスケール

let score = 0;
let nextDrop = null;
let currentX = L_WIDTH / 2;
let gameState = 'menu'; 
let dropCooldown = false;
let pendingMerges = [];
let particles = [];
let floatTexts = [];
let overflowTimer = 0;

function selectTheme(theme) {
  currentTheme = theme;
  document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme)));
}

function showMenu() {
  gameState = 'menu';
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('game-over').classList.remove('show');
  if(engine) Composite.clear(engine.world);
}

function initUIBar() {
  const bar = document.getElementById('evolution-bar');
  bar.innerHTML = '';
  let themeObj = THEMES[currentTheme];
  
  if (themeObj.type === 'linear') {
    themeObj.items.forEach((item, i) => {
      let div = document.createElement('div'); div.className = 'evo-item';
      div.innerHTML = `<span class="evo-char">${item.char}</span><span class="evo-sub">${item.sub || ''}</span>`;
      bar.appendChild(div);
      if (i < themeObj.items.length - 1) {
        let arrow = document.createElement('div'); arrow.className = 'evo-arrow'; arrow.innerText = '▶';
        bar.appendChild(arrow);
      }
    });
  } else if (themeObj.type === 'recipe') {
    let txt = `<div style="width:100%; text-align:center; font-size:11px; font-weight:bold; color:#e67e22; margin-bottom:4px;">💡 部首(四角)を組み合わせて漢字(丸)を作ろう！</div>`;
    txt += `<div style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px;">`;
    txt += `<div class="evo-item"><span class="evo-char" style="font-size:12px;">氵+木=沐</span></div>`;
    txt += `<div class="evo-item"><span class="evo-char" style="font-size:12px;">木+木=林</span></div>`;
    txt += `<div class="evo-item"><span class="evo-char" style="font-size:12px;">日+月=明</span></div>`;
    txt += `<div class="evo-arrow">▶</div>`;
    txt += `<div class="evo-item"><span class="evo-sub">合体で</span><span class="evo-char" style="font-size:13px;">森</span></div>`;
    txt += `<div class="evo-arrow">▶</div>`;
    txt += `<div class="evo-item"><span class="evo-char" style="font-size:13px;">晶</span></div>`;
    txt += `<div class="evo-arrow">▶</div>`;
    txt += `<div class="evo-item"><span class="evo-char" style="font-size:13px;">爆</span></div>`;
    txt += `</div>`;
    bar.innerHTML = txt;
  }
}

function resize() {
  const rect = c.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = rect.width * dpr; 
  c.height = rect.height * dpr;
  
  // 💡 改善：画面の横幅から表示スケールを正確に計算
  displayScale = rect.width / L_WIDTH; 
  L_HEIGHT = rect.height / displayScale; // スマホの縦幅に合わせて床を下げる
  
  ctx.resetTransform(); 
  ctx.scale(displayScale * dpr, displayScale * dpr);
}
window.addEventListener('resize', resize);

function startGame() {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').classList.remove('show');
  initUIBar();
  resize();

  Composite.clear(engine.world);
  Engine.clear(engine);

  const wallOpt = { isStatic: true, render: { visible: false } };
  Composite.add(engine.world, [
    Bodies.rectangle(L_WIDTH/2, L_HEIGHT + 15, L_WIDTH + 100, 60, wallOpt), // 床
    Bodies.rectangle(-30, L_HEIGHT/2, 60, L_HEIGHT*2, wallOpt), // 左
    Bodies.rectangle(L_WIDTH+30, L_HEIGHT/2, 60, L_HEIGHT*2, wallOpt) // 右
  ]);

  score = 0; updateScore();
  particles = []; floatTexts = []; overflowTimer = 0; pendingMerges = [];
  gameState = 'playing'; dropCooldown = false;
  pickNext();
  if(!window.animLoop) { requestAnimationFrame(loop); window.animLoop = true; }
}

function updateScore() { document.getElementById('score').innerText = score; }

function pickNext() {
  let themeObj = THEMES[currentTheme];
  let maxTier = Math.min(3, Math.floor(score / 50) + 1);
  
  if (themeObj.type === 'linear') {
    let t = Math.floor(Math.random() * maxTier);
    nextDrop = { tier: t, ...themeObj.items[t] };
  } else {
    let idx = Math.floor(Math.random() * themeObj.parts.length);
    nextDrop = { type: 'part', idx: idx, ...themeObj.parts[idx] };
  }
  
  let nextEl = document.getElementById('next-kanji');
  if (nextEl) {
    nextEl.innerText = nextDrop.char;
    nextEl.style.backgroundColor = nextDrop.color;
    nextEl.style.fontSize = nextDrop.char.length > 1 ? '11px' : '16px';
    if(nextDrop.shape === 'rect') { nextEl.style.borderRadius = '6px'; } 
    else { nextEl.style.borderRadius = '50%'; }
  }
}

function createBodyObject(x, y, data) {
  let opt = {
    restitution: data.rest !== undefined ? data.rest : 0.3,
    friction: data.fric !== undefined ? data.fric : 0.1,
    density: 0.002
  };
  let body;
  if (data.shape === 'circle') { body = Bodies.circle(x, y, data.r, opt); } 
  else { opt.chamfer = { radius: 4 }; body = Bodies.rectangle(x, y, data.w, data.h, opt); }
  
  body.customData = data; 
  return body;
}

// === 合体イベント ===
Events.on(engine, 'collisionStart', function(event) {
  let pairs = event.pairs;
  for (let i = 0; i < pairs.length; i++) {
    let bodyA = pairs[i].bodyA; let bodyB = pairs[i].bodyB;
    let d1 = bodyA.customData;  let d2 = bodyB.customData;
    if (!d1 || !d2 || bodyA.isMarked || bodyB.isMarked) continue;

    let mergedData = null;
    let themeObj = THEMES[currentTheme];

    if (themeObj.type === 'linear') {
      if (d1.tier === d2.tier && d1.tier < themeObj.items.length - 1) {
        let nextT = d1.tier + 1;
        mergedData = { tier: nextT, ...themeObj.items[nextT] };
      }
    } else {
      if (d1.type === 'part' && d2.type === 'part') {
        let key1 = d1.char + "+" + d2.char; let key2 = d2.char + "+" + d1.char;
        let recipe = themeObj.recipes[key1] || themeObj.recipes[key2];
        if (recipe) mergedData = { type: 'lvl1', ...recipe };
      }
      else if (d1.type === 'lvl1' && d2.type === 'lvl1') mergedData = { type: 'lvl2', ...themeObj.levels[0] };
      else if (d1.type === 'lvl2' && d2.type === 'lvl2') mergedData = { type: 'lvl3', ...themeObj.levels[1] };
      else if (d1.type === 'lvl3' && d2.type === 'lvl3') mergedData = { type: 'lvl4', ...themeObj.levels[2] };
    }

    if (mergedData) {
      bodyA.isMarked = true; bodyB.isMarked = true;
      let nx = (bodyA.position.x + bodyB.position.x) / 2;
      let ny = (bodyA.position.y + bodyB.position.y) / 2;
      pendingMerges.push({ x: nx, y: ny, data: mergedData, bodyA: bodyA, bodyB: bodyB });
    }
  }
});

Events.on(engine, 'afterUpdate', function() {
  if (pendingMerges.length > 0) {
    for (let m of pendingMerges) {
      Composite.remove(engine.world, [m.bodyA, m.bodyB]);
      let newBody = createBodyObject(m.x, m.y, m.data);
      Matter.Body.setVelocity(newBody, { x: 0, y: -2 });
      Composite.add(engine.world, newBody);
      
      score += m.data.score;
      playSound(m.data.read ? 'kanji_merge' : 'merge', m.data.tier || 0);
      
      for (let i=0; i<15; i++) {
        let a = Math.random()*Math.PI*2, s = Math.random()*5+3;
        particles.push({ x: m.x, y: m.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color: m.data.color });
      }
      if (m.data.read) floatTexts.push({ x: m.x, y: m.y, text: m.data.read, life: 1 });
      else if (m.data.sub) floatTexts.push({ x: m.x, y: m.y, text: "進化！", life: 1 });
    }
    pendingMerges = []; updateScore();
  }
});

// 💡 改善：指のドラッグに完璧に追従する座標計算
function handleInput(clientX) {
  if (gameState !== 'playing' || !nextDrop) return;
  const rect = c.getBoundingClientRect();
  // displayScale で割ることで、スマホ上のピクセルをゲーム内の論理ピクセルに正確に変換
  let rawX = (clientX - rect.left) / displayScale;
  let w = nextDrop.shape === 'rect' ? nextDrop.w/2 : nextDrop.r;
  currentX = Math.max(w + 5, Math.min(L_WIDTH - w - 5, rawX));
}

function dropItem() {
  if (dropCooldown || gameState !== 'playing' || !nextDrop) return;
  playSound('drop');
  let newBody = createBodyObject(currentX, 50, nextDrop);
  Composite.add(engine.world, newBody);
  dropCooldown = true;
  setTimeout(() => { pickNext(); dropCooldown = false; }, 600);
}

let isMouseDown = false;
c.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); if(e.touches.length > 0) handleInput(e.touches[0].clientX); }, { passive: false });
c.addEventListener('touchmove', (e) => { e.preventDefault(); if(e.touches.length > 0) handleInput(e.touches[0].clientX); }, { passive: false });
c.addEventListener('touchend', (e) => { e.preventDefault(); dropItem(); }, { passive: false });
c.addEventListener('touchcancel', (e) => { e.preventDefault(); dropItem(); }, { passive: false });

c.addEventListener('mousedown', (e) => { e.preventDefault(); initAudio(); isMouseDown = true; handleInput(e.clientX); });
c.addEventListener('mousemove', (e) => { e.preventDefault(); if(isMouseDown) handleInput(e.clientX); });
window.addEventListener('mouseup', (e) => { if(isMouseDown) { isMouseDown = false; dropItem(); } });

function fillSafeRect(ctx, x, y, w, h) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.fill(); } 
  else { ctx.fillRect(x, y, w, h); }
}
function strokeSafeRect(ctx, x, y, w, h) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.stroke(); } 
  else { ctx.strokeRect(x, y, w, h); }
}

function drawBody(body) {
  let d = body.customData;
  if (!d) return; 
  
  ctx.translate(body.position.x, body.position.y);
  ctx.rotate(body.angle);
  
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  if (d.shape === 'circle') {
    ctx.beginPath(); ctx.arc(0, 5, d.r, 0, Math.PI*2); ctx.fill();
  } else {
    fillSafeRect(ctx, -d.w/2, -d.h/2 + 5, d.w, d.h);
  }

  ctx.fillStyle = d.color;
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.15)";
  if (d.shape === 'circle') {
    ctx.beginPath(); ctx.arc(0, 0, d.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else {
    fillSafeRect(ctx, -d.w/2, -d.h/2, d.w, d.h); strokeSafeRect(ctx, -d.w/2, -d.h/2, d.w, d.h);
  }

  ctx.fillStyle = "#333"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let fontSize = d.shape === 'circle' ? d.r*0.9 : Math.min(d.w, d.h)*0.5;
  if(d.shape === 'circle' && d.char.length > 2) fontSize *= 0.55;
  else if(d.shape === 'circle' && d.char.length > 1) fontSize *= 0.7;
  
  ctx.font = `bold ${fontSize}px sans-serif`;
  ctx.fillText(d.char, 0, 0);

  ctx.rotate(-body.angle);
  ctx.translate(-body.position.x, -body.position.y);
}

function loop() {
  if (gameState !== 'menu') {
    ctx.clearRect(0, 0, L_WIDTH, L_HEIGHT);

    if (gameState === 'playing') {
      Engine.update(engine, 1000 / 60);
    }

    // 床の描画
    ctx.fillStyle = "#d35400"; ctx.fillRect(0, L_HEIGHT - 15, L_WIDTH, 15);
    ctx.fillStyle = "#e67e22"; ctx.fillRect(0, L_HEIGHT - 15, L_WIDTH, 4);

    ctx.strokeStyle = "rgba(231, 76, 60, 0.6)"; ctx.lineWidth = 3; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(0, GAMEOVER_Y); ctx.lineTo(L_WIDTH, GAMEOVER_Y); ctx.stroke(); ctx.setLineDash([]);
    
    let isOverflowing = false;
    let bodies = Composite.allBodies(engine.world);
    for (let b of bodies) {
      if (b.isStatic || !b.customData) continue;
      let topY = b.position.y - (b.customData.shape === 'circle' ? b.customData.r : b.customData.h/2);
      if (topY < GAMEOVER_Y && b.speed < 1.0) { isOverflowing = true; break; }
    }
    
    if (isOverflowing && gameState === 'playing') {
      overflowTimer += 1/60;
      ctx.fillStyle = `rgba(231, 76, 60, ${Math.sin(Date.now()/100)*0.2})`;
      ctx.fillRect(0, 0, L_WIDTH, GAMEOVER_Y);
      if (overflowTimer > 2.0) {
        gameState = 'gameover';
        document.getElementById('result-score').innerText = score;
        document.getElementById('game-over').classList.add('show');
      }
    } else { overflowTimer = 0; }

    if (!dropCooldown && gameState === 'playing' && nextDrop) {
      ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(currentX, 40); ctx.lineTo(currentX, L_HEIGHT - 15); ctx.stroke();
      let dummyBody = { position: { x: currentX, y: 50 }, angle: 0, customData: nextDrop };
      drawBody(dummyBody);
    }

    for (let b of bodies) {
      if (b.isStatic || !b.customData) continue;
      drawBody(b);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6 * p.life, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      let ft = floatTexts[i]; ft.y -= 1.5; ft.life -= 0.02;
      if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
      ctx.globalAlpha = ft.life; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
      ctx.lineWidth = 5; ctx.strokeStyle = "#fff"; ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = "#e74c3c"; ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1.0;
  }
  requestAnimationFrame(loop);
}
</script>
</body>
