<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>おかいもの＆マイバッグ</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb74d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おかいもの">

<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * {
    box-sizing: border-box; user-select: none; -webkit-user-select: none;
    margin: 0; padding: 0; 
    touch-action: none; 
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
  }
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: #fff3e0; display: flex; flex-direction: column;
  }
  
  #opening-screen {
    position: fixed; inset: 0; background: #ffffff; z-index: 9999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .logo-container { text-align: center; animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  .logo-icon { font-size: clamp(50px, 15vw, 80px); margin-bottom: 10px; }
  .logo-text { font-size: clamp(24px, 7vw, 36px); font-weight: bold; color: #333; letter-spacing: 2px; }
  .logo-sub { font-size: clamp(18px, 5vw, 28px); font-weight: bold; color: #ff9800; letter-spacing: 4px; margin-top: 5px; }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  #game-wrapper {
    position: relative; flex: 1; width: 100%; max-width: 600px; margin: 0 auto;
    background: #ffe082; box-shadow: 0 0 20px rgba(0,0,0,0.1); 
    display: flex; flex-direction: column; overflow: hidden;
  }
  
  #header {
    position: absolute; top: max(10px, var(--sat)); left: 0; width: 100%;
    padding: 0 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
    pointer-events: none;
  }
  .status-box {
    background: rgba(255, 255, 255, 0.95); padding: 6px 12px; border-radius: 20px;
    font-size: clamp(13px, 4vw, 18px); font-weight: bold; color: #333;
    border: 3px solid #ffb74d; box-shadow: 0 4px 0 #f57c00; pointer-events: auto; cursor: pointer;
    white-space: nowrap;
  }
  #btn-switch {
    background: #ff9800; color: white; border-color: #f57c00;
  }
  #btn-switch:active { transform: translateY(4px); box-shadow: none; }
  
  canvas { display: block; flex: 1; width: 100%; min-height: 0; object-fit: cover; touch-action: none; }

  .screen {
    position: absolute; inset: 0; background: rgba(255, 243, 224, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  h1 { font-size: clamp(28px, 7vw, 40px); color: #e65100; margin-bottom: 15px; text-shadow: 2px 2px 0 #ffcc80; text-align: center;}
  
  .settings-box {
    background: #fff; border-radius: 15px; padding: 15px; width: 90%; max-width: 380px; margin-bottom: 20px;
    border: 3px solid #ffb74d; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .set-title { font-size: 18px; font-weight: bold; color: #555; margin-bottom: 10px; text-align: center; }
  .btn-row { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-bottom: 15px; }
  .opt-btn {
    width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border: 2px solid #aaa;
    border-radius: 8px; background: #fff; color: #555; cursor: pointer; text-align: center;
  }
  .opt-btn.active { background: #ff9800; color: white; border-color: #e65100; }

  .start-btn {
    padding: 15px 40px; font-size: 24px; font-weight: bold; color: white;
    background: #4caf50; border: none; border-radius: 30px; box-shadow: 0 6px 0 #388e3c;
  }
  .start-btn:active { transform: translateY(6px); box-shadow: none; }

  #message-popup {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
    font-size: clamp(30px, 8vw, 50px); font-weight: bold; text-align: center; width: 90%;
    color: #ffeb3b; text-shadow: 3px 3px 0 #f44336; z-index: 50; pointer-events: none;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    white-space: pre-wrap; line-height: 1.3;
  }
  #message-popup.show { transform: translate(-50%, -50%) scale(1); }
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="opening-screen">
  <div class="logo-container">
    <div class="logo-icon">📱👨‍💻✨</div>
    <div class="logo-text">めー＆SEパパ</div>
    <div class="logo-sub">GAMES</div>
  </div>
</div>

<div id="game-wrapper">
  <div id="header">
    <div class="status-box">✨ かったもの: <span id="ui-score">0</span>こ</div>
    <div class="status-box" id="btn-switch" onclick="toggleMode()">🛍 マイバッグ</div>
  </div>
  
  <canvas id="c"></canvas>
  <div id="message-popup">ぴったり！</div>

  <div id="start-screen" class="screen">
    <h1>🛒 おかいもの<br>＆じぶんのマイバッグ</h1>
    
    <div class="settings-box">
      <div class="set-title">あそぶレベルをえらぶ</div>
      <div class="btn-row" id="diff-group">
        <button class="opt-btn active" onclick="selDiff(0)">かんたん (未就学児：10円玉)</button>
        <button class="opt-btn" onclick="selDiff(1)">ふつう (小1・2年：〜100円)</button>
        <button class="opt-btn" onclick="selDiff(2)">むずかしい (小3年：〜500円)</button>
        <button class="opt-btn" onclick="selDiff(3)">超むずかしい (大人：お札と暗算！)</button>
      </div>
      <p style="font-size:12px; color:#777; text-align:center; margin-top:10px;">
        ※ぴったり出せたら、商品がもらえるよ！
      </p>
    </div>
    <button class="start-btn" onclick="startGame()">あそぶ！</button>
  </div>
</div>

<script>
document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

setTimeout(() => {
    const opening = document.getElementById('opening-screen');
    if(opening) {
        opening.style.opacity = '0';
        setTimeout(() => { opening.style.visibility = 'hidden'; }, 500);
    }
}, 1800);

let actx;
function initAudio() { if (!actx) { actx = new AudioContext(); if (actx.state === 'suspended') actx.resume(); } }
function playSound(type) {
    if (!actx) return;
    const now = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    
    if (type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'buy') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'pop') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1500, now + 0.15);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'change') { 
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1046, now + 0.1); osc.frequency.setValueAtTime(1318, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.setValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2);
    }
}

let diffSelected = 0;
function selDiff(val) { diffSelected = val; document.querySelectorAll('#diff-group .opt-btn').forEach((b, i) => b.classList.toggle('active', i === val)); }

const ITEMS_POOL = ["🍎","🍊","🍇","🍉","🧁","🍦","🍼","🧸","📚","🎨","🚗","🪀","⚽","🧩","🎹","🥪","🍱","🍩","🍓","🥝","🥕","🌽"];

const c = document.getElementById('c'); const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = c.clientWidth; H = c.height = c.clientHeight; }
window.addEventListener('resize', resize); resize();

let state = 'title'; 
let currentItems = []; 
let currentTotalRequired = 0;
let trayCoins = []; // {val: 金額, rx: Xのランダムズレ, ry: Yのランダムズレ} を保存する配列に修正
let currentTotal = 0;
let stickers = []; 
let draggingSticker = null; 
let gachaScale = 0;

const UI_SCORE = document.getElementById('ui-score');
const BTN_SWITCH = document.getElementById('btn-switch');
const MSG = document.getElementById('message-popup');
let msgTimeout;

function showMsg(text, color, shadow, duration = 1000) {
    if (msgTimeout) clearTimeout(msgTimeout);
    MSG.innerText = text; MSG.style.color = color;
    MSG.style.textShadow = `3px 3px 0 ${shadow}`;
    MSG.classList.add('show'); 
    msgTimeout = setTimeout(() => { MSG.classList.remove('show'); }, duration);
}

function spawnItem() {
    currentItems = [];
    currentTotalRequired = 0;
    
    let numItems = 1;
    if (diffSelected === 3) {
        numItems = Math.random() > 0.6 ? 3 : 2; 
    }
    
    for(let i=0; i<numItems; i++) {
        let p = 0;
        if (diffSelected === 0) p = (Math.floor(Math.random() * 9) + 1) * 10; 
        else if (diffSelected === 1) p = (Math.floor(Math.random() * 40) + 10) * 10; 
        else if (diffSelected === 2) p = (Math.floor(Math.random() * 50) + 10) * 10; 
        else p = Math.floor(Math.random() * 4000) + 111; 
        
        currentItems.push({ emoji: ITEMS_POOL[Math.floor(Math.random() * ITEMS_POOL.length)], price: p });
        currentTotalRequired += p;
    }
    trayCoins = []; currentTotal = 0;
}

function toggleMode() {
    if (state === 'title' || state === 'gacha' || window.isChangeShowing) return;
    initAudio();
    if (state === 'shop') {
        state = 'book';
        BTN_SWITCH.innerText = "🛒 おかいものへ";
    } else {
        state = 'shop';
        BTN_SWITCH.innerText = "🛍 マイバッグ";
        spawnItem(); 
    }
}

function addCoin(val) {
    if(trayCoins.length >= 30) { showMsg("いっぱい！", "#ffffff", "#f44336"); return; }
    playSound('coin');
    
    // ★修正：トレイに入れた瞬間に「ズレる数値」を決定してオブジェクトとして保存する（震え防止）
    trayCoins.push({ 
        val: val, 
        rx: Math.random() * 10 - 5, 
        ry: Math.random() * 10 - 5 
    });
    currentTotal += val;
}

function clearCoins() {
    if(trayCoins.length === 0) return;
    if(!window.isChangeShowing) playSound('wrong'); 
    trayCoins = [];
    currentTotal = 0;
}

function buyItem() {
    if (currentTotal === currentTotalRequired) {
        playSound('buy');
        showMsg("ぴったり！", "#ffeb3b", "#f57c00");
        state = 'gacha';
        gachaScale = 0;
        
        setTimeout(() => {
            playSound('pop');
            currentItems.forEach(item => {
                stickers.push({
                    e: item.emoji,
                    x: W/2 + (Math.random()*80-40), y: H/2 + (Math.random()*80-40),
                    size: Math.max(35, Math.min(50, W*0.1))
                });
            });
            UI_SCORE.innerText = stickers.length;
            setTimeout(() => { state = 'book'; BTN_SWITCH.innerText = "🛒 おかいものへ"; }, 1500);
        }, 1200);
        
    } else if (currentTotal > currentTotalRequired) {
        let change = currentTotal - currentTotalRequired;
        playSound('change'); 
        showMsg(`おしい！\nおつりは ${change}えん だよ`, "#e1f5fe", "#0288d1", 2500);
        
        window.isChangeShowing = true;
        setTimeout(() => { clearCoins(); window.isChangeShowing = false; }, 2500);
    } else {
        playSound('wrong');
        showMsg("たりないよ！", "#ffffff", "#f44336");
    }
}

function getShopUIRects() {
    let isSuperHard = (diffSelected === 3);
    let btnSize = isSuperHard ? Math.min(45, W * 0.14) : Math.min(65, W * 0.18);
    let rowsCount = isSuperHard ? 3 : (diffSelected === 2 ? 2 : 1);
    
    let coinAreaH = rowsCount * btnSize + (rowsCount - 1) * 10;
    let coinStartY = H - coinAreaH - Math.max(15, H * 0.02); 
    
    let ctrlH = Math.min(50, H * 0.08);
    let ctrlY = coinStartY - ctrlH - 10; 
    
    let shelfY = Math.max(150, H * 0.22); 
    let trayY = shelfY + (ctrlY - shelfY) * 0.55; 

    let btns = [];
    if (diffSelected === 0) {
        let spacing = (W - btnSize) / 2;
        btns.push({ val: 10, x: spacing, y: coinStartY, w: btnSize, h: btnSize });
    } else if (diffSelected === 1) {
        let coins = [100, 50, 10];
        let spacing = (W - btnSize * 3) / 4;
        for(let i=0; i<3; i++) btns.push({ val: coins[i], x: spacing + i*(btnSize+spacing), y: coinStartY, w: btnSize, h: btnSize });
    } else if (diffSelected === 2) {
        let row1 = [500, 100]; let row2 = [50, 10];
        let spacing = (W - btnSize * 2) / 3;
        for(let i=0; i<2; i++) {
            btns.push({ val: row1[i], x: spacing + i*(btnSize+spacing), y: coinStartY, w: btnSize, h: btnSize });
            btns.push({ val: row2[i], x: spacing + i*(btnSize+spacing), y: coinStartY + btnSize + 10, w: btnSize, h: btnSize });
        }
    } else if (diffSelected === 3) {
        let rows = [[10000, 5000, 1000], [500, 100, 50], [10, 5, 1]];
        let spacing = (W - btnSize * 3) / 4;
        for(let r=0; r<3; r++) {
            for(let c=0; c<3; c++) {
                btns.push({ val: rows[r][c], x: spacing + c*(btnSize+spacing), y: coinStartY + r*(btnSize+10), w: btnSize, h: btnSize });
            }
        }
    }

    return {
        coinBtns: btns,
        btnClear: { x: W*0.1, y: ctrlY, w: W*0.35, h: ctrlH },
        btnBuy:   { x: W*0.55, y: ctrlY, w: W*0.35, h: ctrlH },
        trayY: trayY, shelfY: shelfY
    };
}

c.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    if (window.isChangeShowing) return; 
    
    let rect = c.getBoundingClientRect();
    let tx = e.clientX - rect.left;
    let ty = e.clientY - rect.top;
    
    if (state === 'shop') {
        let ui = getShopUIRects();
        ui.coinBtns.forEach(btn => {
            if (tx > btn.x && tx < btn.x+btn.w && ty > btn.y && ty < btn.y+btn.h) addCoin(btn.val);
        });
        if (tx > ui.btnClear.x && tx < ui.btnClear.x+ui.btnClear.w && ty > ui.btnClear.y && ty < ui.btnClear.y+ui.btnClear.h) clearCoins();
        if (tx > ui.btnBuy.x && tx < ui.btnBuy.x+ui.btnBuy.w && ty > ui.btnBuy.y && ty < ui.btnBuy.y+ui.btnBuy.h) buyItem();
    } 
    else if (state === 'book') {
        for(let i = stickers.length - 1; i >= 0; i--) {
            let s = stickers[i];
            if (Math.hypot(tx - s.x, ty - s.y) < s.size) {
                draggingSticker = s;
                stickers.splice(i, 1); stickers.push(s); 
                break;
            }
        }
    }
});

c.addEventListener('pointermove', (e) => {
    e.preventDefault();
    if (state === 'book' && draggingSticker) {
        let rect = c.getBoundingClientRect();
        let nx = e.clientX - rect.left;
        let ny = e.clientY - rect.top;
        draggingSticker.x = Math.max(draggingSticker.size, Math.min(W - draggingSticker.size, nx));
        draggingSticker.y = Math.max(100 + draggingSticker.size, Math.min(H - draggingSticker.size, ny));
    }
});

c.addEventListener('pointerup', (e) => { e.preventDefault(); draggingSticker = null; });
c.addEventListener('pointercancel', (e) => { e.preventDefault(); draggingSticker = null; });

function drawMoney(cx, cy, r, type) {
    if (type >= 1000) {
        let bw = r * 2.2;
        let bh = r * 1.2;
        ctx.fillStyle = type === 10000 ? "#e8f5e9" : (type === 5000 ? "#f3e5f5" : "#e3f2fd");
        ctx.beginPath(); ctx.roundRect(cx - bw/2, cy - bh/2, bw, bh, 5); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = type === 10000 ? "#81c784" : (type === 5000 ? "#ba68c8" : "#64b5f6"); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, bh*0.35, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = "#424242"; 
        let fontSize = type >= 10000 ? r*0.35 : r*0.45;
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(type, cx, cy);
    } else {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
        if (type === 500) { ctx.fillStyle = "#fff176"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#cddc39"; ctx.stroke(); }
        else if (type === 100) { ctx.fillStyle = "#e0e0e0"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#bdbdbd"; ctx.stroke(); }
        else if (type === 50) { ctx.fillStyle = "#e0e0e0"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#bdbdbd"; ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, r*0.2, 0, Math.PI*2); ctx.fillStyle="#ffe082"; ctx.fill(); ctx.stroke(); }
        else if (type === 10) { ctx.fillStyle = "#bcaaa4"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#8d6e63"; ctx.stroke(); }
        else if (type === 5) { ctx.fillStyle = "#fff176"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#fbc02d"; ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, r*0.2, 0, Math.PI*2); ctx.fillStyle="#ffe082"; ctx.fill(); ctx.stroke(); }
        else if (type === 1) { ctx.fillStyle = "#f5f5f5"; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#9e9e9e"; ctx.stroke(); }
        
        ctx.fillStyle = (type === 10) ? "#5d4037" : (type === 500 || type === 5 ? "#827717" : "#616161");
        let fontSize = type === 500 || type === 100 ? r*0.55 : r*0.6;
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(type, cx, (type === 50 || type === 5) ? cy - r*0.35 : cy); 
    }
}

function drawPuffySticker(s) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.font = `${s.size*1.3}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(s.e, s.x, s.y + s.size*0.1);
}

function update() {
    ctx.clearRect(0, 0, W, H);
    let ui = getShopUIRects();
    
    if (state === 'shop' || state === 'gacha') {
        ctx.fillStyle = '#ffe082'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffecb3'; ctx.fillRect(0, ui.trayY - 60, W, H); 
        
        ctx.fillStyle = '#ffcc80'; ctx.fillRect(0, ui.shelfY, W, 15);
        
        let itemW = W / currentItems.length;
        let numItems = currentItems.length;
        
        currentItems.forEach((item, i) => {
            let cx = itemW * i + itemW / 2;
            
            let emojiSize = numItems === 3 ? 45 : (numItems === 2 ? 60 : 75);
            ctx.font = `${emojiSize}px sans-serif`; 
            ctx.textAlign = "center"; ctx.textBaseline = "bottom"; 
            ctx.fillText(item.emoji, cx, ui.shelfY);
            
            let maxTagW = itemW * 0.92; 
            let tagW = Math.min(maxTagW, numItems === 3 ? 85 : 120);
            let tagH = numItems === 3 ? 28 : 35;
            let tagY = ui.shelfY + 15; 
            
            ctx.fillStyle = "#fff"; ctx.fillRect(cx - tagW/2, tagY, tagW, tagH);
            ctx.strokeStyle = "#e65100"; ctx.lineWidth = 3; ctx.strokeRect(cx - tagW/2, tagY, tagW, tagH);
            
            ctx.fillStyle = "#e65100"; 
            let priceText = item.price + "えん";
            let fontSize = numItems === 3 ? 14 : 20;
            if (priceText.length > 5) fontSize = numItems === 3 ? 12 : 16;
            
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textBaseline = "middle";
            ctx.fillText(priceText, cx, tagY + tagH/2 + 2);
        });
        
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath(); ctx.ellipse(W/2, ui.trayY, W*0.4, 50, 0, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = "#ffcc80"; ctx.stroke();
        
        let tcx = W/2;
        // ★修正：cObj.val で金額を取得し、cObj.rx / cObj.ry で固定のズレ幅を取得（震えない！）
        trayCoins.forEach((cObj, i) => {
            let maxCols = diffSelected === 3 ? 5 : 8; 
            let row = Math.floor(i / maxCols); let col = i % maxCols;
            let ox = (col - (maxCols-1)/2) * (diffSelected === 3 ? 40 : 30) + cObj.rx;
            let oy = (row - 1) * 20 + cObj.ry;
            let r = diffSelected === 3 ? 18 : 22; 
            drawMoney(tcx + ox, ui.trayY + oy - 10, r, cObj.val);
        });
        
        ctx.fillStyle = "#333"; ctx.font = "bold 24px sans-serif";
        if (diffSelected === 3) {
            ctx.fillText(`いま： ？？？ えん`, W/2, ui.trayY + 70);
        } else {
            ctx.fillText(`いま： ${currentTotal} えん`, W/2, ui.trayY + 70);
        }
        
        ctx.fillStyle = "#9e9e9e"; ctx.beginPath(); ctx.roundRect(ui.btnClear.x, ui.btnClear.y, ui.btnClear.w, ui.btnClear.h, 10); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.fillText("やりなおす", ui.btnClear.x + ui.btnClear.w/2, ui.btnClear.y + ui.btnClear.h/2);
        
        ctx.fillStyle = "#4caf50"; ctx.beginPath(); ctx.roundRect(ui.btnBuy.x, ui.btnBuy.y, ui.btnBuy.w, ui.btnBuy.h, 10); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "bold 24px sans-serif"; ctx.fillText("かう！", ui.btnBuy.x + ui.btnBuy.w/2, ui.btnBuy.y + ui.btnBuy.h/2);

        ui.coinBtns.forEach(btn => drawMoney(btn.x + btn.w/2, btn.y + btn.h/2, btn.w/2, btn.val));

        if (state === 'gacha') {
            gachaScale += (1 - gachaScale) * 0.1; 
            ctx.fillStyle = `rgba(255, 255, 255, ${gachaScale * 0.8})`; ctx.fillRect(0, 0, W, H);
            ctx.save(); ctx.translate(W/2, H/2); ctx.scale(gachaScale, gachaScale);
            
            ctx.font = "120px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText("🧺", 0, 0); 
            if (gachaScale > 0.8) {
                currentItems.forEach((item, idx) => {
                    let dx = (idx - (currentItems.length-1)/2) * 50;
                    ctx.font = "40px sans-serif";
                    ctx.fillText(item.emoji, dx, -40);
                });
                ctx.font = "60px sans-serif"; ctx.fillText("✨", 0, -90); 
            }
            ctx.restore();
        }
    } 
    else if (state === 'book') {
        ctx.fillStyle = "#fff9c4"; ctx.fillRect(0, 0, W, H);
        ctx.lineWidth = 1; ctx.strokeStyle = "#e0e0e0";
        for(let y=100; y<H; y+=40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        
        ctx.fillStyle = "#f57f17"; ctx.font = "bold 24px sans-serif"; ctx.textAlign="center";
        ctx.fillText("じぶんだけの マイバッグ", W/2, 80);
        stickers.forEach(s => drawPuffySticker(s));
    }
    requestAnimationFrame(update);
}

function startGame() {
    initAudio();
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hide'));
    stickers = []; UI_SCORE.innerText = "0";
    state = 'shop'; spawnItem();
}
requestAnimationFrame(update);
</script>
</body>
</html>
