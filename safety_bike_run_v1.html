<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>交通安全チャリ走 - フードデリバリー編</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { overscroll-behavior: none; touch-action: none; background: #2c3e50; margin: 0; padding: 0; font-family: 'Rounded M+ 1c', sans-serif; color: white; }
  body { position: fixed; inset: 0; width: 100%; height: 100dvh; display: flex; justify-content: center; align-items: center; }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 500px; height: 100%; max-height: 850px;
    background: #000; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  /* 💡 デリバリー用UIの追加 */
  #header { position: absolute; top: var(--sat); left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; box-sizing: border-box; pointer-events: none; }
  .score-box { background: rgba(255,255,255,0.95); padding: 8px 15px; border-radius: 15px; font-size: 20px; font-weight: 900; color: #2980b9; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
  .delivery-box { background: #f1c40f; color: #d35400; padding: 5px 15px; border-radius: 15px; font-size: 18px; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; display: flex; gap: 5px; align-items: center; }
  .time-box { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 15px; font-size: 24px; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

  #ui-warning { position: absolute; top: calc(var(--sat) + 90px); left: 50%; transform: translateX(-50%); background: #e74c3c; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; opacity: 0; transition: opacity 0.2s; z-index: 15; box-shadow: 0 4px 6px rgba(0,0,0,0.5); pointer-events: none; white-space: nowrap; }

  #canvas-container { flex: 1; min-height: 0; position: relative; width: 100%; height: 100%; z-index: 5; }
  canvas { display: block; width: 100%; height: 100%; }

  #controls { position: absolute; bottom: calc(10px + var(--sab)); left: 0; width: 100%; padding: 0 10px; display: flex; justify-content: space-between; gap: 8px; box-sizing: border-box; z-index: 20; }
  .control-btn { height: 75px; border-radius: 15px; font-size: 24px; font-weight: bold; color: white; border: none; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 0 rgba(0,0,0,0.3); touch-action: none; user-select: none; -webkit-user-select: none; }
  .btn-side { flex: 1; background: #3498db; box-shadow: 0 6px 0 #2980b9; }
  .btn-side:active { transform: translateY(6px); box-shadow: none; }
  .btn-brake { flex: 1.5; background: #e74c3c; box-shadow: 0 6px 0 #c0392b; font-size: 26px; }
  .btn-brake:active { transform: translateY(6px); box-shadow: none; background: #c0392b; }

  .floating-text { position: absolute; pointer-events: none; font-weight: 900; font-size: 28px; text-shadow: 2px 2px 0 white, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white; animation: popUp 1.5s ease-out forwards; z-index: 150; text-align: center; width: 100%; top: 35%; }
  @keyframes popUp { 0% { transform: translateY(20px) scale(0.5); opacity: 0; } 10% { transform: translateY(0px) scale(1.2); opacity: 1; } 80% { transform: translateY(-30px) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1); opacity: 0; } }

  .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .title { font-size: 28px; color: #f1c40f; font-weight: 900; margin-bottom: 15px; text-shadow: 2px 2px 0 #d35400; text-align: center; line-height: 1.3; }
  .desc { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color:white; padding:15px; border-radius:15px; font-weight:bold; width:85%; text-align:left; line-height:1.5; font-size: 13px; box-sizing: border-box; }
  .btn { padding: 15px 40px; font-size: 22px; font-weight: bold; color: white; background: #2ecc71; border: none; border-radius: 30px; box-shadow: 0 6px 0 #27ae60; cursor: pointer; margin-top: 15px; transition: 0.1s; }
  .btn:active { transform: translateY(6px); box-shadow: none; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <div class="score-box">
      <span>スコア</span>
      <span id="ui-score" style="font-size:28px;">0</span>
    </div>
    <!-- 💡 デリバリー用リュック表示とタイマー -->
    <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
      <div class="time-box">残り <span id="ui-time">60</span>秒</div>
      <div class="delivery-box">🎒 <span id="ui-bag">空っぽ</span></div>
    </div>
  </div>
  
  <div id="ui-warning">⚠️ キープレフト！(左端へ)</div>

  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="controls">
    <button class="control-btn btn-side" id="btn-left">◀️</button>
    <button class="control-btn btn-brake" id="btn-brake">🛑 ブレーキ</button>
    <button class="control-btn btn-side" id="btn-right">▶️</button>
  </div>

  <div id="start-screen" class="overlay show">
    <div class="title">🚲 交通安全<br>チャリ走 デリバリー！</div>
    <div class="desc">
      あなたはウーバー自転車配達員！<br>
      安全運転でフードを届けよう🍔🍕<br><br>
      💡 <b>配達のルール</b><br>
      ① 道路に落ちているフードを拾う<br>
      ② <b>🏠 配達先（青いライン）</b>まで届ける！<br>
      ③ 届けると<b>時間回復＆スコアゲット！</b><br><br>
      ⚠️ <b>交通ルールは絶対守ること！</b><br>
      信号無視や、中央線の走行、車への衝突は<br>
      即ゲームオーバーになります👮
    </div>
    <button class="btn" onclick="startGame()">配達スタート！</button>
  </div>

  <div id="game-over" class="overlay">
    <h1 id="result-title" style="color:#e74c3c; font-size:32px; margin-bottom:10px;">ゲームオーバー</h1>
    <div id="result-reason" style="color:white; font-size:16px; margin-bottom:10px; font-weight:bold; text-align:center; white-space:pre-wrap;"></div>
    <div class="desc" style="text-align:center; font-size:20px; margin-bottom:20px; background:transparent; border:none;">
      スコア: <span id="result-score" style="font-size:40px; color:#f1c40f; font-weight:900;">0</span><br>
      走行距離: <span id="result-dist">0</span> m
    </div>
    <button class="btn" style="background:#3498db; box-shadow:0 6px 0 #2980b9;" onclick="showStartScreen()">もういっかい</button>
  </div>
</div>

<script>
// --- 音声 ---
let actx;
function initAudio() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); }
function playSound(type) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  
  if (type === 'brake') { 
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1000, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.3);
    gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'crash') {
    osc.type = 'square'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.5);
    gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.5);
    osc.start(t); osc.stop(t + 0.5);
  } else if (type === 'whistle') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, t); 
    gain.gain.setValueAtTime(0.3, t); gain.gain.setValueAtTime(0.01, t + 0.1);
    gain.gain.setValueAtTime(0.3, t+0.15); gain.gain.setValueAtTime(0.01, t + 0.4);
    osc.start(t); osc.stop(t + 0.5);
  } else if (type === 'ok') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t); osc.frequency.setValueAtTime(900, t + 0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'crossing') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(700, t);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.start(t); osc.stop(t + 0.4);
  } else if (type === 'get') {
    // フードゲット音
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(1200, t + 0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  } else if (type === 'deliver') {
    // 配達完了音
    osc.type = 'square'; osc.frequency.setValueAtTime(523.25, t); osc.frequency.setValueAtTime(659.25, t+0.1); osc.frequency.setValueAtTime(783.99, t+0.2); osc.frequency.setValueAtTime(1046.50, t+0.3);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
    osc.start(t); osc.stop(t + 0.5);
  }
}

// --- ゲーム設定 ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let cw, ch;

let gameState = 'menu';
let lastTime = 0;
let animationId;
let distance = 0; 
let score = 0;
let timeLimit = 60.0;

let timeUntilNextEvent = 5.0; 
let trafficTimer = 2.0;

const ROAD_WIDTH = 240; 
let roadLeft, roadRight;

let FOV = 250;
let HORIZON = 0;
let CAM_H = 65; 

const player = {
  x: -80, 
  y: 0, 
  width: 20, height: 40,
  baseSpeed: 80, 
  currentSpeed: 0,
  moveSpeed: 200,
  bag: [] // 💡 配達リュック
};

let centerViolationTimer = 0; 

let mapObjects = [];
let nextSpawnDistance = 0;
const keys = { left: false, right: false, brake: false };

function resize() {
  const container = document.getElementById('canvas-container');
  cw = container.clientWidth;
  ch = container.clientHeight;
  canvas.width = cw;
  canvas.height = ch;
  roadLeft = -ROAD_WIDTH / 2; 
  roadRight = ROAD_WIDTH / 2;
  
  HORIZON = ch * 0.45;
  let targetY = ch * 0.85; 
  let targetScale = (targetY - HORIZON) / CAM_H;
  player.y = FOV / targetScale - FOV; 
}
window.addEventListener('resize', resize);

function showFloatingText(text, color) {
  const el = document.createElement('div');
  el.className = 'floating-text';
  el.style.color = color;
  el.innerText = text;
  document.getElementById('canvas-container').appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

const bindBtn = (id, key) => {
  const btn = document.getElementById(id);
  const down = (e) => { e.preventDefault(); if (gameState==='playing') keys[key] = true; if(key==='brake') playSound('brake'); };
  const up = (e) => { e.preventDefault(); keys[key] = false; };
  btn.addEventListener('touchstart', down, {passive:false}); btn.addEventListener('touchend', up, {passive:false});
  btn.addEventListener('mousedown', down); btn.addEventListener('mouseup', up);
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-brake', 'brake');

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' && gameState==='playing') keys.left = true;
  if (e.code === 'ArrowRight' && gameState==='playing') keys.right = true;
  if (e.code === 'ArrowDown' && gameState==='playing' && !keys.brake) { keys.brake = true; playSound('brake'); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowDown') keys.brake = false;
});

function randomColor() {
  const colors = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'];
  return colors[Math.floor(Math.random() * colors.length)];
}

function isSafeSpawnY(yPos) {
  for (let fac of mapObjects) {
    if (fac.type === 'intersection' || fac.type === 'railroad') {
      if (Math.abs(fac.y - yPos) < 150) return false;
    }
  }
  return true;
}

// 💡 トラフィックと「フード」の生成
function spawnTraffic(urbanLevel) {
  let yPos = distance + 1000; 
  if (!isSafeSpawnY(yPos)) return; 

  // フードの生成
  if (Math.random() < 0.4) {
    let foodIcons = ['🍔', '🍕', '🍣', '🍩', '🍟'];
    mapObjects.push({
      type: 'food', y: yPos + 100, x: (Math.random()-0.5) * ROAD_WIDTH * 0.8,
      icon: foodIcons[Math.floor(Math.random()*foodIcons.length)], cleared: false
    });
  }

  if (Math.random() < 0.05 + urbanLevel * 0.05) {
    mapObjects.push({ type: 'parked_car', y: yPos, x: -110, width: 30, height: 60, color: randomColor() });
    return; 
  }
  if (Math.random() < 0.3 + urbanLevel * 0.5) {
    let speed = 200 + Math.random() * 400; 
    mapObjects.push({ type: 'oncoming_car', y: yPos, x: 75, width: 30, height: 60, baseSpeed: -speed, speed: -speed, color: randomColor() });
  }
  if (Math.random() < 0.4 + urbanLevel * 0.4) {
    let speed = 50 + Math.random() * 350; 
    mapObjects.push({ type: 'car', y: yPos, x: -50, width: 30, height: 60, baseSpeed: speed, speed: speed, color: randomColor(), violationTimer: 0 });
  }
}

function spawnDangerEvent() {
  let yPos = distance + 1200;
  mapObjects.push({ type: 'jaywalker', y: yPos, x: Math.random() > 0.5 ? cw/2 : -cw/2, speedX: 0, triggered: false });
  showFloatingText("⚠️ 危険予測！", "#e74c3c");
}

function spawnFacility(urbanLevel) {
  // 💡 定期的に「配達先の家（ゴールライン）」を生成する
  let typeNum = Math.random();
  let type = 'intersection';
  if (typeNum < 0.2) type = 'house'; // 20%で配達先
  else if (typeNum < 0.8) type = 'intersection';
  else type = 'railroad';

  let yPos = nextSpawnDistance + 1000;
  let obj = { type: type, y: yPos, cleared: false };

  if (type === 'intersection') {
    obj.height = 140;
    obj.control = Math.random() < 0.6 ? 'traffic_light' : 'stop_sign';
    
    if (obj.control === 'traffic_light') {
      obj.stopLineY = yPos - 70;
      obj.timer = 0; obj.state = 'green';
      
      let randEvent = Math.random();
      if (randEvent < 0.4 + urbanLevel * 0.4) {
        obj.event = 'right_turn';
        obj.rightCar = { x: 50, y: yPos + 300, baseSpeed: -250, speed: -250, baseSpeedX: -200, speedX: 0, state: 'straight', isBadManner: Math.random() > 0.6, color: randomColor() };
      } else if (randEvent < 0.7) {
        obj.event = 'pedestrian';
        let fromLeft = Math.random() > 0.5;
        obj.ped = { x: fromLeft ? -cw/2 : cw/2, speedX: 0, triggered: false, isLeft: fromLeft, isBadManner: Math.random() < 0.2 };
      } else {
        obj.event = 'cross_car';
        let fromLeft = Math.random() > 0.5;
        obj.crossCar = { x: fromLeft ? -cw : cw, baseSpeedX: 0, speedX: 0, triggered: false, color: randomColor(), isLeft: fromLeft };
      }
    } else {
      obj.stopTime = 0;
      obj.stopLineY = yPos - 70;
      obj.stopZoneStart = yPos - 130;
      obj.stopZoneEnd = yPos - 70;
      
      if (Math.random() < 0.5) {
        obj.event = 'cross_car';
        let fromLeft = Math.random() > 0.5;
        obj.crossCar = { x: fromLeft ? -cw : cw, baseSpeedX: 0, speedX: 0, triggered: false, color: randomColor(), isLeft: fromLeft, isBadManner: true };
      } else {
        obj.event = 'pedestrian';
        let fromLeft = Math.random() > 0.5;
        obj.ped = { x: fromLeft ? -cw/2 : cw/2, speedX: 0, triggered: false, isLeft: fromLeft, isBadManner: true };
      }
    }
    nextSpawnDistance = yPos + Math.max(300, 700 - urbanLevel * 400); 
  } else if (type === 'railroad') {
    obj.height = 100;
    obj.timer = 0; obj.state = 'open'; obj.trainX = -cw; obj.stopLineY = yPos - 50;
    nextSpawnDistance = yPos + 800;
  } else if (type === 'house') {
    obj.height = 20; // 道路に引かれるラインの幅
    nextSpawnDistance = yPos + 500;
  }
  
  mapObjects.push(obj);
}

function updateUI() {
  document.getElementById('ui-score').innerText = score;
  document.getElementById('ui-bag').innerText = player.bag.length > 0 ? player.bag.join('') : '空っぽ';
  document.getElementById('ui-time').innerText = Math.ceil(timeLimit);
}

function gameOver(reasonText, reasonType) {
  gameState = 'gameover';
  if (reasonType === 'violation') playSound('whistle');
  else if (reasonType === 'timeup') playSound('whistle');
  else playSound('crash');
  
  let t = reasonType === 'timeup' ? "⏳ タイムアップ！" : (reasonType === 'violation' ? "👮 交通違反！" : "💥 クラッシュ！");
  document.getElementById('result-title').innerText = t;
  document.getElementById('result-reason').innerText = reasonText;
  document.getElementById('result-score').innerText = score;
  document.getElementById('result-dist').innerText = Math.floor(distance / 10);
  document.getElementById('game-over').classList.add('show');
  document.getElementById('ui-warning').style.opacity = 0;
}

function gameLoop(currentTime) {
  if (gameState !== 'playing') return;
  
  let dt = (currentTime - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1; 
  lastTime = currentTime;

  timeLimit -= dt;
  if (timeLimit <= 0) {
    gameOver("配達時間が過ぎてしまった！", "timeup"); return;
  }

  let urbanLevel = Math.min(1.0, distance / 3000);

  timeUntilNextEvent -= dt;
  if (timeUntilNextEvent <= 0) {
    timeUntilNextEvent = 5.0;
    spawnDangerEvent();
  }

  trafficTimer -= dt;
  if (trafficTimer <= 0) {
    trafficTimer = (1.5 - urbanLevel * 1.0) + Math.random() * 0.5; 
    spawnTraffic(urbanLevel);
  }

  if (keys.brake) {
    player.currentSpeed = Math.max(0, player.currentSpeed - 1200 * dt);
  } else {
    player.baseSpeed = Math.min(500, 80 + distance * 0.08); 
    player.currentSpeed = Math.min(player.baseSpeed, player.currentSpeed + 400 * dt);
  }

  if (keys.left) player.x -= player.moveSpeed * dt;
  if (keys.right) player.x += player.moveSpeed * dt;
  let limit = ROAD_WIDTH / 2 - player.width / 2;
  player.x = Math.max(-limit, Math.min(limit, player.x));

  let isCenter = player.x > -20;
  if (isCenter) {
    centerViolationTimer += dt;
    document.getElementById('ui-warning').style.opacity = (Math.floor(currentTime / 200) % 2 === 0) ? 1 : 0;
    if (centerViolationTimer > 5.0) {
      gameOver("車道の中央や右側を5秒以上走った！\n（自転車は車道の『左側端』を通行）", "violation");
      return;
    }
  } else {
    centerViolationTimer = 0;
    document.getElementById('ui-warning').style.opacity = 0;
  }

  distance += player.currentSpeed * dt;
  updateUI();

  if (distance > nextSpawnDistance - 1000) {
    spawnFacility(urbanLevel);
  }

  // --- オブジェクトの更新とAI ---
  for (let i = mapObjects.length - 1; i >= 0; i--) {
    let obj = mapObjects[i];
    let objDistZ = obj.y - distance; 
    if (objDistZ < -250) { mapObjects.splice(i, 1); continue; }

    let relZ = objDistZ - player.y;

    // 💡 フードの取得
    if (obj.type === 'food') {
      if (!obj.cleared && Math.abs(player.x - obj.x) < 30 && Math.abs(relZ) < 30) {
        obj.cleared = true;
        if (player.bag.length < 5) { // 最大5個まで持てる
          player.bag.push(obj.icon);
          playSound('get');
          showFloatingText(obj.icon + ' ゲット!', '#f1c40f');
          updateUI();
        }
      }
    }

    // 💡 配達先（家）のライン通過
    if (obj.type === 'house') {
      if (!obj.cleared && relZ < 0) {
        obj.cleared = true;
        if (player.bag.length > 0) {
          let pts = player.bag.length * 100;
          let bonusTime = player.bag.length * 5;
          score += pts;
          timeLimit += bonusTime;
          player.bag = [];
          playSound('deliver');
          showFloatingText(`配達完了! +${pts}点 ⏰+${bonusTime}秒`, '#2ecc71');
          updateUI();
        } else {
          showFloatingText(`届けるものがないよ！`, '#95a5a6');
        }
      }
    }

    // 💡 車のAI更新
    if (obj.type === 'car' || obj.type === 'oncoming_car') {
      let targetSpeed = obj.baseSpeed;
      let minStopDist = Infinity;

      // 信号や踏切での停止判定
      for (let fac of mapObjects) {
        if ((fac.type === 'intersection' && fac.control === 'traffic_light') || fac.type === 'railroad') {
          let d = Infinity;
          if (obj.type === 'car') d = fac.stopLineY - obj.y;
          else if (obj.type === 'oncoming_car') d = obj.y - (fac.y + 70);
          
          if (d > 0 && d < minStopDist && (fac.state === 'red' || fac.state === 'yellow' || fac.state === 'closed' || fac.state === 'warning')) {
            minStopDist = d;
          }
        }
      }

      // 車間距離判定
      for (let other of mapObjects) {
        if (other === obj) continue;
        if (obj.type === 'car' && (other.type === 'car' || other.type === 'parked_car')) {
          if (Math.abs(obj.x - other.x) < 30) {
            let d = other.y - obj.y; 
            if (d > 0 && d < minStopDist) {
              minStopDist = d - 100; 
              targetSpeed = Math.min(targetSpeed, (other.speed || 0));
            }
          }
        } else if (obj.type === 'oncoming_car' && other.type === 'oncoming_car') {
          if (Math.abs(obj.x - other.x) < 30) {
            let d = obj.y - other.y; 
            if (d > 0 && d < minStopDist) {
              minStopDist = d - 100;
              targetSpeed = Math.max(targetSpeed, (other.speed || 0)); 
            }
          }
        }
      }

      // 💡 プレイヤーへの衝突防止センサー（車側から避ける）
      let pdZ = obj.y - (player.y + distance);
      if (obj.type === 'car') {
        if (pdZ > 0 && pdZ < 150 && Math.abs(player.x - obj.x) < 40) {
          minStopDist = Math.min(minStopDist, pdZ - 60);
          targetSpeed = Math.min(targetSpeed, player.currentSpeed);
        }
      } else if (obj.type === 'oncoming_car') {
        if (pdZ < 0 && pdZ > -150 && Math.abs(player.x - obj.x) < 40) {
          minStopDist = Math.min(minStopDist, Math.abs(pdZ) - 60);
          targetSpeed = Math.max(targetSpeed, -player.currentSpeed); // 負の速度
        }
      }

      if (minStopDist < 20) targetSpeed = 0; 

      if (obj.type === 'car') {
        if (obj.speed < targetSpeed) obj.speed = Math.min(targetSpeed, obj.speed + 300 * dt);
        else obj.speed = Math.max(targetSpeed, obj.speed - 800 * dt);
      } else {
        if (obj.speed > targetSpeed) obj.speed = Math.max(targetSpeed, obj.speed - 300 * dt); 
        else obj.speed = Math.min(targetSpeed, obj.speed + 800 * dt); 
      }

      obj.y += obj.speed * dt; 
      
      if (
        Math.abs(player.x - obj.x) < (player.width + obj.width) / 2 * 0.8 &&
        Math.abs(relZ) < 40
      ) {
        gameOver("車にぶつかった！（前方不注意）", "crash"); return;
      }

      if (obj.type === 'car' && obj.speed > 10) {
        if (Math.abs(relZ) < 60 && player.x > obj.x) { 
          obj.violationTimer += dt;
          if (obj.violationTimer > 0.3) { 
            gameOver("走っている車の右側を追い越した！\n（巻き込み事故の危険大！）", "violation"); return;
          }
        } else {
          obj.violationTimer = 0;
        }
      }
    } 
    else if (obj.type === 'parked_car') {
      if (Math.abs(player.x - obj.x) < (player.width + obj.width) / 2 * 0.8 && Math.abs(relZ) < 40) {
        gameOver("駐車車両にぶつかった！", "crash"); return;
      }
    }

    if (obj.type === 'jaywalker') {
      if (relZ < 400 && !obj.triggered) {
        obj.triggered = true;
        let timeToReach = Math.max(10, relZ) / Math.max(player.currentSpeed, 10);
        obj.speedX = (cw/2) / timeToReach;
        if (obj.x > 0) obj.speedX *= -1;
        playSound('whistle'); 
      }
      if (obj.triggered) obj.x += obj.speedX * dt;

      if (Math.abs(player.x - obj.x) < 20 && Math.abs(relZ) < 20) {
        gameOver("飛び出してきた歩行者にぶつかった！", "crash"); return;
      }
    }

    if (obj.type === 'intersection') {
      let stopDistZ = obj.stopLineY - distance;

      if (obj.control === 'traffic_light') {
        obj.timer += dt;
        if (relZ < 800 && !obj.triggered) {
          obj.triggered = true; obj.state = 'yellow'; obj.timer = 0;
        }
        if (obj.state === 'yellow' && obj.timer > 1.5) { obj.state = 'red'; obj.timer = 0; }
        else if (obj.state === 'red' && obj.timer > 4.0) { obj.state = 'green'; }

        if (!obj.cleared && stopDistZ < player.y) {
          if (obj.state === 'red' || obj.state === 'yellow') {
            gameOver("赤信号を無視した！", "violation"); return;
          } else { obj.cleared = true; }
        }
      }

      if (obj.control === 'stop_sign') {
        let zoneStartZ = obj.stopZoneStart - distance;
        let zoneEndZ = obj.stopZoneEnd - distance;

        if (zoneStartZ < player.y && zoneEndZ > player.y) {
          if (player.currentSpeed < 10) {
            obj.stopTime += dt;
            if (obj.stopTime > 0.5 && !obj.cleared) {
              obj.cleared = true; playSound('ok'); showFloatingText('安全確認OK!', '#2ecc71');
            }
          }
        }
        if (zoneEndZ < player.y && !obj.cleared) {
          gameOver("「止まれ」の交差点で止まらなかった！", "violation"); return;
        }
      }

      let shouldCross = false;
      if (obj.control === 'traffic_light') {
        if (obj.state === 'red') shouldCross = true; 
        else if (obj.ped && obj.ped.isBadManner && relZ < 400) shouldCross = true; 
      } else {
        if (relZ < 500) shouldCross = true; 
      }

      if (obj.event === 'cross_car' && obj.crossCar) {
        let car = obj.crossCar;
        if (shouldCross && !car.triggered) {
          car.triggered = true;
          car.baseSpeedX = (car.isLeft ? 1 : -1) * (150 + Math.random() * 100);
          car.speedX = car.baseSpeedX;
        }
        if (car.triggered) {
          let pdx = player.x - car.x;
          car.speedX = car.baseSpeedX; 
          if (Math.abs(relZ) < 60) {
            if ((car.speedX > 0 && pdx > 0) || (car.speedX < 0 && pdx < 0)) {
              if (Math.abs(pdx) < 80) car.speedX = 0; 
            }
          }
          car.x += car.speedX * dt;

          if (Math.abs(player.x - car.x) < 40 && Math.abs(relZ) < 30) {
            gameOver("交差点の車に自らぶつかった！", "crash"); return;
          }
        }
      }

      if (obj.event === 'pedestrian' && obj.ped) {
        let ped = obj.ped;
        if (shouldCross && !ped.triggered) {
          ped.triggered = true;
          let timeToReach = Math.max(10, relZ) / Math.max(player.currentSpeed, 10);
          ped.speedX = (cw/2) / timeToReach;
          if (!ped.isLeft) ped.speedX *= -1;
          if (ped.isBadManner && obj.control === 'traffic_light') playSound('whistle');
        }
        if (ped.triggered) ped.x += ped.speedX * dt;

        if (Math.abs(player.x - ped.x) < 20 && Math.abs(relZ) < 20) {
          gameOver("横断中の歩行者にぶつかった！", "crash"); return;
        }
      }

      if (obj.event === 'right_turn' && obj.rightCar) {
        let rCar = obj.rightCar;
        if (rCar.state === 'straight') {
          rCar.y += rCar.speed * dt;
          if (rCar.y <= obj.y) {
            if (rCar.isBadManner) {
              rCar.state = 'turning'; rCar.baseSpeed = -80; rCar.baseSpeedX = -200; 
            } else {
              rCar.state = 'waiting'; rCar.speed = 0; showFloatingText('お先にどうぞ！', '#3498db');
            }
          }
        } 
        if (rCar.state === 'waiting') {
          // 💡 プレイヤーが通り過ぎたら再び走り出す
          if (relZ < -100) {
            rCar.state = 'turning'; rCar.baseSpeed = -80; rCar.baseSpeedX = -200; 
          }
        }
        if (rCar.state === 'turning') {
          let rCarZ = rCar.y - distance - player.y;
          let pdx = player.x - rCar.x; 
          rCar.speedX = rCar.baseSpeedX; rCar.speed = rCar.baseSpeed;
          if (Math.abs(pdx) < 60 && Math.abs(rCarZ) < 80) {
            rCar.speedX = 0; rCar.speed = 0; 
          }
          rCar.x += rCar.speedX * dt;
          rCar.y += rCar.speed * dt;
          
          if (Math.abs(player.x - rCar.x) < 30 && Math.abs(rCarZ) < 40) {
            gameOver("右折車に自らぶつかった！", "crash"); return;
          }
        }
      }
    }

    if (obj.type === 'railroad') {
      obj.timer += dt;
      if (relZ < 800 && obj.state === 'open' && !obj.triggered) {
        obj.triggered = true; obj.state = 'warning'; obj.timer = 0;
      }
      if (obj.state === 'warning') {
        if (obj.timer % 1.0 < 0.1) playSound('crossing'); 
        if (obj.timer > 2.0) { obj.state = 'closed'; obj.timer = 0; playSound('train'); }
      }
      else if (obj.state === 'closed') {
        obj.trainX += 1000 * dt; 
        if (obj.trainX > cw + 500) { obj.state = 'open'; obj.cleared = true; }
      }

      let stopDistZ = obj.stopLineY - distance;
      if (stopDistZ < player.y && !obj.cleared && (obj.state === 'warning' || obj.state === 'closed')) {
        if (obj.state === 'closed') gameOver("電車とぶつかった！", "crash");
        else gameOver("踏切の警報を無視した！", "violation");
        return;
      }
    }
  }

  // ==========================================
  // 描画エンジン 
  // ==========================================
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let currentHorizon = HORIZON + (keys.brake ? 5 : 0);

  function project(worldX, worldZ) {
    if (worldZ <= -FOV + 10) return null; 
    let scale = FOV / (FOV + worldZ);
    let x = cw / 2 + (worldX - player.x) * scale;
    let y = currentHorizon + CAM_H * scale;
    return { x: x, y: y, scale: scale };
  }

  function drawPolyOnRoad(rx1, rx2, z1, z2, color) {
    if (z2 <= -FOV + 10) return; 
    let _z1 = Math.max(-FOV + 10, z1); 
    let p1 = project(rx1, z2); let p2 = project(rx2, z2);
    let p3 = project(rx2, _z1); let p4 = project(rx1, _z1);
    if(!p1||!p2||!p3||!p4) return;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.fill();
  }

  function drawWall(x, z1, z2, height, color) {
    let p1 = project(x, z2);
    let p2 = project(x, z1);
    if(!p1 || !p2) return;
    
    let p1Top = { x: p1.x, y: p1.y - height * p1.scale };
    let p2Top = { x: p2.x, y: p2.y - height * p2.scale };

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p2Top.x, p2Top.y); ctx.lineTo(p1Top.x, p1Top.y);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  }

  let grad = ctx.createLinearGradient(0, 0, 0, currentHorizon);
  grad.addColorStop(0, '#3498db'); grad.addColorStop(1, '#87CEEB');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, cw, currentHorizon);
  ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, currentHorizon - 10, cw, 10);
  ctx.fillStyle = '#27ae60'; ctx.fillRect(0, currentHorizon, cw, ch - currentHorizon);

  let facilityZones = [];
  for (let obj of mapObjects) {
    if (obj.type === 'intersection') {
       facilityZones.push({ minZ: obj.y - distance - obj.height/2, maxZ: obj.y - distance + obj.height/2 });
    } else if (obj.type === 'railroad') {
       facilityZones.push({ minZ: obj.y - distance - 20, maxZ: obj.y - distance + 20 });
    }
  }

  const SEG_LEN = 100;
  for (let z = 3000; z > -250; z -= SEG_LEN) {
    let z2 = z; let z1 = z - SEG_LEN;
    if (z2 <= -FOV + 10) continue;
    let _z1 = Math.max(-FOV + 10, z1);

    let isFac = false;
    for (let f of facilityZones) {
       if (z2 > f.minZ && _z1 < f.maxZ) { isFac = true; break; }
    }

    drawPolyOnRoad(roadLeft, roadRight, _z1, z2, '#95a5a6'); 
    drawPolyOnRoad(roadLeft - 40, roadLeft, _z1, z2, '#7f8c8d');
    drawPolyOnRoad(roadRight, roadRight + 40, _z1, z2, '#7f8c8d');

    if (!isFac) {
      drawWall(roadLeft - 40, _z1, z2, 80, '#bdc3c7'); 
      drawWall(roadRight + 40, _z1, z2, 80, '#bdc3c7');
    }
  }

  let lineYOffset = distance % 60;
  for (let z = -lineYOffset - 240; z < 3000; z += 60) {
    let z1 = z; let z2 = z + 30;
    if (z2 <= -FOV + 10) continue;
    let _z1 = Math.max(-FOV + 10, z1);
    
    let isFac = false;
    for (let f of facilityZones) {
       if (z2 > f.minZ && _z1 < f.maxZ) { isFac = true; break; }
    }
    if (!isFac) {
      drawPolyOnRoad(-3, 3, _z1, z2, 'white'); 
    }
  }
  
  for (let z = 3000; z > -250; z -= SEG_LEN) {
    let z2 = z; let z1 = z - SEG_LEN;
    if (z2 <= -FOV + 10) continue;
    let _z1 = Math.max(-FOV + 10, z1);
    let isFac = false;
    for (let f of facilityZones) {
       if (z2 > f.minZ && _z1 < f.maxZ) { isFac = true; break; }
    }
    if (!isFac) {
      drawPolyOnRoad(roadLeft + 12, roadLeft + 16, _z1, z2, 'white'); 
      drawPolyOnRoad(roadRight - 16, roadRight - 12, _z1, z2, 'white'); 
    }
  }

  let renderables = [];

  for (let obj of mapObjects) {
    let wz = obj.y - distance;
    if (wz > 3000 || wz < -250) continue;

    if (obj.type === 'intersection') {
      drawPolyOnRoad(roadLeft - 150, roadRight + 150, wz - obj.height/2, wz + obj.height/2, '#7f8c8d');
      for(let x = roadLeft + 10; x < roadRight; x += 30) { 
        drawPolyOnRoad(x, x+20, wz - obj.height/2 + 5, wz - obj.height/2 + 30, 'white');
        drawPolyOnRoad(x, x+20, wz + obj.height/2 - 30, wz + obj.height/2 - 5, 'white');
      }

      if (obj.control === 'traffic_light') {
        drawPolyOnRoad(roadLeft, roadRight, wz - 60, wz - 55, 'white'); 
        renderables.push({ type: 'traffic_light', x: roadLeft - 30, z: wz, state: obj.state });
      }
      if (obj.control === 'stop_sign') {
        drawPolyOnRoad(roadLeft, roadRight, wz - 60, wz - 55, 'white'); 
        renderables.push({ type: 'stop_sign', x: roadLeft - 30, z: wz - 60 });
      }
      
      if (obj.event === 'cross_car' && obj.crossCar) {
        renderables.push({ type: 'car_side', x: obj.crossCar.x, z: wz, color: obj.crossCar.color });
      }
      if (obj.event === 'pedestrian' && obj.ped) {
        renderables.push({ type: 'ped', x: obj.ped.x, z: wz });
      }
      if (obj.event === 'right_turn' && obj.rightCar) {
        let rz = obj.rightCar.y - distance;
        let ctype = obj.rightCar.state === 'turning' ? 'car_angled' : 'car_front';
        renderables.push({ type: ctype, x: obj.rightCar.x, z: rz, color: obj.rightCar.color });
      }
    }
    else if (obj.type === 'railroad') {
      drawPolyOnRoad(roadLeft - 150, roadRight + 150, wz - 20, wz + 20, '#7f8c8d'); 
      drawPolyOnRoad(roadLeft - 150, roadRight + 150, wz - 15, wz - 10, '#2c3e50'); 
      drawPolyOnRoad(roadLeft - 150, roadRight + 150, wz + 10, wz + 15, '#2c3e50'); 
      drawPolyOnRoad(roadLeft, roadRight, wz - 50, wz - 45, 'white'); 
      
      renderables.push({ type: 'railroad_pole', x: roadLeft - 20, z: wz, state: obj.state, timer: obj.timer });
      if (obj.state === 'closed' && obj.trainX > -300) {
        renderables.push({ type: 'train', x: obj.trainX, z: wz });
      }
    }
    else if (obj.type === 'house') {
      // 💡 配達先の青いライン
      drawPolyOnRoad(roadLeft, roadRight, wz - 10, wz + 10, '#3498db'); 
      renderables.push({ type: 'house_sign', x: roadRight + 20, z: wz });
    }
    else if (obj.type === 'food') {
      if (!obj.cleared) renderables.push({ type: 'food', x: obj.x, z: wz, icon: obj.icon });
    }
    else if (obj.type === 'car' || obj.type === 'parked_car') {
      renderables.push({ type: 'car_back', x: obj.x, z: wz, color: obj.color });
    }
    else if (obj.type === 'oncoming_car') {
      renderables.push({ type: 'car_front', x: obj.x, z: wz, color: obj.color });
    }
    else if (obj.type === 'jaywalker') {
      renderables.push({ type: 'ped_bad', x: obj.x, z: wz });
    }
  }

  renderables.sort((a, b) => b.z - a.z);

  for (let r of renderables) {
    let p = project(r.x, r.z);
    if (!p) continue;
    let s = p.scale;
    let px = p.x; let py = p.y;

    if (r.type === 'car_back' || r.type === 'car_front') {
      let w = 70 * s; let h = 60 * s; 
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.roundRect(px - w/2, py - h, w, h, 3*s); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(px - w*0.4, py - h*0.8, w*0.8, h*0.3);
      if (r.type === 'car_back') {
        ctx.fillStyle = '#e74c3c'; 
        ctx.fillRect(px - w*0.4, py - h*0.3, w*0.2, h*0.15); ctx.fillRect(px + w*0.2, py - h*0.3, w*0.2, h*0.15);
      } else {
        ctx.fillStyle = '#f1c40f'; 
        ctx.fillRect(px - w*0.4, py - h*0.3, w*0.2, h*0.15); ctx.fillRect(px + w*0.2, py - h*0.3, w*0.2, h*0.15);
      }
    }
    else if (r.type === 'car_side' || r.type === 'car_angled') {
      let w = 140 * s; let h = 50 * s;
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.roundRect(px - w/2, py - h, w, h, 3*s); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(px - w*0.2, py - h*0.8, w*0.4, h*0.3);
    }
    else if (r.type === 'ped' || r.type === 'ped_bad') {
      let headR = 10 * s; let bodyW = 14 * s; let bodyH = 35 * s;
      ctx.fillStyle = r.type === 'ped_bad' ? '#e74c3c' : '#3498db';
      ctx.fillRect(px - bodyW/2, py - bodyH, bodyW, bodyH); 
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath(); ctx.arc(px, py - bodyH - headR, headR, 0, Math.PI*2); ctx.fill(); 
    }
    else if (r.type === 'traffic_light') {
      let poleH = 150 * s; let boxW = 100 * s; let boxH = 30 * s;
      ctx.fillStyle = '#7f8c8d'; ctx.fillRect(px - 2*s, py - poleH, 4*s, poleH); 
      let boxY = py - poleH;
      ctx.fillStyle = '#34495e'; ctx.fillRect(px - boxW/2, boxY, boxW, boxH); 
      let rRad = 8 * s;
      ctx.beginPath(); ctx.arc(px - boxW*0.3, boxY + boxH/2, rRad, 0, Math.PI*2); ctx.fillStyle = r.state==='green'?'#2ecc71':'#555'; ctx.fill();
      ctx.beginPath(); ctx.arc(px, boxY + boxH/2, rRad, 0, Math.PI*2); ctx.fillStyle = r.state==='yellow'?'#f1c40f':'#555'; ctx.fill();
      ctx.beginPath(); ctx.arc(px + boxW*0.3, boxY + boxH/2, rRad, 0, Math.PI*2); ctx.fillStyle = r.state==='red'?'#e74c3c':'#555'; ctx.fill();
    }
    else if (r.type === 'stop_sign') {
      let poleH = 100 * s; let signS = 35 * s;
      ctx.fillStyle = '#7f8c8d'; ctx.fillRect(px - 2*s, py - poleH, 4*s, poleH); 
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath(); ctx.moveTo(px - signS, py - poleH); ctx.lineTo(px + signS, py - poleH); ctx.lineTo(px, py - poleH + signS); ctx.fill();
      ctx.fillStyle = 'white'; ctx.font = `bold ${10*s}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText("止", px, py - poleH + signS/2);
    }
    else if (r.type === 'house_sign') {
      ctx.fillStyle = '#3498db';
      ctx.beginPath(); ctx.roundRect(px - 40*s, py - 60*s, 80*s, 60*s, 5*s); ctx.fill();
      ctx.fillStyle = 'white'; ctx.font = `bold ${20*s}px sans-serif`; ctx.textAlign='center'; ctx.fillText("🏠", px, py - 30*s);
    }
    else if (r.type === 'food') {
      ctx.font = `${30*s}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(r.icon, px, py);
    }
    else if (r.type === 'railroad_pole') {
      let poleH = 120 * s;
      ctx.fillStyle = '#333'; ctx.fillRect(px - 4*s, py - poleH, 8*s, poleH);
      
      let blink = Math.floor(r.timer * 4) % 2 === 0;
      let isWarn = r.state==='warning' || r.state==='closed';
      ctx.fillStyle = isWarn && blink ? '#e74c3c' : '#555';
      ctx.beginPath(); ctx.arc(px - 10*s, py - poleH + 15*s, 6*s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = isWarn && !blink ? '#e74c3c' : '#555';
      ctx.beginPath(); ctx.arc(px + 10*s, py - poleH + 15*s, 6*s, 0, Math.PI*2); ctx.fill();

      ctx.save();
      ctx.translate(px, py - poleH + 30*s);
      let angle = r.state === 'closed' ? 0 : (r.state === 'warning' ? -Math.PI/4 : -Math.PI/2);
      ctx.rotate(angle);
      ctx.fillStyle = '#f1c40f'; ctx.fillRect(0, -3*s, (ROAD_WIDTH + 30)*s, 6*s);
      ctx.fillStyle = '#000'; for(let x=10*s; x<(ROAD_WIDTH + 30)*s; x+=25*s) ctx.fillRect(x, -3*s, 12*s, 6*s);
      ctx.restore();
    }
    else if (r.type === 'train') {
      let w = 500 * s; let h = 80 * s;
      ctx.fillStyle = '#e67e22'; ctx.fillRect(px - w/2, py - h, w, h);
      ctx.fillStyle = '#34495e';
      for(let wx = px - w/2 + 20*s; wx < px + w/2; wx += 60*s) ctx.fillRect(wx, py - h + 15*s, 40*s, 35*s);
    }
  }

  ctx.save();
  let tilt = (keys.right ? 20 : 0) - (keys.left ? 20 : 0);
  ctx.translate(cw/2 + tilt, ch + 10); 
  
  ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 20;
  ctx.beginPath();
  ctx.moveTo(-150, 40); ctx.lineTo(-60, -90); 
  ctx.moveTo(150, 40); ctx.lineTo(60, -90);  
  ctx.moveTo(-60, -90); ctx.lineTo(60, -90); 
  ctx.stroke();

  ctx.fillStyle = keys.brake ? '#e67e22' : '#f1c40f';
  ctx.beginPath(); ctx.arc(-60, -90, 25, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60, -90, 25, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  animationId = requestAnimationFrame(gameLoop);
}

function initGame() {
  resize();
  distance = 0;
  score = 0;
  timeLimit = 60.0;
  player.x = -80; 
  player.currentSpeed = 0;
  player.baseSpeed = 80; 
  player.bag = [];
  centerViolationTimer = 0;
  timeUntilNextEvent = 5.0;
  trafficTimer = 2.0;
  
  mapObjects = [];
  nextSpawnDistance = 1000; 
  updateUI();
  document.getElementById('ui-warning').style.opacity = 0;
  
  lastTime = performance.now();
  gameState = 'playing';
  cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

function showStartScreen() {
  document.querySelectorAll('.overlay').forEach(el => el.classList.remove('show'));
  document.getElementById('start-screen').classList.add('show');
}

function startGame() {
  initAudio();
  document.querySelectorAll('.overlay').forEach(el => el.classList.remove('show'));
  initGame();
}

resize();
</script>
</body>
</html>
