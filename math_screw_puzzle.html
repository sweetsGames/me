<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3Dドールハウス解体パズル</title>
<!-- 💡 3Dエンジンとカメラ制御 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { overscroll-behavior: none; touch-action: none; background: #c8d6e5; margin: 0; padding: 0; }
  * { box-sizing: border-box; user-select: none; font-family: 'Rounded M+ 1c', sans-serif; }
  
  body { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; justify-content: center; }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 450px; height: 100%; max-height: 850px;
    background: linear-gradient(180deg, #1e272e 0%, #485460 100%);
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  /* 上部ヘッダー */
  #header { padding: max(15px, var(--sat)) 15px 5px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .header-btn { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; }
  .level-text { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }

  /* ツールボックス */
  #ui-top { padding: 10px; display: flex; justify-content: center; gap: 8px; z-index: 50; min-height: 85px; }
  .toolbox {
    width: 60px; height: 65px; background: #ecf0f1; border-radius: 12px; border-bottom: 6px solid #95a5a6;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; padding: 5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; transition: 0.3s;
  }
  .toolbox-top { position: absolute; top: -6px; width: 30px; height: 10px; border-radius: 4px 4px 0 0; }
  .hole { width: 14px; height: 14px; background: #2c3e50; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); }
  .hole.filled { box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), 0 2px 2px rgba(0,0,0,0.4); }

  /* 待機スロット */
  #slots-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; z-index: 50; }
  .slot {
    width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.3);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
  }
  .slot-screw {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 3px 5px rgba(0,0,0,0.6); position: relative;
  }
  .slot-screw::before { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 3px; background: rgba(0,0,0,0.5); border-radius: 2px; }

  /* 3Dキャンバス */
  #canvas-container { flex: 1; position: relative; width: 100%; touch-action: none; cursor: grab; }
  #canvas-container:active { cursor: grabbing; }
  
  #rotate-hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: bold; pointer-events: none; z-index: 10; animation: pulse 2s infinite; backdrop-filter: blur(4px);
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .shake { animation: shake 0.2s; }

  /* オーバーレイ画面 */
  .overlay {
    position: absolute; inset: 0; background: rgba(10, 20, 30, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .title-logo { font-size: 34px; color: #f1c40f; font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px 0 #d35400, 4px 4px 0 #c0392b; text-align: center; }
  .btn { padding: 15px 50px; font-size: 22px; font-weight: bold; color: white; background: #e67e22; border: none; border-radius: 40px; box-shadow: 0 6px 0 #d35400; cursor: pointer; transition: 0.1s; }
  .btn:active { transform: translateY(6px); box-shadow: none; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <button class="header-btn" onclick="showMenu()">◀ メニュー</button>
    <div class="level-text">LEVEL <span id="ui-level">1</span></div>
    <div style="width: 80px;"></div>
  </div>
  
  <div id="ui-top"></div>
  <div id="slots-container">
    <div class="slot" id="slot-0"></div><div class="slot" id="slot-1"></div><div class="slot" id="slot-2"></div>
    <div class="slot" id="slot-3"></div><div class="slot" id="slot-4"></div>
  </div>

  <div id="canvas-container">
    <div id="rotate-hint">👆 スワイプで回す 🔄</div>
  </div>

  <div id="start-screen" class="overlay show">
    <div class="title-logo">🏠 完全解体！<br>ドールハウスパズル</div>
    <div style="background:rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); padding:20px; border-radius:15px; text-align:center; font-weight:bold; color:#fff; margin-bottom:30px; width:85%; max-width:320px; line-height:1.6;">
      <span style="color:#f1c40f;">360度</span> ぐるぐる回そう！<br><br>
      ハリボテは一切なし。<br>壁や屋根を解体すると…<br><span style="color:#e74c3c;">家の中の家具が現れる！</span><br><br>
      外側から順番にネジを外し<br>家具まで全てバラバラにしよう！
    </div>
    <button class="btn" onclick="startGame()">スタート！</button>
  </div>

  <div id="game-over" class="overlay">
    <h1 style="color:#e74c3c; font-size:40px; margin-bottom:20px;">いっぱい！</h1>
    <button class="btn" style="background:#e74c3c; box-shadow: 0 6px 0 #c0392b;" onclick="initLevel(currentLevel)">リトライ</button>
  </div>

  <div id="game-clear" class="overlay">
    <h1 style="color:#2ecc71; font-size:40px; margin-bottom:20px;">全 解 体 🎉</h1>
    <button class="btn" style="background:#2ecc71; box-shadow: 0 6px 0 #27ae60;" onclick="nextLevel()">次のレベルへ</button>
  </div>
</div>

<script>
// --- 音声 ---
let actx;
function initAudio() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); }
function playSound(type) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  if (type === 'tap') { 
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  } else if (type === 'drop') { 
    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
    gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'box') { 
    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t+0.1); osc.frequency.setValueAtTime(800, t+0.2);
    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.start(t); osc.stop(t + 0.4);
  } else if (type === 'error') { 
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  }
}

// --- 3Dセットアップ ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.minDistance = 5; controls.maxDistance = 30; controls.enablePan = false; 

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(10, 20, 10); scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0xffffff, 0.4); backLight.position.set(-10, -10, -10); scene.add(backLight);

const COLORS = [0xe74c3c, 0xf1c40f, 0x3498db, 0x2ecc71, 0x9b59b6, 0xe67e22, 0x1abc9c, 0xff9ff3]; 
let currentLevel = 1;
let gameState = 'menu';
let state = { activeBoxes: [], queue: [], slots: [null, null, null, null, null], screws: [], plates: [], fallingPlates: [], clickTargets: [], isAnimating: false };

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// --- 💡 部品作成の神ツール群（黒いコアは一切なし！） ---
function localToWorld(pos, rot, lx, ly, lz) {
  let v = new THREE.Vector3(lx, ly, lz);
  v.applyEuler(new THREE.Euler(rot[0], rot[1], rot[2], 'XYZ'));
  v.add(new THREE.Vector3(pos[0], pos[1], pos[2]));
  return [v.x, v.y, v.z];
}

function addPlate(pos, rot, size, colorHex) {
  const geo = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mat = new THREE.MeshLambertMaterial({ color: colorHex });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...pos); mesh.rotation.set(...rot);
  scene.add(mesh);

  let normal = new THREE.Vector3(0, 0, 1).applyEuler(new THREE.Euler(...rot));
  let plateObj = { mesh, screws: [], normal, pos, rot, size };
  state.plates.push(plateObj);
  state.clickTargets.push(mesh);
  mesh.userData = { isPlate: true, obj: plateObj };
  return plateObj;
}

function addScrew(pos, rot, attachedPlates) {
  const sGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.5, 16);
  sGeo.rotateX(Math.PI/2);
  const sMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 100 });
  const mesh = new THREE.Mesh(sGeo, sMat);
  mesh.position.set(...pos); mesh.rotation.set(...rot);
  scene.add(mesh);

  let screwObj = { mesh, colorVal: 0, attachedPlates };
  state.screws.push(screwObj);
  state.clickTargets.push(mesh);
  mesh.userData = { isScrew: true, obj: screwObj };
  attachedPlates.forEach(p => p.screws.push(screwObj));
  return screwObj;
}

// 💡 リアルな家具の組み立て（すべて板とネジで構成！）
function buildTable(cx, cy, cz) {
  let top = addPlate([cx, cy+1.5, cz], [0,0,0], [3, 0.2, 2], 0x8B4513);
  let offsets = [[-1.2, -0.8], [1.2, -0.8], [-1.2, 0.8], [1.2, 0.8]];
  offsets.forEach(off => {
    let leg = addPlate([cx+off[0], cy+0.75, cz+off[1]], [0,0,0], [0.2, 1.5, 0.2], 0xA0522D);
    // 天板から脚に刺さるネジ！
    addScrew([cx+off[0], cy+1.6, cz+off[1]], [Math.PI/2, 0, 0], [top, leg]);
  });
}

function buildChair(cx, cy, cz, rotY) {
  let seatPos = localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.8, 0);
  let seat = addPlate(seatPos, [0,rotY,0], [1.2, 0.2, 1.2], 0x2ECC71);
  
  let backPos = localToWorld([cx,cy,cz], [0,rotY,0], 0, 1.5, -0.5);
  let back = addPlate(backPos, [0,rotY,0], [1.2, 1.2, 0.2], 0x27AE60);
  // 背もたれと座面をつなぐネジ
  addScrew(localToWorld([cx,cy,cz], [0,rotY,0], -0.4, 0.8, -0.5), [0,rotY,0], [seat, back]);
  addScrew(localToWorld([cx,cy,cz], [0,rotY,0], 0.4, 0.8, -0.5), [0,rotY,0], [seat, back]);

  let offsets = [[-0.4, -0.4], [0.4, -0.4], [-0.4, 0.4], [0.4, 0.4]];
  offsets.forEach(off => {
    let legPos = localToWorld([cx,cy,cz], [0,rotY,0], off[0], 0.4, off[1]);
    let leg = addPlate(legPos, [0,rotY,0], [0.2, 0.8, 0.2], 0xA0522D);
    // 座面から脚に刺さるネジ
    addScrew(localToWorld([cx,cy,cz], [0,rotY,0], off[0], 0.9, off[1]), [Math.PI/2, 0, 0], [seat, leg]);
  });
}

function buildBed(cx, cy, cz, rotY) {
  let matPos = localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.6, 0);
  let mat = addPlate(matPos, [0,rotY,0], [2, 0.4, 3.5], 0x3498DB);
  
  let headPos = localToWorld([cx,cy,cz], [0,rotY,0], 0, 1.0, -1.8);
  let head = addPlate(headPos, [0,rotY,0], [2.2, 1.5, 0.2], 0x8B4513);
  addScrew(localToWorld([cx,cy,cz], [0,rotY,0], -0.8, 0.6, -1.8), [0,rotY,0], [mat, head]);
  addScrew(localToWorld([cx,cy,cz], [0,rotY,0], 0.8, 0.6, -1.8), [0,rotY,0], [mat, head]);

  let footPos = localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.8, 1.8);
  let foot = addPlate(footPos, [0,rotY,0], [2.2, 0.8, 0.2], 0x8B4513);
  addScrew(localToWorld([cx,cy,cz], [0,rotY,0], -0.8, 0.6, 1.8), [0,rotY,0], [mat, foot]);
  addScrew(localToWorld([cx,cy,cz], [0,rotY,0], 0.8, 0.6, 1.8), [0,rotY,0], [mat, foot]);
}

// 💡 リアルな家の外壁
function buildWall(cx, cy, cz, rotY, w, h, color) {
  let wall = addPlate([cx, cy+h/2, cz], [0, rotY, 0], [w, h, 0.2], color);
  let offsets = [[-w/2+0.5, h/2-0.5], [w/2-0.5, h/2-0.5], [-w/2+0.5, -h/2+0.5], [w/2-0.5, -h/2+0.5]];
  offsets.forEach(off => {
    let sPos = localToWorld([cx, cy+h/2, cz], [0, rotY, 0], off[0], off[1], 0.15);
    addScrew(sPos, [0, rotY, 0], [wall]);
  });
}

function buildRoof(cx, cy, cz, rotY, w, h, color) {
  let roof = addPlate([cx, cy, cz], [0, rotY, 0], [w, h, 0.2], color);
  // 屋根は斜めになるのでローカル座標でネジを配置
  let offsets = [[-w/2+0.5, h/2-0.5], [w/2-0.5, h/2-0.5], [-w/2+0.5, -h/2+0.5], [w/2-0.5, -h/2+0.5]];
  offsets.forEach(off => {
    let sPos = localToWorld([cx, cy, cz], [0, rotY, 0], off[0], off[1], 0.15);
    addScrew(sPos, [0, rotY, 0], [roof]);
  });
}

function buildFloor(w, d) {
  let floor = addPlate([0, -0.1, 0], [Math.PI/2, 0, 0], [w, d, 0.2], 0x95A5A6);
  let offsets = [[-w/2+0.5, -d/2+0.5], [w/2-0.5, -d/2+0.5], [-w/2+0.5, d/2-0.5], [w/2-0.5, d/2-0.5]];
  offsets.forEach(off => {
    addScrew([off[0], 0, off[1]], [-Math.PI/2, 0, 0], [floor]);
  });
}

// --- 進行管理 ---
function showMenu() {
  gameState = 'menu'; document.getElementById('start-screen').classList.add('show');
  document.getElementById('game-over').classList.remove('show'); document.getElementById('game-clear').classList.remove('show');
}
function startGame() { initAudio(); document.getElementById('start-screen').classList.remove('show'); currentLevel = 1; initLevel(currentLevel); }
function nextLevel() { document.getElementById('game-clear').classList.remove('show'); currentLevel++; initLevel(currentLevel); }

// 💡 難易度に応じた動的なレベル生成
function initLevel(level) {
  gameState = 'playing';
  document.getElementById('game-over').classList.remove('show'); document.getElementById('game-clear').classList.remove('show');
  document.getElementById('ui-level').innerText = level;
  
  while(scene.children.length > 3) {
    let obj = scene.children[3];
    if(obj.geometry) obj.geometry.dispose(); if(obj.material) obj.material.dispose();
    scene.remove(obj);
  }
  state = { activeBoxes: [], queue: [], slots: [null, null, null, null, null], screws: [], plates: [], fallingPlates: [], clickTargets: [], isAnimating: false };
  for(let i=0; i<5; i++) document.getElementById('slot-'+i).innerHTML = '';

  let availableColors = COLORS.slice(0, Math.min(COLORS.length, 2 + Math.floor(level/2)));

  // 💡 レベル設計（徐々に外壁が作られていく）
  if (level === 1) {
    // チュートリアル：家具だけ
    buildFloor(8, 8);
    buildTable(0, 0, 0);
    buildChair(0, 0, 1.8, 0);
  } else if (level === 2) {
    // 家具がいっぱい
    buildFloor(10, 10);
    buildTable(1.5, 0, 0);
    buildChair(1.5, 0, 1.8, 0);
    buildChair(1.5, 0, -1.8, Math.PI);
    buildBed(-2, 0, 0, Math.PI/2);
  } else if (level === 3) {
    // 壁が2枚登場（裏側から覗き込む）
    buildFloor(10, 10);
    buildWall(0, 0, -5, 0, 10, 5, 0xECF0F1);
    buildWall(-5, 0, 0, Math.PI/2, 10, 5, 0xECF0F1);
    buildTable(1.5, 0, 1);
    buildChair(1.5, 0, 2.8, 0);
    buildBed(-2, 0, -1, 0);
  } else {
    // 完全に閉じた家（外壁と屋根を壊さないと家具に触れない！）
    let s = Math.min(14, 8 + Math.floor(level/2));
    buildFloor(s, s);
    buildWall(0, 0, -s/2, 0, s, 5, 0xECF0F1);
    buildWall(0, 0, s/2, Math.PI, s, 5, 0xECF0F1);
    buildWall(-s/2, 0, 0, -Math.PI/2, s, 5, 0xECF0F1);
    buildWall(s/2, 0, 0, Math.PI/2, s, 5, 0xECF0F1);
    
    // 屋根
    buildRoof(0, 6.5, -s/4, -Math.PI/4, s, s*0.75, 0xE74C3C);
    buildRoof(0, 6.5, s/4, Math.PI/4, s, s*0.75, 0xE74C3C);

    // 中の家具をランダム配置
    let numFurniture = Math.min(6, level);
    for(let i=0; i<numFurniture; i++) {
      let fx = (Math.random()-0.5)*(s-4);
      let fz = (Math.random()-0.5)*(s-4);
      let type = Math.floor(Math.random()*3);
      if(type===0) buildTable(fx, 0, fz);
      else if(type===1) buildChair(fx, 0, fz, Math.random()*Math.PI*2);
      else buildBed(fx, 0, fz, Math.random()*Math.PI*2);
    }
  }

  // ネジ総数を3の倍数に調整
  let rem = state.screws.length % 3;
  if (rem !== 0) {
    let addCount = 3 - rem;
    for (let i = 0; i < addCount; i++) {
      let p = state.plates[Math.floor(Math.random() * state.plates.length)];
      let sx = (Math.random()-0.5) * p.size[0] * 0.7;
      let sy = (Math.random()-0.5) * p.size[1] * 0.7;
      let sPos = localToWorld(p.pos, p.rot, sx, sy, p.size[2]/2 + 0.1);
      addScrew(sPos, p.rot, [p]);
    }
  }

  // 色割り当て
  let colorPool = [];
  for(let i=0; i<state.screws.length/3; i++) {
    let c = availableColors[Math.floor(Math.random() * availableColors.length)];
    colorPool.push(c, c, c);
  }
  colorPool.sort(() => Math.random() - 0.5);
  
  state.screws.forEach((s, i) => {
    s.colorVal = colorPool[i];
    s.mesh.material.color.setHex(s.colorVal);
  });

  let counts = {};
  colorPool.forEach(c => {
    counts[c] = (counts[c] || 0) + 1;
    if (counts[c] === 3) { state.queue.push(c); counts[c] = 0; }
  });

  // カメラを引く
  let dist = 14 + level;
  camera.position.set(0, dist*0.6, dist);
  controls.target.set(0, 2, 0);
  controls.update();

  renderBoxes();
}

function renderBoxes() {
  const ui = document.getElementById('ui-top'); ui.innerHTML = '';
  while (state.activeBoxes.length < 4 && state.queue.length > 0) state.activeBoxes.push({ color: state.queue.shift(), count: 0 });

  state.activeBoxes.forEach((box) => {
    let el = document.createElement('div'); el.className = 'toolbox';
    let cssColor = '#' + box.color.toString(16).padStart(6, '0');
    el.style.borderColor = cssColor;
    let top = document.createElement('div'); top.className = 'toolbox-top'; top.style.backgroundColor = cssColor; el.appendChild(top);
    for(let j=0; j<3; j++) {
      let hole = document.createElement('div'); hole.className = 'hole';
      if (j < box.count) { hole.classList.add('filled'); hole.style.backgroundColor = cssColor; }
      el.appendChild(hole);
    }
    box.el = el; ui.appendChild(el);
  });
}

// 💡 レイキャスター
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pointerDownPos = { x: 0, y: 0 };

container.addEventListener('pointerdown', (e) => { if (gameState === 'playing') pointerDownPos = { x: e.clientX, y: e.clientY }; });
container.addEventListener('pointerup', (e) => {
  if (gameState !== 'playing' || state.isAnimating) return;
  if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 10) return; 

  initAudio();
  const rect = container.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(state.clickTargets, false);

  if (intersects.length > 0) {
    let hit = intersects[0].object; 
    if (hit.userData.isScrew) {
      handleScrewClick(hit.userData.obj);
    } else if (hit.userData.isPlate) {
      playSound('error');
      document.getElementById('canvas-container').classList.add('shake');
      setTimeout(()=>document.getElementById('canvas-container').classList.remove('shake'), 200);
    }
  }
});

function handleScrewClick(screwObj) {
  let targetBox = state.activeBoxes.find(b => b.color === screwObj.colorVal && b.count < 3);
  let targetSlotIndex = -1;

  if (!targetBox) {
    targetSlotIndex = state.slots.indexOf(null);
    if (targetSlotIndex === -1) {
      playSound('error'); document.getElementById('slots-container').classList.add('shake');
      setTimeout(()=>document.getElementById('slots-container').classList.remove('shake'), 200);
      return;
    }
  }

  playSound('tap');
  state.isAnimating = true;
  scene.remove(screwObj.mesh);
  state.clickTargets = state.clickTargets.filter(m => m !== screwObj.mesh);
  
  // 💡 複数の板を貫通している場合、それぞれの落下判定を行う
  screwObj.attachedPlates.forEach(p => {
    p.screws = p.screws.filter(s => s !== screwObj);
    if (p.screws.length === 0) {
      setTimeout(() => { playSound('drop'); }, 100);
      state.clickTargets = state.clickTargets.filter(m => m !== p.mesh);
      state.fallingPlates.push(p);
    }
  });

  let cssColor = '#' + screwObj.colorVal.toString(16).padStart(6, '0');

  if (targetBox) {
    targetBox.count++;
    setTimeout(() => { state.isAnimating = false; checkBoxCompletion(targetBox); }, 200);
  } else {
    let slotEl = document.getElementById('slot-' + targetSlotIndex);
    let sIcon = document.createElement('div');
    sIcon.className = 'slot-screw'; sIcon.style.backgroundColor = cssColor;
    slotEl.appendChild(sIcon);
    state.slots[targetSlotIndex] = { color: screwObj.colorVal, obj: screwObj };
    
    if (state.slots.indexOf(null) === -1) {
      gameState = 'gameover';
      setTimeout(() => { document.getElementById('game-over').classList.add('show'); }, 500);
    }
    state.isAnimating = false;
  }
}

function checkBoxCompletion(box) {
  renderBoxes(); 
  if (box.count === 3) {
    playSound('box');
    box.el.style.transform = 'scale(1.1)'; box.el.style.opacity = '0';
    
    setTimeout(() => {
      state.activeBoxes = state.activeBoxes.filter(b => b !== box);
      renderBoxes();
      if (state.activeBoxes.length === 0 && state.queue.length === 0) {
        gameState = 'clear'; 
        setTimeout(() => { document.getElementById('game-clear').classList.add('show'); }, 500);
        return;
      }
      autoMatchFromSlots();
    }, 300);
  }
}

function autoMatchFromSlots() {
  for (let i = 0; i < state.slots.length; i++) {
    let slotItem = state.slots[i];
    if (slotItem) {
      let targetBox = state.activeBoxes.find(b => b.color === slotItem.color && b.count < 3);
      if (targetBox) {
        state.isAnimating = true;
        let slotEl = document.getElementById('slot-' + i); slotEl.innerHTML = ''; state.slots[i] = null; 
        playSound('tap'); targetBox.count++;
        setTimeout(() => { state.isAnimating = false; checkBoxCompletion(targetBox); }, 200);
        return; 
      }
    }
  }
}

// 💡 描画ループ
function loop() {
  requestAnimationFrame(loop);
  controls.update();

  // 💡 外れた家具や壁がパァーン！と弾け飛ぶアニメーション！
  for (let i = state.fallingPlates.length - 1; i >= 0; i--) {
    let p = state.fallingPlates[i];
    
    // 法線方向（外側）へ飛び出し、上にもフワッと浮かぶ
    p.mesh.position.addScaledVector(p.normal, 0.3); 
    p.mesh.position.y += 0.2; 
    
    p.mesh.rotation.x += 0.05; 
    p.mesh.rotation.z += 0.05;
    
    if (!p.mesh.material.transparent) {
      p.mesh.material = p.mesh.material.clone();
      p.mesh.material.transparent = true;
    }
    p.mesh.material.opacity -= 0.03; 
    
    if (p.mesh.material.opacity <= 0 || p.mesh.position.length() > 30) {
      scene.remove(p.mesh);
      state.fallingPlates.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

initLevel(1);
showMenu(); 
loop();     
</script>
