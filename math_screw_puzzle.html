<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3Dドールハウス解体パズル - 思考パズル特化版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { overscroll-behavior: none; touch-action: none; background: #c8d6e5; margin: 0; padding: 0; }
  * { box-sizing: border-box; user-select: none; font-family: 'Rounded M+ 1c', sans-serif; }
  body { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; justify-content: center; }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 450px; height: 100%; max-height: 850px;
    background: linear-gradient(180deg, #2c3e50 0%, #bdc3c7 100%);
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  #header { padding: max(15px, var(--sat)) 15px 5px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .header-btn { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; }
  .level-text { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }

  #ui-top { padding: 10px; display: flex; justify-content: center; gap: 8px; z-index: 50; min-height: 85px; }
  .toolbox {
    width: 60px; height: 65px; background: #ecf0f1; border-radius: 12px; border-bottom: 6px solid #bdc3c7;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; padding: 5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; transition: 0.3s;
  }
  .toolbox-top { position: absolute; top: -6px; width: 30px; height: 10px; border-radius: 4px 4px 0 0; }
  .hole { width: 14px; height: 14px; background: #2c3e50; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); }
  .hole.filled { box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), 0 2px 2px rgba(0,0,0,0.4); }

  #slots-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; z-index: 50; }
  .slot {
    width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.3);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
  }
  .slot-screw {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 3px 5px rgba(0,0,0,0.6); position: relative;
  }
  .slot-screw::before { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 3px; background: rgba(0,0,0,0.5); border-radius: 2px; }

  #canvas-container { flex: 1; position: relative; width: 100%; touch-action: none; cursor: grab; }
  #canvas-container:active { cursor: grabbing; }
  
  #rotate-hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: bold; pointer-events: none; z-index: 10; animation: pulse 2s infinite; backdrop-filter: blur(4px);
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .shake { animation: shake 0.2s; }

  .overlay {
    position: absolute; inset: 0; background: rgba(10, 20, 30, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .title-logo { font-size: 34px; color: #f1c40f; font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px 0 #d35400, 4px 4px 0 #c0392b; text-align: center; }
  
  .slider-container {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); 
    padding: 20px; border-radius: 15px; margin-bottom: 30px; width: 85%; max-width: 320px; text-align: center;
  }
  .slider-container label { color: white; font-weight: bold; font-size: 18px; display: block; margin-bottom: 15px; }
  .level-val { color: #f1c40f; font-size: 24px; font-weight: 900; }
  input[type=range] { width: 100%; accent-color: #e67e22; }
  
  .btn { padding: 15px 50px; font-size: 22px; font-weight: bold; color: white; background: #e67e22; border: none; border-radius: 40px; box-shadow: 0 6px 0 #d35400; cursor: pointer; transition: 0.1s; }
  .btn:active { transform: translateY(6px); box-shadow: none; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <button class="header-btn" onclick="showMenu()">◀ メニュー</button>
    <div class="level-text">LEVEL <span id="ui-level">1</span></div>
    <div style="width: 80px;"></div>
  </div>
  <div id="ui-top"></div>
  <div id="slots-container">
    <div class="slot" id="slot-0"></div><div class="slot" id="slot-1"></div><div class="slot" id="slot-2"></div>
    <div class="slot" id="slot-3"></div><div class="slot" id="slot-4"></div>
  </div>
  <div id="canvas-container"><div id="rotate-hint">👆 スワイプで回す 🔄</div></div>

  <div id="start-screen" class="overlay show">
    <div class="title-logo">🏠 連鎖解体！<br>ドールハウスパズル</div>
    <div class="slider-container">
      <label>開始レベル: <span class="level-val" id="level-display">10</span></label>
      <input type="range" id="level-slider" min="1" max="10" value="10" oninput="document.getElementById('level-display').innerText = this.value">
      <div style="margin-top:15px; font-size:13px; color:#bdc3c7;">
        ネジが減って思考性がアップ！<br>順番を間違えるとスロットがいっぱいに！
      </div>
    </div>
    <button class="btn" onclick="startGame()">スタート！</button>
  </div>

  <div id="game-over" class="overlay">
    <h1 style="color:#e74c3c; font-size:40px; margin-bottom:20px;">いっぱい！</h1>
    <button class="btn" style="background:#e74c3c; box-shadow: 0 6px 0 #c0392b;" onclick="initLevel(currentLevel)">リトライ</button>
  </div>

  <div id="game-clear" class="overlay">
    <h1 style="color:#2ecc71; font-size:40px; margin-bottom:20px;">全 解 体 🎉</h1>
    <button class="btn" style="background:#2ecc71; box-shadow: 0 6px 0 #27ae60;" onclick="nextLevel()">次のレベルへ</button>
  </div>
</div>

<script>
// --- 音声 ---
let actx;
function initAudio() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); }
function playSound(type) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  if (type === 'tap') { 
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  } else if (type === 'drop') { 
    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
    gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'box') { 
    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t+0.1); osc.frequency.setValueAtTime(800, t+0.2);
    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.start(t); osc.stop(t + 0.4);
  } else if (type === 'error') { 
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  }
}

// --- 3Dセットアップ ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.minDistance = 5; controls.maxDistance = 45; controls.enablePan = false; 

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(10, 20, 10); scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0xffffff, 0.4); backLight.position.set(-10, -10, -10); scene.add(backLight);

const COLORS = [0xe74c3c, 0xf1c40f, 0x3498db, 0x2ecc71, 0x9b59b6, 0xe67e22, 0x1abc9c]; 
let currentLevel = 1;
let gameState = 'menu';
let state = { activeBoxes: [], queue: [], slots: [null, null, null, null, null], screws: [], plates: [], fallingPlates: [], clickTargets: [], isAnimating: false };

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

function localToWorld(pos, rot, lx, ly, lz) {
  let v = new THREE.Vector3(lx, ly, lz);
  v.applyEuler(new THREE.Euler(rot[0], rot[1], rot[2], 'XYZ'));
  v.add(new THREE.Vector3(pos[0], pos[1], pos[2]));
  return [v.x, v.y, v.z];
}

const textureCache = {};
function getIconTexture(icon, bgColor, w, h, size) {
  let key = icon + bgColor + w + h;
  if(textureCache[key]) return textureCache[key];
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, w, h);
  ctx.font = `${size}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(icon, w/2, h/2 + size*0.1); 
  const tex = new THREE.CanvasTexture(canvas);
  textureCache[key] = tex;
  return tex;
}

function addPlate(pos, rot, size, colorHex, baseDepth = 0, customMaterial = null) {
  const geo = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mat = customMaterial || new THREE.MeshLambertMaterial({ color: colorHex, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...pos); mesh.rotation.set(...rot);
  scene.add(mesh);

  let normal = new THREE.Vector3(0, 0, 1).applyEuler(new THREE.Euler(...rot));
  let plateObj = { mesh, screws: [], normal, pos, rot, size, blockedBy: [], hasFallen: false, depth: baseDepth, baseDepth: baseDepth };
  state.plates.push(plateObj);
  state.clickTargets.push(mesh);
  mesh.userData = { isPlate: true, obj: plateObj };
  return plateObj;
}

function addScrew(pos, rot, attachedPlates) {
  const group = new THREE.Group();
  const headGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.15, 16);
  headGeo.rotateX(Math.PI/2);
  const headMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 80 });
  const head = new THREE.Mesh(headGeo, headMat);
  group.add(head);
  
  const shaftGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8);
  shaftGeo.rotateX(Math.PI/2);
  shaftGeo.translate(0, 0, -0.3);
  const shaftMat = new THREE.MeshPhongMaterial({ color: 0x7f8c8d });
  const shaft = new THREE.Mesh(shaftGeo, shaftMat);
  group.add(shaft);
  
  group.position.set(...pos); group.rotation.set(...rot);
  scene.add(group);

  let screwObj = { mesh: group, headMesh: head, colorVal: 0, attachedPlates: attachedPlates, depth: 0 };
  state.screws.push(screwObj);
  state.clickTargets.push(head); 
  head.userData = { isScrew: true, obj: screwObj };
  attachedPlates.forEach(p => p.screws.push(screwObj));
  return screwObj;
}

function checkCascades() {
  let changed = true;
  while(changed) {
    changed = false;
    for(let p of state.plates) {
      if(!p.hasFallen && p.screws.length === 0) {
        let isBlocked = p.blockedBy.some(b => !b.hasFallen);
        if(!isBlocked) {
          p.hasFallen = true;
          state.fallingPlates.push(p);
          setTimeout(() => { playSound('drop'); }, Math.random() * 150);
          changed = true; 
        }
      }
    }
  }
}

// 💡 複数枚の板（壁）ネジ数を削減
function buildDividedWall(cx, cy, cz, rotY, w, h, baseColor, numPlanks, blockers = []) {
  let plankH = h / numPlanks;
  for(let i=0; i<numPlanks; i++) {
    let py = cy - h/2 + plankH/2 + i * plankH;
    let color = new THREE.Color(baseColor);
    color.offsetHSL(0, 0, (i%2===0)?0.05:-0.05); 
    
    let plank = addPlate([cx, py, cz], [0, rotY, 0], [w - 0.1, plankH - 0.05, 0.2], color.getHex());
    blockers.forEach(b => plank.blockedBy.push(b));
    
    // 💡 1個〜2個に削減（60%の確率で1個になる！）
    let numScrews = (Math.random() > 0.4) ? 1 : 2; 
    let spacing = (w - 1.2) / numScrews; 
    let startX = -(w - 1.2) / 2 + spacing / 2;

    for(let j=0; j<numScrews; j++) {
      let sx = startX + j * spacing + (Math.random() - 0.5) * (spacing * 0.4); 
      let isBack = Math.random() < (currentLevel * 0.05); 
      let sz = isBack ? -0.15 : 0.15;
      let sPos = localToWorld([cx, py, cz], [0, rotY, 0], sx, 0, sz);
      let rot = [0, rotY, 0];
      if (isBack) rot[1] += Math.PI; 
      addScrew(sPos, rot, [plank]);
    }
  }
}

// 💡 複数枚の板（屋根）ネジ数を削減
function buildDividedRoofFlat(cx, cy, cz, w, d, baseColor, numPlanks, chimneyObj = null, chimneyZ = 0) {
  let plankD = d / numPlanks;
  for(let i=0; i<numPlanks; i++) {
    let pz = cz - d/2 + plankD/2 + i * plankD;
    let color = new THREE.Color(baseColor);
    color.offsetHSL(0, 0, (i%2===0)?0.05:-0.05); 
    
    let plank = addPlate([cx, cy, pz], [-Math.PI/2, 0, 0], [w - 0.1, plankD - 0.05, 0.2], color.getHex());
    
    if (chimneyObj && Math.abs(pz - chimneyZ) <= plankD * 1.5) {
      plank.blockedBy.push(chimneyObj);
    }

    // 💡 1個〜2個に削減
    let numScrews = (Math.random() > 0.4) ? 1 : 2;
    let spacing = (w - 1.2) / numScrews;
    let startX = -(w - 1.2) / 2 + spacing / 2;

    for(let j=0; j<numScrews; j++) {
      let sx = startX + j * spacing + (Math.random() - 0.5) * (spacing * 0.4);
      let isBack = Math.random() < (currentLevel * 0.05); 
      let sz = isBack ? -0.15 : 0.15;
      let sPos = localToWorld([cx, cy, pz], [-Math.PI/2, 0, 0], sx, 0, sz);
      let rot = [-Math.PI/2, 0, 0];
      if (isBack) rot[0] += Math.PI; 
      addScrew(sPos, rot, [plank]);
    }
  }
}

// --- 家具と階段 ---
function buildStairs(cx, cy, cz, floorHeight) {
  let len = floorHeight * 1.414; 
  let stairs = addPlate([cx, cy, cz], [-Math.PI/4, 0, 0], [2, len, 0.2], 0xA0522D, 4);
  addScrew(localToWorld(stairs.pos, stairs.rot, -0.6, len/2 - 0.6, 0.15), stairs.rot, [stairs]);
  addScrew(localToWorld(stairs.pos, stairs.rot, 0.6, -len/2 + 0.6, 0.15), stairs.rot, [stairs]);
}

function buildTable(cx, cy, cz) {
  let top = addPlate([cx, cy+1.0, cz], [-Math.PI/2, 0, 0], [2.4, 1.4, 0.15], 0x8B4513, 5);
  let offsets = [[-1.0, -0.5], [1.0, -0.5], [-1.0, 0.5], [1.0, 0.5]];
  offsets.forEach(off => {
    let leg = addPlate([cx+off[0], cy+0.5, cz+off[1]], [0,0,0], [0.2, 1.0, 0.2], 0xA0522D, 5);
    addScrew(localToWorld(top.pos, top.rot, off[0], off[1], 0.15), top.rot, [top, leg]);
  });
}

function buildChair(cx, cy, cz, rotY) {
  let seat = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.6, 0), [-Math.PI/2, 0, rotY], [0.8, 0.8, 0.1], 0x2ECC71, 5);
  let back = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], 0, 1.0, -0.35), [0, rotY, 0], [0.8, 0.8, 0.1], 0x27AE60, 5);
  addScrew(localToWorld(back.pos, back.rot, -0.2, -0.2, 0.1), back.rot, [seat, back]);
  addScrew(localToWorld(back.pos, back.rot, 0.2, -0.2, 0.1), back.rot, [seat, back]);
  let offsets = [[-0.3, -0.3], [0.3, -0.3], [-0.3, 0.3], [0.3, 0.3]];
  offsets.forEach(off => {
    let leg = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], off[0], 0.3, off[1]), [0,rotY,0], [0.1, 0.6, 0.1], 0xA0522D, 5);
    addScrew(localToWorld(seat.pos, seat.rot, off[0], off[1], 0.1), seat.rot, [seat, leg]);
  });
}

function buildBed(cx, cy, cz, rotY) {
  let mat = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.4, 0), [-Math.PI/2, 0, rotY], [1.6, 2.5, 0.2], 0x3498DB, 5);
  let head = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.7, -1.2), [0, rotY, 0], [1.6, 0.8, 0.1], 0x8B4513, 5);
  addScrew(localToWorld(head.pos, head.rot, -0.5, -0.2, 0.1), head.rot, [mat, head]);
  addScrew(localToWorld(head.pos, head.rot, 0.5, -0.2, 0.1), head.rot, [mat, head]);
}

function buildBookshelf(cx, cy, cz, rotY) {
  let back = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], 0, 1.5, -0.2), [0, rotY, 0], [1.8, 3.0, 0.1], 0x8B4513, 5);
  for(let i=0; i<3; i++) {
    let shelf = addPlate(localToWorld([cx,cy,cz], [0,rotY,0], 0, 0.5 + i*1.0, 0), [-Math.PI/2, 0, rotY], [1.8, 0.4, 0.1], 0xA0522D, 5);
    addScrew(localToWorld(back.pos, back.rot, -0.6, -1.0 + i*1.0, 0.1), back.rot, [shelf, back]);
    addScrew(localToWorld(back.pos, back.rot, 0.6, -1.0 + i*1.0, 0.1), back.rot, [shelf, back]);
  }
}

function buildRoomFurniture(s, cy, isFirstFloor) {
  buildTable(0, cy, 0);
  buildChair(0, cy, 1.2, 0);
  buildChair(0, cy, -1.2, Math.PI);
  buildChair(1.4, cy, 0, -Math.PI/2);
  
  if (isFirstFloor) {
    buildBed(-s/2 + 1.5, cy, -s/2 + 1.5, 0);
  } else {
    buildBed(-s/2 + 1.5, cy, -s/2 + 1.5, 0);
    buildBookshelf(s/2 - 0.5, cy, s/2 - 1.5, -Math.PI/2);
  }
}

// --- 進行管理 ---
function showMenu() {
  gameState = 'menu'; document.getElementById('start-screen').classList.add('show');
  document.getElementById('game-over').classList.remove('show'); document.getElementById('game-clear').classList.remove('show');
}
function startGame(lvl) { 
  initAudio(); document.getElementById('start-screen').classList.remove('show'); 
  let selected = parseInt(document.getElementById('level-slider').value);
  currentLevel = lvl || selected; initLevel(currentLevel); 
}
function nextLevel() { document.getElementById('game-clear').classList.remove('show'); currentLevel++; initLevel(currentLevel); }

function initLevel(level) {
  gameState = 'playing';
  document.getElementById('game-over').classList.remove('show'); document.getElementById('game-clear').classList.remove('show');
  document.getElementById('ui-level').innerText = level;
  
  while(scene.children.length > 3) {
    let obj = scene.children[3];
    if(obj.geometry) obj.geometry.dispose(); if(obj.material) obj.material.dispose();
    scene.remove(obj);
  }
  state = { activeBoxes: [], queue: [], slots: [null, null, null, null, null], screws: [], plates: [], fallingPlates: [], clickTargets: [], isAnimating: false };
  for(let i=0; i<5; i++) document.getElementById('slot-'+i).innerHTML = '';

  let s = Math.min(12, 6 + Math.floor(level/1.5));
  let h = 4; 
  let isTwoStory = level >= 8; 

  // --- 1階 ---
  let floor1 = addPlate([0, -0.1, 0], [Math.PI/2, 0, 0], [s, s, 0.2], 0xBDC3C7);
  for(let i=0;i<4;i++) {
    let off = [[-s/2+0.8, -s/2+0.8], [s/2-0.8, -s/2+0.8], [-s/2+0.8, s/2-0.8], [s/2-0.8, s/2-0.8]][i];
    addScrew([off[0], 0.15, off[1]], [-Math.PI/2, 0, 0], [floor1]);
  }

  buildRoomFurniture(s, 0, isTwoStory); 

  if (isTwoStory) {
    buildStairs(s/2 - 2, h/2, 0, h);
  }

  let f1Front = []; let f1Left = []; let f1Right = []; let f1Back = [];
  
  if (level >= 3) {
    // 窓
    let win1 = addPlate([-s/2 - 0.15, 2.0, 0], [0, -Math.PI/2, 0], [1.5, 1.5, 0.1], 0x87CEEB); f1Left.push(win1);
    addScrew(localToWorld(win1.pos, win1.rot, -0.5, 0.5, 0.15), win1.rot, [win1]);
    addScrew(localToWorld(win1.pos, win1.rot, 0.5, -0.5, 0.15), win1.rot, [win1]);
    
    // 花壇
    if (level >= 4) {
      let flowerMat = new THREE.MeshLambertMaterial({ map: getIconTexture('🌷 🌻 🌷 🌻 🌷', '#27ae60', 512, 128, 70), side: THREE.DoubleSide, transparent: true });
      let flowerBed = addPlate([s/2 + 0.15, 0.5, 0], [0, Math.PI/2, 0], [3.0, 1.0, 0.1], 0xffffff, 0, flowerMat); 
      f1Right.push(flowerBed);
      addScrew(localToWorld(flowerBed.pos, flowerBed.rot, -1.0, 0, 0.15), flowerBed.rot, [flowerBed]);
      addScrew(localToWorld(flowerBed.pos, flowerBed.rot, 1.0, 0, 0.15), flowerBed.rot, [flowerBed]);
    }
  }

  // ドア、看板、郵便受け
  if (level >= 4) {
    let sign = addPlate([-0.2, 2.1, s/2 + 0.3], [0, 0, 0], [2.8, 1.2, 0.1], 0xF1C40F);
    addScrew(localToWorld(sign.pos, sign.rot, -1.0, 0, 0.15), sign.rot, [sign]); 
    addScrew(localToWorld(sign.pos, sign.rot, 1.0, 0, 0.15), sign.rot, [sign]);

    let door = addPlate([0, 1.3, s/2 + 0.15], [0, 0, 0], [2.0, 2.6, 0.1], 0x8E44AD); 
    door.blockedBy.push(sign); f1Front.push(door);
    addScrew(localToWorld(door.pos, door.rot, -0.6, 0.8, 0.15), door.rot, [door]);
    addScrew(localToWorld(door.pos, door.rot, 0.6, -0.8, 0.15), door.rot, [door]);

    if (Math.random() > 0.3) {
      let mailMat = new THREE.MeshLambertMaterial({ map: getIconTexture('✉️', '#c0392b', 128, 128, 60), side: THREE.DoubleSide });
      let mailbox = addPlate([1.8, 1.2, s/2 + 0.15], [0, 0, 0], [1.0, 1.0, 0.1], 0xffffff, 0, mailMat);
      f1Front.push(mailbox);
      // 💡 ネジを1個にスリム化
      addScrew(localToWorld(mailbox.pos, mailbox.rot, 0, 0.3, 0.15), mailbox.rot, [mailbox]);
    }
  }

  // 家の中の絵画
  if (level >= 5 && Math.random() > 0.3) {
    let paintMat = new THREE.MeshLambertMaterial({ map: getIconTexture('🖼', '#f39c12', 256, 128, 80), side: THREE.DoubleSide });
    let painting = addPlate([0, 2.0, -s/2 + 0.15], [0, Math.PI, 0], [2.0, 1.2, 0.1], 0xffffff, 4, paintMat); 
    // 💡 ネジを1個にスリム化
    addScrew(localToWorld(painting.pos, painting.rot, 0, 0.4, 0.15), painting.rot, [painting]);
  }

  let numWallPlanks = Math.min(5, 2 + Math.floor(level/2));
  if (level >= 4) {
    buildDividedWall(0, h/2, -s/2, Math.PI, s, h, 0xECF0F1, numWallPlanks, f1Back); 
    buildDividedWall(-s/2, h/2, 0, -Math.PI/2, s, h, 0xECF0F1, numWallPlanks, f1Left); 
    buildDividedWall(s/2, h/2, 0, Math.PI/2, s, h, 0xECF0F1, numWallPlanks, f1Right); 
    buildDividedWall(0, h/2, s/2, 0, s, h, 0xECF0F1, numWallPlanks, f1Front); 
  }

  // --- 2階と屋根 ---
  let roofHeight = isTwoStory ? h*2 + 0.1 : h + 0.1;

  if (isTwoStory) {
    let floor2 = addPlate([0, h, 0], [Math.PI/2, 0, 0], [s, s, 0.2], 0x95A5A6, 3);
    for(let i=0;i<4;i++) {
      let off = [[-s/2+0.8, -s/2+0.8], [s/2-0.8, -s/2+0.8], [-s/2+0.8, s/2-0.8], [s/2-0.8, s/2-0.8]][i];
      addScrew([off[0], h + 0.15, off[1]], [-Math.PI/2, 0, 0], [floor2]);
    }

    buildRoomFurniture(s, h + 0.1, false); 

    let f2Front = []; let f2Left = []; let f2Right = []; let f2Back = [];
    
    let win2 = addPlate([0, h + 2.0, s/2 + 0.15], [0, 0, 0], [1.5, 1.5, 0.1], 0x87CEEB); f2Front.push(win2);
    addScrew(localToWorld(win2.pos, win2.rot, -0.5, 0.5, 0.15), win2.rot, [win2]);
    addScrew(localToWorld(win2.pos, win2.rot, 0.5, -0.5, 0.15), win2.rot, [win2]);

    // 2階の時計
    if (Math.random() > 0.3) {
      let clockMat = new THREE.MeshLambertMaterial({ map: getIconTexture('🕒', '#ecf0f1', 128, 128, 80), side: THREE.DoubleSide });
      let clock = addPlate([s/2 - 1.5, h + 2.8, s/2 + 0.15], [0, 0, 0], [1.2, 1.2, 0.1], 0xffffff, 0, clockMat);
      f2Front.push(clock);
      // 💡 ネジを1個にスリム化
      addScrew(localToWorld(clock.pos, clock.rot, 0, 0.3, 0.15), clock.rot, [clock]);
    }

    buildDividedWall(0, h + h/2, -s/2, Math.PI, s, h, 0xBDC3C7, numWallPlanks, f2Back); 
    buildDividedWall(-s/2, h + h/2, 0, -Math.PI/2, s, h, 0xBDC3C7, numWallPlanks, f2Left); 
    buildDividedWall(s/2, h + h/2, 0, Math.PI/2, s, h, 0xBDC3C7, numWallPlanks, f2Right); 
    buildDividedWall(0, h + h/2, s/2, 0, s, h, 0xBDC3C7, numWallPlanks, f2Front); 
  }

  let chimneyObj = null;
  let chimneyZ = -s/4; 
  if (level >= 5) {
    let ch = 1.5 + (level * 0.2); 
    chimneyObj = addPlate([s/4, roofHeight + ch/2, chimneyZ], [0, 0, 0], [1.0, ch, 1.0], 0xE67E22);
    addScrew(localToWorld(chimneyObj.pos, chimneyObj.rot, -0.3, ch/3, 0.6), chimneyObj.rot, [chimneyObj]);
    addScrew(localToWorld(chimneyObj.pos, chimneyObj.rot, 0.3, ch/3, 0.6), chimneyObj.rot, [chimneyObj]);
  }

  let roofBlockers = [];
  if (level >= 6 && Math.random() > 0.3) {
    let solarMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50, side: THREE.DoubleSide }); 
    let solar = addPlate([-s/4, roofHeight + 0.15, 0], [-Math.PI/2, 0, 0], [s/2 - 0.5, s - 1.0, 0.1], 0xffffff, 0, solarMat);
    roofBlockers.push(solar);
    addScrew(localToWorld(solar.pos, solar.rot, -1.0, 1.0, 0.15), solar.rot, [solar]);
    addScrew(localToWorld(solar.pos, solar.rot, 1.0, -1.0, 0.15), solar.rot, [solar]);
  }

  if (level >= 4) {
    buildDividedRoofFlat(0, roofHeight, 0, s + 0.5, s + 0.5, 0xE74C3C, numWallPlanks, chimneyObj, chimneyZ);
    if (roofBlockers.length > 0) {
      state.plates.forEach(p => {
        if (p.pos[1] === roofHeight && p.pos[0] < 0) { 
          p.blockedBy.push(roofBlockers[0]);
        }
      });
    }
  }

  // ダミーネジで3の倍数に調整
  let rem = state.screws.length % 3;
  if (rem !== 0) {
    let addCount = 3 - rem;
    for (let i = 0; i < addCount; i++) {
      let sx = (Math.random()-0.5) * floor1.size[0] * 0.8;
      let sz = (Math.random()-0.5) * floor1.size[2] * 0.8;
      addScrew([sx, 0.15, sz], [-Math.PI/2, 0, 0], [floor1]);
    }
  }

  // デプス計算とカラーシャッフル
  let changed = true;
  while(changed) {
    changed = false;
    for(let p of state.plates) {
      let maxBlockDepth = -1;
      for(let b of p.blockedBy) {
        if (b.depth > maxBlockDepth) maxBlockDepth = b.depth;
      }
      let newDepth = Math.max(p.baseDepth, maxBlockDepth + 1); 
      if (p.depth !== newDepth) { p.depth = newDepth; changed = true; }
    }
  }
  for(let sc of state.screws) {
    sc.depth = Math.max(...sc.attachedPlates.map(p => p.depth));
  }

  let shuffledScrews = [...state.screws];
  shuffledScrews.sort((a, b) => {
    let diff = a.depth - b.depth;
    return diff + (Math.random() - 0.5) * (level * 0.8); 
  });

  let availableColors = COLORS.slice(0, Math.min(COLORS.length, 3 + Math.floor(level/2)));
  let colorPool = [];
  for(let i=0; i<state.screws.length/3; i++) {
    let c = availableColors[i % availableColors.length];
    colorPool.push(c, c, c);
  }
  
  shuffledScrews.forEach((sc, i) => {
    sc.colorVal = colorPool[i];
    sc.headMesh.material.color.setHex(sc.colorVal); 
  });

  let counts = {};
  colorPool.forEach(c => {
    counts[c] = (counts[c] || 0) + 1;
    if (counts[c] === 3) { state.queue.push(c); counts[c] = 0; }
  });

  checkCascades();

  let dist = isTwoStory ? 20 + level : 14 + level;
  camera.position.set(0, dist*0.6, dist);
  controls.target.set(0, isTwoStory ? h : h/2, 0); 
  controls.update();
  renderBoxes();
}

function renderBoxes() {
  const ui = document.getElementById('ui-top'); ui.innerHTML = '';
  while (state.activeBoxes.length < 4 && state.queue.length > 0) state.activeBoxes.push({ color: state.queue.shift(), count: 0 });
  
  state.activeBoxes.forEach((box) => {
    let el = document.createElement('div'); el.className = 'toolbox';
    let cssColor = '#' + box.color.toString(16).padStart(6, '0');
    el.style.borderColor = cssColor;
    let top = document.createElement('div'); top.className = 'toolbox-top'; top.style.backgroundColor = cssColor; el.appendChild(top);
    for(let j=0; j<3; j++) {
      let hole = document.createElement('div'); hole.className = 'hole';
      if (j < box.count) { hole.classList.add('filled'); hole.style.backgroundColor = cssColor; }
      el.appendChild(hole);
    }
    box.el = el; ui.appendChild(el);
  });
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pointerDownPos = { x: 0, y: 0 };

container.addEventListener('pointerdown', (e) => { if (gameState === 'playing') pointerDownPos = { x: e.clientX, y: e.clientY }; });
container.addEventListener('pointerup', (e) => {
  if (gameState !== 'playing' || state.isAnimating) return;
  if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 10) return; 

  initAudio();
  const rect = container.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(state.clickTargets, false);

  if (intersects.length > 0) {
    let hit = intersects[0].object; 
    
    if (hit.userData.isScrew) {
      let screwObj = hit.userData.obj;
      
      let screwNormal = new THREE.Vector3(0, 0, 1).applyEuler(screwObj.mesh.rotation);
      let camDir = new THREE.Vector3().subVectors(camera.position, screwObj.mesh.position).normalize();
      
      if (screwNormal.dot(camDir) > 0.1) {
        handleScrewClick(screwObj);
      } else {
        playSound('error');
        screwObj.mesh.position.y += 0.1; 
        setTimeout(() => screwObj.mesh.position.y -= 0.1, 100);
      }
    } else if (hit.userData.isPlate) {
      playSound('error');
      document.getElementById('canvas-container').classList.add('shake');
      setTimeout(()=>document.getElementById('canvas-container').classList.remove('shake'), 200);
    }
  }
});

function handleScrewClick(screwObj) {
  let targetBox = state.activeBoxes.find(b => b.color === screwObj.colorVal && b.count < 3);
  let targetSlotIndex = -1;

  if (!targetBox) {
    targetSlotIndex = state.slots.indexOf(null);
    if (targetSlotIndex === -1) {
      playSound('error'); document.getElementById('slots-container').classList.add('shake');
      setTimeout(()=>document.getElementById('slots-container').classList.remove('shake'), 200);
      return;
    }
  }

  playSound('tap');
  state.isAnimating = true;
  scene.remove(screwObj.mesh);
  state.clickTargets = state.clickTargets.filter(m => m !== screwObj.headMesh);
  
  screwObj.attachedPlates.forEach(p => {
    p.screws = p.screws.filter(s => s !== screwObj);
  });
  
  checkCascades();
  let cssColor = '#' + screwObj.colorVal.toString(16).padStart(6, '0');

  if (targetBox) {
    targetBox.count++;
    setTimeout(() => { state.isAnimating = false; checkBoxCompletion(targetBox); }, 200);
  } else {
    let slotEl = document.getElementById('slot-' + targetSlotIndex);
    let sIcon = document.createElement('div');
    sIcon.className = 'slot-screw'; sIcon.style.backgroundColor = cssColor;
    slotEl.appendChild(sIcon);
    state.slots[targetSlotIndex] = { color: screwObj.colorVal, obj: screwObj };
    
    if (state.slots.indexOf(null) === -1) {
      gameState = 'gameover';
      setTimeout(() => { document.getElementById('game-over').classList.add('show'); }, 500);
    }
    state.isAnimating = false;
  }
}

function checkBoxCompletion(box) {
  renderBoxes(); 
  if (box.count === 3) {
    playSound('box');
    box.el.style.transform = 'scale(1.1)'; box.el.style.opacity = '0';
    
    setTimeout(() => {
      state.activeBoxes = state.activeBoxes.filter(b => b !== box);
      renderBoxes();
      autoMatchFromSlots();
    }, 300);
  }
}

function autoMatchFromSlots() {
  for (let i = 0; i < state.slots.length; i++) {
    let slotItem = state.slots[i];
    if (slotItem) {
      let targetBox = state.activeBoxes.find(b => b.color === slotItem.color && b.count < 3);
      if (targetBox) {
        state.isAnimating = true;
        let slotEl = document.getElementById('slot-' + i); slotEl.innerHTML = ''; state.slots[i] = null; 
        playSound('tap'); targetBox.count++;
        setTimeout(() => { state.isAnimating = false; checkBoxCompletion(targetBox); }, 200);
        return; 
      }
    }
  }
}

function loop() {
  requestAnimationFrame(loop);
  controls.update();

  for (let i = state.fallingPlates.length - 1; i >= 0; i--) {
    let p = state.fallingPlates[i];
    
    p.mesh.position.addScaledVector(p.normal, 0.4); 
    p.mesh.position.y += 0.2; 
    p.mesh.rotation.x += 0.05; 
    p.mesh.rotation.z += 0.05;

    if (!p.mesh.material.transparent) {
      p.mesh.material = p.mesh.material.clone();
      p.mesh.material.transparent = true;
    }
    p.mesh.material.opacity -= 0.03; 
    
    if (p.mesh.material.opacity <= 0 || p.mesh.position.length() > 30) {
      scene.remove(p.mesh);
      state.fallingPlates.splice(i, 1);
    }
  }

  if (gameState === 'playing' && state.activeBoxes.length === 0 && state.queue.length === 0 && state.slots.every(s => s === null)) {
    let allPlatesFallen = state.plates.every(p => p.hasFallen);
    if (allPlatesFallen && state.fallingPlates.length === 0) {
      gameState = 'clear'; 
      setTimeout(() => { document.getElementById('game-clear').classList.add('show'); }, 300);
    }
  }

  renderer.render(scene, camera);
}

showMenu(); 
loop();     
</script>
