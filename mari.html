<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 画面拡大・縮小・バウンスを防ぎ、全画面にフィットさせる -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>さんすうクエスト！ジャンプアドベンチャー</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5c94fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="さんすうマリオ">

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * {
      box-sizing: border-box; user-select: none; -webkit-user-select: none;
      margin: 0; padding: 0; -webkit-touch-callout: none;
    }
    html, body {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      height: 100dvh; overflow: hidden; background: #5c94fc;
      font-family: "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", sans-serif;
      touch-action: none;
    }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }

    /* 上部HUD（見切れ防止・セーフエリア連動） */
    .hud {
      position: absolute;
      top: max(10px, var(--sat));
      left: max(12px, var(--sal));
      right: max(12px, var(--sar));
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; z-index: 10; pointer-events: none;
    }
    .hud-box {
      background: rgba(255, 255, 255, 0.95); border: 3px solid #ff4081;
      border-radius: 20px; padding: 6px 14px; font-size: clamp(14px, 3.5vw, 18px);
      font-weight: bold; color: #d81b60; box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .mission-box {
      color: #1565c0; border-color: #2196f3; flex-shrink: 1; overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 下部コントローラー（見切れ防止・自動サイズ調整） */
    .controller {
      position: absolute;
      bottom: max(12px, var(--sab));
      left: max(12px, var(--sal));
      right: max(12px, var(--sar));
      display: flex; justify-content: space-between; align-items: flex-end;
      z-index: 20; pointer-events: none;
    }
    .dpad {
      display: flex; gap: clamp(8px, 2.5vw, 18px);
      pointer-events: auto;
    }
    .action-pad { pointer-events: auto; }
    
    .touch-btn {
      width: clamp(58px, 14vw, 76px);
      height: clamp(58px, 14vw, 76px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88); border: 3px solid #ffffff;
      box-shadow: 0 5px 10px rgba(0,0,0,0.25);
      display: flex; justify-content: center; align-items: center;
      font-size: clamp(22px, 5.5vw, 30px); font-weight: bold; color: #333;
      touch-action: none;
    }
    .touch-btn:active, .touch-btn.active {
      transform: scale(0.92); background: #ffe082;
    }
    .btn-jump {
      width: clamp(68px, 16vw, 88px);
      height: clamp(68px, 16vw, 88px);
      background: #ff4081; color: white; border-color: #ff80ab;
      font-size: clamp(16px, 4vw, 22px);
      box-shadow: 0 5px 12px rgba(255,64,129,0.45);
    }
    .btn-jump:active, .btn-jump.active {
      background: #c2185b; transform: scale(0.92);
    }

    /* タイトル・クリア画面 */
    .overlay {
      position: absolute; inset: 0; background: rgba(92, 148, 252, 0.96);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; z-index: 30;
    }
    h1 {
      color: #fff; font-size: clamp(24px, 6vw, 34px); text-shadow: 3px 3px 0 #d81b60;
      margin-bottom: 15px; text-align: center; line-height: 1.3;
    }
    p {
      color: #fff; font-size: clamp(15px, 4vw, 19px); margin-bottom: 25px;
      text-align: center; line-height: 1.6; text-shadow: 1px 1px 2px #000;
    }
    .btn-start {
      background: #ffeb3b; color: #d81b60; font-size: clamp(18px, 5vw, 24px);
      font-weight: bold; border: 4px solid #fff; border-radius: 40px;
      padding: 12px 40px; box-shadow: 0 6px 0 #fbc02d; cursor: pointer;
    }
    .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #fbc02d; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- HUD -->
  <div class="hud">
    <div id="mission-ui" class="hud-box mission-box">もんだい：2 ＋ 3 ＝ ？</div>
    <div id="score-ui" class="hud-box">🪙 0</div>
  </div>

  <!-- タイトル画面 -->
  <div id="title-screen" class="overlay">
    <h1>🌟 さんすうクエスト！ 🌟<br>ジャンプアドベンチャー</h1>
    <p>せいかいの すうじブロックを たたくと<br>まほうのカベが ひらいて すすめるよ！</p>
    <button class="btn-start" onclick="startGame()">ぼうけんへ 出発！</button>
  </div>

  <!-- クリア画面 -->
  <div id="clear-screen" class="overlay" style="display: none;">
    <h1 id="clear-title">🎉 パーフェクトクリア！ 🎉</h1>
    <p id="clear-msg">ぜんぶの もんだいに せいかいしたよ！<br>ゴールおめでとう！✨</p>
    <button class="btn-start" onclick="startGame()">もういっかい あそぶ！</button>
  </div>

  <!-- ゲーム画面 -->
  <canvas id="gameCanvas"></canvas>

  <!-- コントローラー -->
  <div class="controller">
    <div class="dpad">
      <div id="btn-left" class="touch-btn">◀</div>
      <div id="btn-right" class="touch-btn">▶</div>
    </div>
    <div class="action-pad">
      <div id="btn-jump" class="touch-btn btn-jump">ジャンプ</div>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }

  // --- サウンドエンジン ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'jump') {
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.14);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
      osc.start(now); osc.stop(now + 0.14);
    } else if (type === 'coin') {
      osc.frequency.setValueAtTime(987.77, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.08);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
      osc.start(now); osc.stop(now + 0.22);
    } else if (type === 'correct') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f;
        g.gain.setValueAtTime(0.25, now + idx * 0.08);
        g.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.2);
      });
    } else if (type === 'gate') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.linearRampToValueAtTime(880, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'miss') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.2);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  }

  // --- ゲームロジック ---
  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');
  let W, H, groundY;

  function resize() {
    W = cvs.width = window.innerWidth;
    H = cvs.height = window.innerHeight;
    groundY = H - Math.min(100, Math.max(70, H * 0.18));
  }
  window.addEventListener('resize', resize);
  resize();

  // マルチタッチ操作管理
  const input = { left: false, right: false };
  function attachTouch(id, onStart, onEnd) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); el.classList.add('active'); onStart(); }, { passive: false });
    el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('active'); onEnd(); }, { passive: false });
    el.addEventListener('touchcancel', (e) => { e.preventDefault(); el.classList.remove('active'); onEnd(); }, { passive: false });
    el.addEventListener('mousedown', () => { el.classList.add('active'); onStart(); });
    el.addEventListener('mouseup', () => { el.classList.remove('active'); onEnd(); });
    el.addEventListener('mouseleave', () => { el.classList.remove('active'); onEnd(); });
  }

  attachTouch('btn-left', () => input.left = true, () => input.left = false);
  attachTouch('btn-right', () => input.right = true, () => input.right = false);
  attachTouch('btn-jump', () => {
    if (player.grounded) { player.vy = -14.5; playSound('jump'); }
  }, () => {});

  // キーボード操作（PCテスト用）
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
    if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && player.grounded) {
      player.vy = -14.5; playSound('jump');
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
  });

  // プレイヤー
  const player = {
    x: 80, y: 0, vx: 0, vy: 0, w: 42, h: 52,
    grounded: false, facing: 1, anim: 0
  };

  let cameraX = 0, score = 0, isPlaying = false;
  let platforms = [], blocks = [], gates = [], coins = [], particles = [], goal = {};
  let totalMissions = 2, solvedMissions = 0;

  function initStage() {
    resize();
    score = 0;
    solvedMissions = 0;
    cameraX = 0;
    player.x = 80; player.y = groundY - 100; player.vx = 0; player.vy = 0;

    // 足場・地面
    platforms = [
      { x: 0, y: groundY, w: 900, h: 120 },
      { x: 1050, y: groundY, w: 950, h: 120 },
      { x: 2150, y: groundY, w: 1000, h: 120 },
      // 浮島足場
      { x: 320, y: groundY - 90, w: 150, h: 25 },
      { x: 1350, y: groundY - 100, w: 160, h: 25 },
      { x: 1620, y: groundY - 130, w: 150, h: 25 }
    ];

    // 算数ハテナブロック（第1問：3+2=5 / 第2問：4+3=7）
    blocks = [
      // 1問目 (x: 520〜680)
      { id: 1, x: 520, y: groundY - 140, w: 48, h: 48, val: 4, isCorrect: false, hit: false, bounce: 0 },
      { id: 1, x: 600, y: groundY - 140, w: 48, h: 48, val: 5, isCorrect: true, hit: false, bounce: 0 },
      { id: 1, x: 680, y: groundY - 140, w: 48, h: 48, val: 6, isCorrect: false, hit: false, bounce: 0 },

      // 2問目 (x: 1720〜1880)
      { id: 2, x: 1720, y: groundY - 150, w: 48, h: 48, val: 6, isCorrect: false, hit: false, bounce: 0 },
      { id: 2, x: 1800, y: groundY - 150, w: 48, h: 48, val: 7, isCorrect: true, hit: false, bounce: 0 },
      { id: 2, x: 1880, y: groundY - 150, w: 48, h: 48, val: 8, isCorrect: false, hit: false, bounce: 0 }
    ];

    // まほうのカベ（正解するまで通れないゲート）
    gates = [
      { id: 1, x: 800, y: groundY - 180, w: 30, h: 180, opened: false, label: "🔒 まほうのカベ" },
      { id: 2, x: 2020, y: groundY - 180, w: 30, h: 180, opened: false, label: "🔒 まほうのカベ" }
    ];

    // コイン
    coins = [
      { x: 180, y: groundY - 45, taken: false },
      { x: 240, y: groundY - 45, taken: false },
      { x: 370, y: groundY - 130, taken: false },
      { x: 1400, y: groundY - 145, taken: false },
      { x: 1680, y: groundY - 175, taken: false }
    ];

    // ゴール
    goal = { x: 2850, y: groundY - 160, w: 70, h: 160, reached: false };
    particles = [];

    updateHUD();
  }

  function updateHUD() {
    let msg = "";
    if (!gates[0].opened) {
      msg = "もんだい①：3 ＋ 2 ＝ ？";
    } else if (!gates.opened) {
      msg = "もんだい②：4 ＋ 3 ＝ ？";
    } else {
      msg = "✨ まほうのかべ クリア！ ゴールへGO！";
    }
    document.getElementById('mission-ui').innerText = msg;
    document.getElementById('score-ui').innerText = `🪙 ${score}`;
  }

  function startGame() {
    initStage();
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('clear-screen').style.display = 'none';
    isPlaying = true;
    requestAnimationFrame(gameLoop);
  }

  function addSparkles(x, y, color) {
    for (let i = 0; i < 16; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 - 3,
        color: color, life: 30, maxLife: 30, size: 5 + Math.random() * 6
      });
    }
  }

  // --- メインループ ---
  function gameLoop() {
    if (!isPlaying) return;

    // 1. 移動・物理
    if (input.left) { player.vx = -5.5; player.facing = -1; }
    else if (input.right) { player.vx = 5.5; player.facing = 1; }
    else { player.vx *= 0.75; }

    player.vy += 0.65;
    player.x += player.vx;
    player.y += player.vy;
    if (Math.abs(player.vx) > 0.5) player.anim += 0.2;

    // 2. 足場・地面の判定
    player.grounded = false;
    platforms.forEach(p => {
      if (player.x + player.w > p.x && player.x < p.x + p.w) {
        if (player.y + player.h >= p.y && player.y + player.h <= p.y + player.vy + 12 && player.vy >= 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.grounded = true;
        }
      }
    });

    // 3. まほうのカベ（ゲート）の衝突判定（開くまで通れない）
    gates.forEach(g => {
      if (!g.opened) {
        if (player.x + player.w > g.x && player.x < g.x + g.w &&
            player.y + player.h > g.y && player.y < g.y + g.h) {
          if (player.vx > 0) player.x = g.x - player.w;
          else if (player.vx < 0) player.x = g.x + g.w;
        }
      }
    });

    // 4. ブロック判定（頭突き）
    blocks.forEach(b => {
      if (player.x + player.w > b.x && player.x < b.x + b.w) {
        // 下から頭突き
        if (player.y <= b.y + b.h && player.y >= b.y + b.h + player.vy - 10 && player.vy < 0) {
          player.y = b.y + b.h;
          player.vy = 2;
          b.bounce = -10;

          if (!b.hit) {
            b.hit = true;
            if (b.isCorrect) {
              playSound('correct');
              score += 100;
              solvedMissions++;
              addSparkles(b.x + 24, b.y, '#ffd700');
              
              // 対応するゲートを開放！
              const targetGate = gates.find(g => g.id === b.id);
              if (targetGate && !targetGate.opened) {
                targetGate.opened = true;
                playSound('gate');
                addSparkles(targetGate.x + 15, targetGate.y + 80, '#00e676');
              }
              updateHUD();
            } else {
              playSound('miss');
              addSparkles(b.x + 24, b.y, '#aaa');
            }
          }
        }
        // 上に乗る
        if (player.y + player.h >= b.y && player.y + player.h <= b.y + player.vy + 10 && player.vy >= 0) {
          player.y = b.y - player.h;
          player.vy = 0;
          player.grounded = true;
        }
      }
      if (b.bounce < 0) b.bounce += 2;
    });

    // 5. コイン
    coins.forEach(c => {
      if (!c.taken && Math.hypot(player.x + 20 - c.x, player.y + 25 - c.y) < 36) {
        c.taken = true;
        score += 10;
        playSound('coin');
        addSparkles(c.x, c.y, '#ffeb3b');
        updateHUD();
      }
    });

    // 落下時の救済
    if (player.y > H + 50) {
      player.x = Math.max(80, player.x - 280);
      player.y = groundY - 200;
      player.vy = 0;
      playSound('miss');
    }

    // 6. ゴール判定＆正確なクリアメッセージ生成
    if (player.x > goal.x && !goal.reached) {
      goal.reached = true;
      playSound('correct');
      setTimeout(() => {
        isPlaying = false;
        showClearScreen();
      }, 500);
    }

    // カメラ追従
    cameraX = player.x - W * 0.35;

    // --- 描画 ---
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(-cameraX, 0);

    // 背景の雲
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for (let i = 0; i < 15; i++) {
      ctx.beginPath();
      ctx.arc(i * 280 + 80, 100 + (i % 3) * 25, 35, 0, Math.PI * 2);
      ctx.arc(i * 280 + 120, 90 + (i % 3) * 25, 50, 0, Math.PI * 2);
      ctx.arc(i * 280 + 160, 100 + (i % 3) * 25, 35, 0, Math.PI * 2);
      ctx.fill();
    }

    // 足場・地面
    platforms.forEach(p => {
      ctx.fillStyle = "#4caf50";
      ctx.fillRect(p.x, p.y, p.w, 14);
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(p.x, p.y + 14, p.w, p.h - 14);
      ctx.strokeStyle = "#6d4c41"; ctx.lineWidth = 2;
      for (let bx = p.x; bx < p.x + p.w; bx += 40) {
        ctx.strokeRect(bx, p.y + 14, 40, 24);
      }
    });

    // まほうのカベ（ゲート）描画
    gates.forEach(g => {
      if (!g.opened) {
        ctx.fillStyle = "rgba(233, 30, 99, 0.85)";
        ctx.fillRect(g.x, g.y, g.w, g.h);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
        ctx.strokeRect(g.x, g.y, g.w, g.h);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🔒", g.x + g.w / 2, g.y + 40);
        ctx.fillText("カ", g.x + g.w / 2, g.y + 70);
        ctx.fillText("ベ", g.x + g.w / 2, g.y + 95);
      } else {
        // 開放時のエフェクト枠
        ctx.strokeStyle = "rgba(76, 175, 80, 0.5)"; ctx.lineWidth = 2;
        ctx.strokeRect(g.x, g.y, g.w, g.h);
        ctx.fillStyle = "#4caf50";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("✨OPEN", g.x + g.w / 2, g.y + 20);
      }
    });

    // コイン
    coins.forEach(c => {
      if (!c.taken) {
        ctx.font = "26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🪙", c.x, c.y);
      }
    });

    // 算数ブロック
    blocks.forEach(b => {
      const drawY = b.y + b.bounce;
      ctx.fillStyle = b.hit ? (b.isCorrect ? "#ffeb3b" : "#9e9e9e") : "#ff9800";
      ctx.fillRect(b.x, drawY, b.w, b.h);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
      ctx.strokeRect(b.x, drawY, b.w, b.h);

      ctx.fillStyle = b.hit && b.isCorrect ? "#d81b60" : "#fff";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(b.val, b.x + b.w / 2, drawY + 33);
    });

    // ゴール（城・フラッグ）
    ctx.font = "75px sans-serif";
    ctx.fillText("🏰", goal.x + 35, goal.y + 110);
    ctx.fillText("🚩", goal.x - 30, goal.y + 50);

    // プレイヤー
    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    if (player.facing === -1) ctx.scale(-1, 1);
    ctx.font = "44px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(player.grounded ? (Math.sin(player.anim) > 0 ? "🏃" : "🚶") : "🦸", 0, 0);
    ctx.restore();

    // パーティクル
    particles.forEach((pt, idx) => {
      pt.x += pt.vx; pt.y += pt.vy;
      pt.life--;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), 0, Math.PI * 2);
      ctx.fill();
      if (pt.life <= 0) particles.splice(idx, 1);
    });

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }

  function showClearScreen() {
    const title = document.getElementById('clear-title');
    const msg = document.getElementById('clear-msg');
    
    if (solvedMissions >= totalMissions) {
      title.innerText = "🎉 パーフェクトクリア！ 🎉";
      msg.innerHTML = `ぜんぶの もんだいに せいかいしたよ！<br>スコア：🪙 ${score} 点<br>すばらしい さんすうマスターだね！✨`;
    } else {
      title.innerText = "ゴールとうちゃく！🏁";
      msg.innerHTML = `ゴールできたね！ スコア：🪙 ${score} 点<br>せいかい数：${solvedMissions} / ${totalMissions} もん<br>こんどは ぜんもん せいかいを めざそう！😊`;
    }
    document.getElementById('clear-screen').style.display = 'flex';
  }
</script>
</body>
</html>
