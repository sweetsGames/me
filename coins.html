<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ガイドラインに基づくPWA・全画面表示のためのviewport設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>コインがったいパズル</title>

<!-- PWA・全画面表示設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コインパズル">

<!-- Service Worker 登録スクリプト -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>

<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * {
    box-sizing: border-box; user-select: none; -webkit-user-select: none;
    margin: 0; padding: 0; touch-action: none;
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
  }
  body {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background-color: #fff3e0; display: flex; flex-direction: column;
  }
  #game-wrapper {
    position: relative; flex: 1; width: 100%; max-width: 500px; margin: 0 auto;
    background: #fff3e0; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column;
  }
  
  /* UI Header */
  #header {
    padding: calc(15px + var(--sat)) 15px 15px 15px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .title-box {
    font-size: clamp(20px, 6vw, 28px); font-weight: bold; color: #e65100;
  }
  .score-box {
    background: #ffe0b2; padding: 8px 15px; border-radius: 12px;
    font-size: clamp(16px, 5vw, 22px); font-weight: bold; color: #d84315;
    border: 3px solid #ffb74d; box-shadow: 0 4px 0 #ff9800;
  }
  
  /* Canvas Area */
  #canvas-container {
    flex: 1; display: flex; justify-content: center; align-items: center;
    padding: 10px; width: 100%;
  }
  canvas {
    max-width: 100%; max-height: 100%; object-fit: contain;
    background: #ffcc80; border-radius: 16px; border: 6px solid #ffa726;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
  }

  /* Popups and Screens */
  .screen {
    position: absolute; inset: 0; background: rgba(255, 243, 224, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  h1 { font-size: clamp(32px, 8vw, 48px); color: #ff9800; margin-bottom: 20px; text-shadow: 2px 2px 0 #fff; text-align: center;}
  .desc { font-size: clamp(16px, 4.5vw, 24px); color: #555; margin-bottom: 30px; font-weight: bold; text-align: center; line-height: 1.6; }
  
  .btn {
    background: #ff9800; border: none; border-bottom: 6px solid #e65100; border-radius: 30px;
    padding: 15px 40px; font-size: clamp(20px, 6vw, 28px); font-weight: bold; color: white;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-top: 10px;
  }
  .btn:active { transform: translateY(6px); border-bottom-width: 0px; margin-bottom: 6px; box-shadow: none; }
  
  #message-popup {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0);
    background: rgba(255, 255, 255, 0.95); border: 5px solid #4caf50; border-radius: 20px;
    padding: 15px 30px; font-size: clamp(24px, 6vw, 32px); font-weight: bold; color: #2e7d32;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 50; text-align: center; pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #message-popup.show { transform: translate(-50%, -50%) scale(1); }

  .hide { display: none !important; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <div class="title-box">コインがったい👛</div>
    <div class="score-box">ごうけい: <span id="score-val">0</span>円</div>
  </div>
  
  <div id="canvas-container">
    <canvas id="c"></canvas>
  </div>
  
  <div id="message-popup">500えん玉<br>できた！🎉</div>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen">
    <h1>コインがったい<br>パズル👛</h1>
    <div class="desc">
      スワイプで おかねを うごかして<br>
      おなじ おかねを くっつけよう！<br>
      <span style="color:#e65100;">1000えんさつ</span> を つくってね！
    </div>
    <button class="btn" onclick="startGame()">あそぶ</button>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameover-screen" class="screen hide">
    <h1 style="color:#f44336;">おしい！</h1>
    <div class="desc">
      おかねがいっぱいで<br>うごかせなくなったよ。<br>
      ごうけい: <span id="final-score" style="color:#e65100; font-size:1.5em;">0</span> 円
    </div>
    <button class="btn" onclick="startGame()">もういっかい</button>
  </div>

  <!-- クリア画面 -->
  <div id="clear-screen" class="screen hide">
    <h1 style="color:#4caf50;">クリア！🎉</h1>
    <div class="desc">
      すごい！<br>1000えんさつ が できたよ！<br>
      おかねの けいさん ばっちりだね！
    </div>
    <button class="btn" onclick="startGame()">さいしょから</button>
    <button class="btn" style="background:#2196f3; border-color:#0d47a1;" onclick="continueGame()">もっと つづける</button>
  </div>
</div>

<script>
// --- Web Audio API (効果音シンセサイザー) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let actx;

function initAudio() {
    if (!actx) actx = new AudioContext();
    if (actx.state === 'suspended') actx.resume();
}

function playSound(type) {
    if (!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    
    if (type === 'slide') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'merge') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'coin') {
        // 新しい硬貨ができた時のチャリン音
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, now); osc.frequency.setValueAtTime(1600, now + 0.05);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'clear') {
        // 1000円達成ファンファーレ
        osc.type = 'square'; [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.15));
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
    } else if (type === 'over') {
        osc.type = 'sawtooth'; [300, 280, 250].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.2));
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
    }
}

// --- Canvas設定 ---
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const GRID_SIZE = 4;
const CELL_SIZE = 90;
const GAP = 12;
c.width = GRID_SIZE * CELL_SIZE + (GRID_SIZE + 1) * GAP;
c.height = c.width; // 正方形

let board = [];
let animData = null; // スワイプ中のアニメーションデータ
let score = 0;
let state = 'title'; // title, playing, animating, gameover
let highestCoin = 1;
let hasCleared = false;

// UI
const UI_SCORE = document.getElementById('score-val');
const MSG_POPUP = document.getElementById('message-popup');

// --- コインの合体ルール（知育要素） ---
// 日本の硬貨の仕組みに合わせて足し算を判定
function canMerge(v1, v2) {
    let sum = v1 + v2;
    // 1円〜4円同士なら、足して5円以下になれば合体OK
    if (v1 < 5 && v2 < 5 && sum <= 5) return sum;
    // 5円玉2枚で10円
    if (v1 === 5 && v2 === 5) return 10;
    // 10円〜40円同士なら、足して50円以下になれば合体OK
    if (v1 >= 10 && v1 < 50 && v1%10===0 && v2 >= 10 && v2 < 50 && v2%10===0 && sum <= 50) return sum;
    // 50円玉2枚で100円
    if (v1 === 50 && v2 === 50) return 100;
    // 100円〜400円同士なら、足して500円以下になれば合体OK
    if (v1 >= 100 && v1 < 500 && v1%100===0 && v2 >= 100 && v2 < 500 && v2%100===0 && sum <= 500) return sum;
    // 500円玉2枚で1000円
    if (v1 === 500 && v2 === 500) return 1000;
    return 0; // 合体不可
}

// --- コインの描画スタイル定義 ---
function drawTile(x, y, val, scale = 1) {
    ctx.save();
    ctx.translate(x + CELL_SIZE/2, y + CELL_SIZE/2);
    ctx.scale(scale, scale);
    ctx.translate(-CELL_SIZE/2, -CELL_SIZE/2);

    const r = CELL_SIZE/2;
    const cx = r, cy = r;

    // スタイル定義
    const styles = {
        1: { bg: '#eceff1', border: '#b0bec5', text: '#546e7a', isCoin: true, name: "1えん玉" },
        2: { bg: '#f5f7f8', border: '#cfd8dc', text: '#78909c' },
        3: { bg: '#f5f7f8', border: '#cfd8dc', text: '#78909c' },
        4: { bg: '#f5f7f8', border: '#cfd8dc', text: '#78909c' },
        5: { bg: '#fff59d', border: '#fbc02d', text: '#f57f17', isCoin: true, hole: true, name: "5えん玉" },
        10: { bg: '#bcaaa4', border: '#795548', text: '#4e342e', isCoin: true, name: "10えん玉" },
        20: { bg: '#d7ccc8', border: '#a1887f', text: '#5d4037' },
        30: { bg: '#d7ccc8', border: '#a1887f', text: '#5d4037' },
        40: { bg: '#d7ccc8', border: '#a1887f', text: '#5d4037' },
        50: { bg: '#e0e0e0', border: '#9e9e9e', text: '#424242', isCoin: true, hole: true, name: "50えん玉" },
        100: { bg: '#f5f5f5', border: '#bdbdbd', text: '#212121', isCoin: true, name: "100えん玉" },
        200: { bg: '#fafafa', border: '#e0e0e0', text: '#616161' },
        300: { bg: '#fafafa', border: '#e0e0e0', text: '#616161' },
        400: { bg: '#fafafa', border: '#e0e0e0', text: '#616161' },
        500: { bg: '#fff9c4', border: '#fbc02d', text: '#f57f17', isCoin: true, name: "500えん玉" },
        1000: { bg: '#c8e6c9', border: '#4caf50', text: '#1b5e20', isCoin: true, bill: true, name: "1000えんさつ" }
    };

    let st = styles[val] || styles[1];

    // ベースの四角形（タイル背景）
    ctx.fillStyle = st.bg;
    ctx.beginPath(); ctx.roundRect(0, 0, CELL_SIZE, CELL_SIZE, 12); ctx.fill();

    if (st.isCoin) {
        if (st.bill) {
            // お札のデザイン (1000円)
            ctx.fillStyle = '#a5d6a7'; ctx.fillRect(8, 20, CELL_SIZE - 16, CELL_SIZE - 40);
            ctx.strokeStyle = st.border; ctx.lineWidth = 3; ctx.strokeRect(8, 20, CELL_SIZE - 16, CELL_SIZE - 40);
        } else {
            // 硬貨の円デザイン
            ctx.fillStyle = st.bg; ctx.beginPath(); ctx.arc(cx, cy, r - 8, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = st.border; ctx.lineWidth = 4; ctx.stroke();
            if (st.hole) {
                // 5円、50円の穴
                ctx.fillStyle = '#ffcc80'; // 盤面の背景色
                ctx.beginPath(); ctx.arc(cx, cy, r * 0.25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            }
        }
    } else {
        // 硬貨になる途中の値（2円など）
        ctx.strokeStyle = st.border; ctx.lineWidth = 3; ctx.stroke();
    }

    // 文字描画
    ctx.fillStyle = st.text;
    ctx.font = `bold ${st.bill ? 22 : 30}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    
    if (st.hole) {
        ctx.fillText(val, cx, cy - r * 0.4);
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("円", cx, cy + r * 0.5);
    } else {
        ctx.fillText(val + (st.bill ? "円" : ""), cx, cy);
    }
    ctx.restore();
}

// --- 盤面とゲームロジック ---
function initBoard() {
    board = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    score = 0; highestCoin = 1; hasCleared = false;
    spawnTile(); spawnTile();
    updateUI();
}

// 進行度に応じて出現するコインを調整（サクサク進むように）
function spawnTile() {
    let empty = [];
    for(let r=0; r<GRID_SIZE; r++) {
        for(let c=0; c<GRID_SIZE; c++) {
            if(board[r][c] === 0) empty.push({r, c});
        }
    }
    if (empty.length === 0) return;
    
    let maxVal = Math.max(...board.flat());
    let pool = [1, 1, 1, 1, 1]; // 基本は1円
    if (maxVal >= 50) pool.push(5, 5);
    if (maxVal >= 100) pool.push(5, 10, 10);
    if (maxVal >= 500) pool.push(10, 50, 50);

    let val = pool[Math.floor(Math.random() * pool.length)];
    let pos = empty[Math.floor(Math.random() * empty.length)];
    board[pos.r][pos.c] = val;
    return pos; // アニメーション用
}

function updateUI() {
    // 盤面上の合計金額をスコアとする
    score = board.flat().reduce((sum, val) => sum + val, 0);
    UI_SCORE.innerText = score;
}

// スワイプ方向に応じた座標変換ヘルパー
function getCoord(r, c, dir) {
    if(dir === 0) return { r: r, c: c };        // 左
    if(dir === 1) return { r: c, c: r };        // 上
    if(dir === 2) return { r: r, c: 3 - c };    // 右
    if(dir === 3) return { r: 3 - c, c: r };    // 下
}

// スライド処理（2048ロジック）
function slide(dir) {
    if (state !== 'playing') return;
    let moved = false;
    let newBoard = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    let animMoves = [];
    let popups = [];

    for (let r = 0; r < GRID_SIZE; r++) {
        let line = [];
        for (let c = 0; c < GRID_SIZE; c++) {
            let p = getCoord(r, c, dir);
            if (board[p.r][p.c] !== 0) line.push({c: c, val: board[p.r][p.c], p: p});
        }

        let newLine = [];
        let cIndex = 0;
        
        while (line.length > 0) {
            if (line.length >= 2) {
                let mergedVal = canMerge(line[0].val, line[1].val);
                if (mergedVal > 0) {
                    newLine.push(mergedVal);
                    let toP = getCoord(r, cIndex, dir);
                    animMoves.push({ from: line[0].p, to: toP, val: line[0].val });
                    animMoves.push({ from: line[1].p, to: toP, val: line[1].val, mergedVal: mergedVal });
                    
                    // 知育ギミック: 新しい本物の硬貨ができた時にお祝い
                    if ([5, 10, 50, 100, 500, 1000].includes(mergedVal) && mergedVal > highestCoin) {
                        highestCoin = mergedVal;
                        popups.push(mergedVal);
                    }
                    line.shift(); line.shift(); moved = true;
                } else {
                    newLine.push(line[0].val);
                    let toP = getCoord(r, cIndex, dir);
                    if (line[0].c !== cIndex) moved = true;
                    animMoves.push({ from: line[0].p, to: toP, val: line[0].val });
                    line.shift();
                }
            } else {
                newLine.push(line[0].val);
                let toP = getCoord(r, cIndex, dir);
                if (line[0].c !== cIndex) moved = true;
                animMoves.push({ from: line[0].p, to: toP, val: line[0].val });
                line.shift();
            }
            cIndex++;
        }
        for (let c = 0; c < newLine.length; c++) {
            let p = getCoord(r, c, dir);
            newBoard[p.r][p.c] = newLine[c];
        }
    }

    if (moved) {
        playSound('slide');
        board = newBoard;
        state = 'animating';
        startAnimation(animMoves, popups);
    }
}

// --- アニメーション・描画 ---
function getPixelPos(r, c) {
    return {
        x: GAP + c * (CELL_SIZE + GAP),
        y: GAP + r * (CELL_SIZE + GAP)
    };
}

function drawGridBg() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#ffe0b2'; // 空のセルの色
    for (let r=0; r<GRID_SIZE; r++) {
        for(let cCol=0; cCol<GRID_SIZE; cCol++) {
            let pos = getPixelPos(r, cCol);
            ctx.beginPath(); ctx.roundRect(pos.x, pos.y, CELL_SIZE, CELL_SIZE, 12); ctx.fill();
        }
    }
}

function renderIdle() {
    drawGridBg();
    for(let r=0; r<GRID_SIZE; r++) {
        for(let cCol=0; cCol<GRID_SIZE; cCol++) {
            if(board[r][cCol] !== 0) {
                let pos = getPixelPos(r, cCol);
                drawTile(pos.x, pos.y, board[r][cCol]);
            }
        }
    }
}

function startAnimation(moves, popups) {
    let startTime = performance.now();
    let duration = 150; // スライド時間(ms)

    function animStep(now) {
        let p = (now - startTime) / duration;
        if (p > 1) p = 1;
        
        drawGridBg();
        let mergesToDraw = [];

        // 移動中のタイルを描画
        for (let m of moves) {
            let fromPos = getPixelPos(m.from.r, m.from.c);
            let toPos = getPixelPos(m.to.r, m.to.c);
            let curX = fromPos.x + (toPos.x - fromPos.x) * p;
            let curY = fromPos.y + (toPos.y - fromPos.y) * p;
            
            if (m.mergedVal && p === 1) {
                mergesToDraw.push({x: curX, y: curY, val: m.mergedVal});
            } else {
                drawTile(curX, curY, m.val);
            }
        }

        if (p < 1) {
            requestAnimationFrame(animStep);
        } else {
            // スライド完了後
            let newTilePos = spawnTile();
            updateUI();
            
            // 合体完了時のポップ演出を描画（少しだけ待つ）
            drawGridBg();
            for(let r=0; r<GRID_SIZE; r++) {
                for(let cCol=0; cCol<GRID_SIZE; cCol++) {
                    if(board[r][cCol] !== 0) {
                        let pos = getPixelPos(r, cCol);
                        let isMerged = mergesToDraw.some(md => md.x === pos.x && md.y === pos.y);
                        let isNew = newTilePos && newTilePos.r === r && newTilePos.c === cCol;
                        
                        if (isMerged) {
                            drawTile(pos.x, pos.y, board[r][cCol], 1.15); // ちょっと大きく
                            playSound('merge');
                        } else if (isNew) {
                            drawTile(pos.x, pos.y, board[r][cCol], 0.5); // 小さく出現
                        } else {
                            drawTile(pos.x, pos.y, board[r][cCol]);
                        }
                    }
                }
            }

            // 新しい硬貨のお祝いメッセージ
            if (popups.length > 0) {
                let coinName = popups[0] + "えん";
                if (popups[0] === 1000) coinName = "1000えんさつ";
                else coinName += "玉";
                
                MSG_POPUP.innerHTML = `${coinName}<br>できた！🎉`;
                MSG_POPUP.classList.add('show');
                playSound(popups[0] === 1000 ? 'clear' : 'coin');
                setTimeout(() => MSG_POPUP.classList.remove('show'), 1500);
            }

            // 少し待ってから通常描画に戻す
            setTimeout(() => {
                state = 'playing';
                renderIdle();
                checkGameOver();
            }, 80);
        }
    }
    requestAnimationFrame(animStep);
}

// ゲームオーバー判定
function checkGameOver() {
    if (highestCoin >= 1000 && !hasCleared) {
        hasCleared = true;
        state = 'gameover'; // 一時停止
        setTimeout(() => document.getElementById('clear-screen').classList.remove('hide'), 1000);
        return;
    }

    // 空きがあるか
    let hasEmpty = board.flat().includes(0);
    if (hasEmpty) return;

    // 隣り合って合体できるものがあるか
    for (let r=0; r<GRID_SIZE; r++) {
        for (let c=0; c<GRID_SIZE; c++) {
            let v = board[r][c];
            if (r < GRID_SIZE-1 && canMerge(v, board[r+1][c]) > 0) return;
            if (c < GRID_SIZE-1 && canMerge(v, board[r][c+1]) > 0) return;
        }
    }

    // 動かせない
    state = 'gameover';
    document.getElementById('final-score').innerText = score;
    setTimeout(() => {
        playSound('over');
        document.getElementById('gameover-screen').classList.remove('hide');
    }, 500);
}

// --- ゲーム制御 ---
function startGame() {
    initAudio();
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hide'));
    state = 'playing';
    initBoard();
    renderIdle();
}
