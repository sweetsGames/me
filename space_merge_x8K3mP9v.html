<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>宇宙の星マージパズル</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { overscroll-behavior: none; touch-action: none; background: #0f172a; margin: 0; padding: 0; color: white; font-family: 'Rounded M+ 1c', sans-serif; }
  body { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 450px; height: 100%; max-height: 850px;
    background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }

  /* 星空背景 */
  .stars { position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)); background-size: 200px 200px; animation: twinkle 5s infinite linear; z-index: 0; pointer-events: none; opacity: 0.5; }
  @keyframes twinkle { 0% { transform: translateY(0); } 100% { transform: translateY(-200px); } }

  #header { padding: max(15px, var(--sat)) 15px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 2px dashed rgba(255,255,255,0.2); }
  .score-box { font-size: 24px; font-weight: 900; color: #f1c40f; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  
  /* フィールド（盤面） */
  #board-container { flex: 1; padding: 15px; display: flex; justify-content: center; align-items: center; z-index: 10; }
  #board { 
    display: grid; 
    grid-template-columns: repeat(5, 1fr); 
    grid-template-rows: repeat(6, 1fr); 
    gap: 8px; 
    width: 100%; 
    max-width: 380px; 
    aspect-ratio: 5 / 6; 
    background: rgba(255, 255, 255, 0.05); 
    border-radius: 15px; 
    padding: 10px; 
    position: relative;
  }
  
  .cell { background: rgba(255, 255, 255, 0.1); border-radius: 12px; position: relative; }
  
  .item { 
    position: absolute; inset: 2px; background: rgba(0,0,0,0.3); border-radius: 50%; 
    display: flex; justify-content: center; align-items: center; font-size: 32px; 
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.4), 0 3px 5px rgba(0,0,0,0.3); 
    cursor: grab; user-select: none; transition: transform 0.1s; z-index: 20;
  }
  .item:active { cursor: grabbing; z-index: 100; transform: scale(1.1); box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
  .item.merging { animation: pop 0.3s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* 下部の生成ボタン */
  #footer { padding: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
  .generate-btn { 
    padding: 20px; font-size: 20px; font-weight: bold; color: white; 
    background: #3498db; border: none; border-radius: 15px; 
    box-shadow: 0 6px 0 #2980b9; cursor: pointer; transition: 0.1s; 
    display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .generate-btn:active { transform: translateY(6px); box-shadow: none; }
  .generate-btn:disabled { background: #7f8c8d; box-shadow: 0 6px 0 #34495e; opacity: 0.7; cursor: not-allowed; }

  /* オーバーレイ画面 */
  .overlay {
    position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .title { font-size: 32px; color: #f1c40f; font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px 0 #d35400; text-align: center; line-height: 1.4; }
  .btn { padding: 15px 40px; font-size: 22px; font-weight: bold; color: white; background: #e67e22; border: none; border-radius: 30px; box-shadow: 0 6px 0 #d35400; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div class="stars"></div>
  <div id="header">
    <div class="score-box">SCORE: <span id="ui-score">0</span></div>
  </div>
  
  <div id="board-container">
    <div id="board">
      <!-- セルはJSで生成 -->
    </div>
  </div>

  <div id="footer">
    <button class="generate-btn" id="gen-btn" onclick="generateItem()">
      <span>星をみつける</span> <span style="font-size:28px;">🪨</span>
    </button>
  </div>

  <div id="start-screen" class="overlay show">
    <div class="title">🌌 宇宙の星<br>マージパズル</div>
    <div style="background:rgba(255,255,255,0.1); padding:20px; border-radius:15px; text-align:left; font-size:15px; line-height:1.6; width:80%;">
      同じ星を指でドラッグして<br>重ねてみよう！<br><br>
      <b>【大きさの順番】</b><br>
      🪨 隕石<br>
      🌙 月<br>
      🌑 水星<br>
      🔴 火星<br>
      🌍 地球 ... 最後に待つのは？
    </div>
    <button class="btn" onclick="startGame()">スタート！</button>
  </div>

  <div id="game-over" class="overlay">
    <h1 style="color:#e74c3c; font-size:40px; margin-bottom:10px;">宇宙がいっぱい！</h1>
    <div class="score-box" style="margin-bottom: 20px;">SCORE: <span id="result-score">0</span></div>
    <button class="btn" onclick="resetGame()">もういっかい</button>
  </div>
</div>

<script>
// --- 音声エンジン ---
let actx;
function initAudio() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); }
function playSound(type) {
  if (!actx) return;
  const t = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  if (type === 'merge') { 
    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t); osc.frequency.setValueAtTime(800, t+0.05); osc.frequency.setValueAtTime(1200, t+0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  } else if (type === 'pop') { 
    osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  } else if (type === 'error') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  }
}

// --- 進化レベル定義 ---
const LEVELS = [
  { icon: '🪨', color: '#7f8c8d', bg: 'linear-gradient(135deg, #bdc3c7, #7f8c8d)' },
  { icon: '🌙', color: '#f1c40f', bg: 'linear-gradient(135deg, #f1c40f, #f39c12)' },
  { icon: '🌑', color: '#95a5a6', bg: 'linear-gradient(135deg, #95a5a6, #34495e)' },
  { icon: '🔴', color: '#e74c3c', bg: 'linear-gradient(135deg, #e74c3c, #c0392b)' },
  { icon: '🌍', color: '#3498db', bg: 'linear-gradient(135deg, #3498db, #2980b9)' },
  { icon: '🔵', color: '#2980b9', bg: 'linear-gradient(135deg, #5dade2, #21618c)' },
  { icon: '🪐', color: '#e67e22', bg: 'linear-gradient(135deg, #e67e22, #d35400)' },
  { icon: '🟠', color: '#d35400', bg: 'linear-gradient(135deg, #d35400, #a04000)' },
  { icon: '☀️', color: '#f39c12', bg: 'linear-gradient(135deg, #f1c40f, #e67e22)' },
  { icon: '🌌', color: '#8e44ad', bg: 'linear-gradient(135deg, #9b59b6, #8e44ad)' },
  { icon: '🎆', color: '#9b59b6', bg: 'linear-gradient(135deg, #e056fd, #be2edd)' }
];

const COLS = 5;
const ROWS = 6;
let grid = []; // 盤面データ: null または level(0-10)
let score = 0;
const boardEl = document.getElementById('board');
const genBtn = document.getElementById('gen-btn');

// 盤面初期化
function initBoard() {
  grid = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  renderBoard();
}

// 盤面の描画
function renderBoard() {
  boardEl.innerHTML = '';
  let emptyCells = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cellEl = document.createElement('div');
      cellEl.className = 'cell';
      cellEl.dataset.r = r;
      cellEl.dataset.c = c;
      
      const level = grid[r][c];
      if (level !== null) {
        const itemEl = document.createElement('div');
        itemEl.className = 'item';
        itemEl.innerText = LEVELS[level].icon;
        itemEl.style.background = LEVELS[level].bg;
        // フォントサイズをレベルに応じて少し大きくする
        itemEl.style.fontSize = `${24 + level * 2}px`;
        itemEl.dataset.r = r;
        itemEl.dataset.c = c;
        itemEl.dataset.level = level;
        
        // ドラッグイベントの設定
        setupDrag(itemEl, r, c);
        
        cellEl.appendChild(itemEl);
      } else {
        emptyCells++;
      }
      boardEl.appendChild(cellEl);
    }
  }
  
  // 空きがない場合は生成ボタンを無効化し、ゲームオーバー判定
  genBtn.disabled = (emptyCells === 0);
  if (emptyCells === 0 && !canMergeAny()) {
    setTimeout(() => {
      document.getElementById('result-score').innerText = score;
      document.getElementById('game-over').classList.add('show');
    }, 500);
  }
}

// 動かせる組み合わせが残っているかチェック
function canMergeAny() {
  for(let r=0; r<ROWS; r++){
    for(let c=0; c<COLS; c++){
      if(grid[r][c] === null) return true;
      let lvl = grid[r][c];
      if(r>0 && grid[r-1][c] === lvl) return true;
      if(c>0 && grid[r][c-1] === lvl) return true;
      if(r<ROWS-1 && grid[r+1][c] === lvl) return true;
      if(c<COLS-1 && grid[r][c+1] === lvl) return true;
    }
  }
  return false;
}

// アイテム生成ボタン処理
function generateItem() {
  initAudio();
  let emptySpots = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] === null) emptySpots.push({r, c});
    }
  }
  if (emptySpots.length === 0) return;
  
  // ランダムな空きマスにレベル0（または稀に1）を生成
  const spot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
  const spawnLevel = (Math.random() > 0.8) ? 1 : 0; 
  grid[spot.r][spot.c] = spawnLevel;
  playSound('pop');
  renderBoard();
}

function startGame() {
  initAudio();
  document.getElementById('start-screen').classList.remove('show');
  resetGame();
}

function resetGame() {
  score = 0;
  document.getElementById('ui-score').innerText = score;
  document.getElementById('game-over').classList.remove('show');
  initBoard();
  // 最初は3つほど配置しておく
  for(let i=0; i<3; i++) generateItem();
}

// --- ドラッグ＆ドロップ処理 ---
let draggedItem = null;
let startR, startC;

function setupDrag(itemEl, r, c) {
  itemEl.addEventListener('pointerdown', (e) => {
    initAudio();
    draggedItem = itemEl;
    startR = r;
    startC = c;
    itemEl.style.zIndex = 100;
    
    // カーソルに追従させるための初期設定
    const rect = itemEl.getBoundingClientRect();
    const shiftX = e.clientX - rect.left;
    const shiftY = e.clientY - rect.top;
    
    function onPointerMove(e) {
      if (!draggedItem) return;
      // 画面に対する絶対座標で移動させる
      const boardRect = boardEl.getBoundingClientRect();
      const x = e.clientX - boardRect.left - shiftX;
      const y = e.clientY - boardRect.top - shiftY;
      itemEl.style.left = `${x}px`;
      itemEl.style.top = `${y}px`;
      itemEl.style.transform = 'scale(1.1)';
    }
    
    function onPointerUp(e) {
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      
      if (!draggedItem) return;
      
      // ドロップした位置の下にあるセルを特定する
      itemEl.style.display = 'none'; // 一瞬消して下の要素を取得
      const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
      itemEl.style.display = 'flex';
      
      let targetCell = elemBelow ? elemBelow.closest('.cell') : null;
      let merged = false;
      
      if (targetCell) {
        const targetR = parseInt(targetCell.dataset.r);
        const targetC = parseInt(targetCell.dataset.c);
        
        if (targetR !== startR || targetC !== startC) {
          const targetLevel = grid[targetR][targetC];
          const myLevel = grid[startR][startC];
          
          if (targetLevel === null) {
            // 空きマスへの移動
            grid[targetR][targetC] = myLevel;
            grid[startR][startC] = null;
            playSound('pop');
          } else if (targetLevel === myLevel) {
            // 同じレベルならマージ（進化）！
            if (myLevel < LEVELS.length - 1) {
              grid[targetR][targetC] = myLevel + 1;
              grid[startR][startC] = null;
              score += (myLevel + 1) * 10;
              document.getElementById('ui-score').innerText = score;
              playSound('merge');
              merged = true;
            } else {
              playSound('error'); // 最大レベル同士
            }
          } else {
            // 違うレベルなら場所を入れ替え（スワップ）
            grid[targetR][targetC] = myLevel;
            grid[startR][startC] = targetLevel;
            playSound('pop');
          }
        }
      }
      
      draggedItem = null;
      renderBoard();
      
      // マージされた場合はアニメーション用のクラスをつける
      if (merged) {
        const newCell = boardEl.children[targetR * COLS + targetC].firstChild;
        if(newCell) newCell.classList.add('merging');
      }
    }
    
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    
    // デフォルトのドラッグ動作を無効化
    itemEl.ondragstart = function() { return false; };
  });
}
</script>
</body>
</html>
