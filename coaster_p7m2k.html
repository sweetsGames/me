<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>算数コースター</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif; }
  body { position: fixed; inset: 0; width: 100%; height: 100%; background-color: #e0f7fa; display: flex; flex-direction: column; overflow: hidden; }
  
  #game-wrapper { position: relative; flex: 1; width: 100%; max-width: 600px; margin: 0 auto; background: #b2ebf2; display: flex; flex-direction: column; }
  
  #header { padding: max(10px, var(--sat)) 10px 10px; display: flex; justify-content: space-between; align-items: center; background: #00bcd4; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
  .status-box { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 5px; }
  .highlight-num { background: #ffeb3b; color: #e65100; padding: 2px 10px; border-radius: 10px; font-size: 20px; }

  canvas { display: block; flex: 1; width: 100%; height: 100%; }

  .screen { position: absolute; inset: 0; background: rgba(224, 247, 250, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
  h1 { font-size: clamp(24px, 6vw, 34px); color: #00838f; margin-bottom: 10px; text-shadow: 2px 2px 0 #80deea; text-align: center; line-height: 1.3;}
  
  .settings-box { background: #fff; border-radius: 15px; padding: 15px; width: 95%; max-width: 400px; margin-bottom: 20px; border: 3px solid #26c6da; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .rule-box { background: #fffde7; padding: 8px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; color: #555; border: 2px dashed #ffb74d; }
  .rule-step { margin-bottom: 4px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
  
  .opt-btn { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; border: 2px solid #aaa; border-radius: 8px; background: #fff; color: #555; cursor: pointer; text-align: center; margin-bottom: 6px; }
  .opt-btn.active { background: #00bcd4; color: white; border-color: #00838f; }

  .start-btn { padding: 12px 40px; font-size: 22px; font-weight: bold; color: white; background: #ff9800; border: none; border-radius: 30px; box-shadow: 0 5px 0 #f57c00; }
  .start-btn:active { transform: translateY(5px); box-shadow: none; }

  #ui-overlay { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; pointer-events: none; }
  .action-btn { pointer-events: auto; padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; border: none; color: white; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
  #btn-play { background: #4caf50; } #btn-stop { background: #f44336; display: none; }
  .action-btn:active { transform: translateY(6px); box-shadow: none; }

  #message { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: clamp(24px, 6vw, 36px); font-weight: bold; text-align: center; width: 90%; text-shadow: 3px 3px 0 #fff; z-index: 50; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: pre-wrap; line-height: 1.3; pointer-events: none;}
  #message.show { transform: translate(-50%, -50%) scale(1); }
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <div class="status-box">🏁 ゴール: <span id="ui-target" class="highlight-num">0</span></div>
    <div class="status-box">いま: <span id="ui-current" class="highlight-num">0</span></div>
  </div>
  
  <canvas id="c"></canvas>
  
  <div id="ui-overlay">
    <button id="btn-play" class="action-btn" onclick="startRoll()">▶️ ころがす！</button>
    <button id="btn-stop" class="action-btn" onclick="stopRoll()">⏹ やりなおす</button>
  </div>

  <div id="message"></div>

  <div id="start-screen" class="screen">
    <h1>🎢 算数コースター<br>＆ プログラミング</h1>
    
    <div class="settings-box">
      <div class="rule-box">
        <div class="rule-step"><span>1️⃣</span> <span>「➡️やじるし」を置いて道を作ろう！</span></div>
        <div class="rule-step"><span>2️⃣</span> <span>「ゲート」を通って数を変えよう！</span></div>
        <div class="rule-step"><span>3️⃣</span> <span>ダミーや🪨岩をよけて、ピッタリでゴール！</span></div>
      </div>

      <div style="font-weight:bold; color:#555; margin-bottom:10px; text-align:center;">あそぶレベルをえらぶ</div>
      <button class="opt-btn active" onclick="selDiff(0)">かんたん (たし算のみ)</button>
      <button class="opt-btn" onclick="selDiff(1)">ふつう (＋・－ ＆ 🪨おじゃま岩)</button>
      <button class="opt-btn" onclick="selDiff(2)">むずかしい (＋・－・× ＆ ダミーゲート)</button>
      <button class="opt-btn" onclick="selDiff(3)">超むずかしい (÷も登場！小数に注意！)</button>
    </div>
    <button class="start-btn" onclick="startGame()">あそぶ！</button>
  </div>
</div>

<script>
document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

let actx;
function initAudio() { if (!actx) { actx = new AudioContext(); if (actx.state === 'suspended') actx.resume(); } }
function playSound(type) {
    if (!actx) return;
    const now = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    if (type === 'snap') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'pass') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(1046, now); osc.frequency.setValueAtTime(1318, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'clear') {
        osc.type = 'sine'; [1046, 1318, 1567, 2093].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.1));
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.6); osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'crash') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
    }
}

let diffSelected = 0;
function selDiff(val) { diffSelected = val; document.querySelectorAll('.opt-btn').forEach((b, i) => b.classList.toggle('active', i === val)); }

const c = document.getElementById('c'); const ctx = c.getContext('2d');
let W, H, CS; 
function resize() { 
    W = c.width = c.clientWidth; H = c.height = c.clientHeight; 
    let availableH = H - 200; 
    CS = Math.min(W * 0.18, availableH / 5.5); 
}
window.addEventListener('resize', resize); resize();

const GRID_W = 5, GRID_H = 5;
let grid = Array(GRID_H).fill(null).map(() => Array(GRID_W).fill(null)); 
let arrows = [ {dir:'R', e:'➡️'}, {dir:'D', e:'⬇️'}, {dir:'L', e:'⬅️'}, {dir:'U', e:'⬆️'} ];
let draggingItem = null;

let isPlaying = false;
let ball = { x: 0, y: 0, val: 0, dir: 'R', px: 0, py: 0 }; 
let animProgress = 0;
let levelData = { target: 0, startVal: 0 };

function initLevel() {
    grid = Array(GRID_H).fill(null).map(() => Array(GRID_W).fill(null));
    
    let path, straightIndices;
    // レベルが上がるにつれて通るゲートの数を増やす
    let numGates = diffSelected === 0 ? 2 : (diffSelected === 1 ? 3 : 4);

    while(true) {
        path = [{x:0, y:0}, {x:1, y:0}]; // 常に初手は右へ
        let cx = 1, cy = 0;
        
        while(cx < GRID_W-1 || cy < GRID_H-1) {
            let moves = [];
            if(cx < GRID_W-1) moves.push({x:cx+1, y:cy});
            if(cy < GRID_H-1) moves.push({x:cx, y:cy+1});
            let next = moves[Math.floor(Math.random()*moves.length)];
            cx = next.x; cy = next.y;
            path.push({x:cx, y:cy});
        }
        
        straightIndices = [];
        for(let i=1; i<path.length-1; i++) {
            let dx1 = path[i].x - path[i-1].x;
            let dy1 = path[i].y - path[i-1].y;
            let dx2 = path[i+1].x - path[i].x;
            let dy2 = path[i+1].y - path[i].y;
            if (dx1 === dx2 && dy1 === dy2) {
                straightIndices.push(i);
            }
        }
        if (straightIndices.length >= numGates) break;
    }

    straightIndices.sort(() => Math.random() - 0.5);
    let gateIndices = straightIndices.slice(0, numGates).sort((a,b)=>a-b);

    // ★修正：スタートは常に「0」から！
    levelData.startVal = 0;
    let currentVal = levelData.startVal;

    for(let idx of gateIndices) {
        let pos = path[idx];
        let opType = '+';
        if(diffSelected === 1) opType = Math.random()>0.3 ? '+' : '-';
        if(diffSelected === 2) {
            let r = Math.random();
            if(r < 0.35) opType = '+'; else if(r < 0.65) opType = '-'; else opType = '×';
        }
        if(diffSelected === 3) {
            let r = Math.random();
            if(r < 0.25) opType = '+'; else if(r < 0.5) opType = '-'; else if(r < 0.75) opType = '×'; else opType = '÷';
        }

        let val = 0;
        if(opType === '+') { val = Math.floor(Math.random()*5)+1; currentVal += val; }
        if(opType === '-') {
            val = Math.floor(Math.random()*4)+1;
            if(currentVal - val < 0) { opType = '+'; currentVal += val; } 
            else { currentVal -= val; }
        }
        if(opType === '×') { val = Math.floor(Math.random()*3)+2; currentVal *= val; }
        if(opType === '÷') { val = Math.floor(Math.random()*3)+2; currentVal /= val; }

        // ★修正：小数点は第1位までに丸める
        currentVal = Math.round(currentVal * 10) / 10;
        grid[pos.y][pos.x] = { type: 'gate', op: opType, val: val };
    }
    levelData.target = currentVal;

    // ★修正：むずかしい以上では「ダミーゲート（不正解の罠）」を配置する
    if(diffSelected >= 2) {
        let numDummies = diffSelected === 2 ? 1 : 2; // 超むずかしいは罠が2つ
        let placedDummies = 0, attempts = 0;
        while(placedDummies < numDummies && attempts < 100) {
            attempts++;
            let rx = Math.floor(Math.random()*GRID_W);
            let ry = Math.floor(Math.random()*GRID_H);
            let inPath = path.some(p => p.x === rx && p.y === ry);
            // 正解ルート外の空き地に置く
            if(!inPath && !grid[ry][rx] && (rx!==0 || ry!==0) && (rx!==GRID_W-1 || ry!==GRID_H-1)) {
                let op = diffSelected === 2 ? ['+', '-', '×'][Math.floor(Math.random()*3)] : ['+', '-', '×', '÷'][Math.floor(Math.random()*4)];
                let val = Math.floor(Math.random()*4)+1;
                grid[ry][rx] = { type: 'gate', op: op, val: val };
                placedDummies++;
            }
        }
    }

    // 障害物（岩）の配置
    let numObs = diffSelected === 0 ? 0 : (diffSelected === 1 ? 2 : 3);
    let placedObs = 0, attempts = 0;
    while(placedObs < numObs && attempts < 100) {
        attempts++;
        let rx = Math.floor(Math.random()*GRID_W);
        let ry = Math.floor(Math.random()*GRID_H);
        let inPath = path.some(p => p.x === rx && p.y === ry);
        if(!inPath && !grid[ry][rx] && (rx!==0 || ry!==0) && (rx!==GRID_W-1 || ry!==GRID_H-1)) {
            grid[ry][rx] = { type: 'obstacle' };
            placedObs++;
        }
    }

    document.getElementById('ui-target').innerText = levelData.target;
    stopRoll();
}

function getMetrics() {
    let gx = (W - CS * GRID_W) / 2;
    let gy = Math.max(10, H * 0.1); 
    let trayY = gy + CS * GRID_H + 30; 
    return { gx, gy, trayY };
}

let dragOffsetX = 0, dragOffsetY = 0;

c.addEventListener('pointerdown', (e) => {
    e.preventDefault(); initAudio();
    if (isPlaying) return;
    let rect = c.getBoundingClientRect(); let tx = e.clientX - rect.left; let ty = e.clientY - rect.top;
    let m = getMetrics();

    if (tx >= m.gx && tx <= m.gx + CS*GRID_W && ty >= m.gy && ty <= m.gy + CS*GRID_H) {
        let cx = Math.floor((tx - m.gx) / CS); let cy = Math.floor((ty - m.gy) / CS);
        if (grid[cy][cx] && grid[cy][cx].type === 'arrow') {
            grid[cy][cx] = null; 
            playSound('snap'); return;
        }
    }

    let arrowSpacing = W / 4;
    for (let i = 0; i < 4; i++) {
        let ax = arrowSpacing * (i + 0.5); 
        let ay = m.trayY + 45; 
        if (Math.hypot(tx - ax, ty - ay) < CS/2 + 15) {
            draggingItem = { type: 'arrow', dir: arrows[i].dir, e: arrows[i].e, x: tx, y: ty };
            return;
        }
    }
});

c.addEventListener('pointermove', (e) => {
    e.preventDefault();
    if (draggingItem) {
        let rect = c.getBoundingClientRect();
        draggingItem.x = e.clientX - rect.left; draggingItem.y = e.clientY - rect.top;
    }
});

c.addEventListener('pointerup', (e) => {
    e.preventDefault();
    if (!draggingItem) return;
    let m = getMetrics(); let tx = draggingItem.x; let ty = draggingItem.y;
    
    if (tx >= m.gx && tx <= m.gx + CS*GRID_W && ty >= m.gy && ty <= m.gy + CS*GRID_H) {
        let cx = Math.floor((tx - m.gx) / CS); let cy = Math.floor((ty - m.gy) / CS);
        if ((cx!==0 || cy!==0) && (cx!==GRID_W-1 || cy!==GRID_H-1) && !grid[cy][cx]) {
            grid[cy][cx] = draggingItem;
            playSound('snap');
        }
    }
    draggingItem = null;
});
c.addEventListener('pointercancel', () => draggingItem = null);

function startRoll() {
    initAudio(); isPlaying = true;
    document.getElementById('btn-play').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    ball = { x: 0, y: 0, val: levelData.startVal, dir: 'R', px: 0, py: 0 };
    document.getElementById('ui-current').innerText = ball.val;
    animProgress = 0; stepBall();
}

function stopRoll() {
    isPlaying = false;
    document.getElementById('btn-play').style.display = 'block';
    document.getElementById('btn-stop').style.display = 'none';
    ball = { x: 0, y: 0, val: levelData.startVal, dir: 'R', px: 0, py: 0 };
    document.getElementById('ui-current').innerText = ball.val;
}

function showMsg(txt, color) {
    let m = document.getElementById('message');
    m.innerText = txt; m.style.color = color;
    m.classList.add('show'); setTimeout(() => m.classList.remove('show'), 2000);
}

function stepBall() {
    if (!isPlaying) return;
    let nextX = ball.x; let nextY = ball.y;
    if (ball.dir === 'R') nextX++; else if (ball.dir === 'L') nextX--;
    else if (ball.dir === 'D') nextY++; else if (ball.dir === 'U') nextY--;

    if (nextX < 0 || nextX >= GRID_W || nextY < 0 || nextY >= GRID_H) {
        playSound('crash'); showMsg("コースアウト！💥\nやりなおそう", "#f44336");
        setTimeout(stopRoll, 1500); return;
    }

    ball.px = ball.x; ball.py = ball.y;
    ball.x = nextX; ball.y = nextY;
    animProgress = 0;

    function animate() {
        if (!isPlaying) return;
        animProgress += 0.04; 
        if (animProgress >= 1) { animProgress = 1; processCellEnter(); } 
        else { requestAnimationFrame(animate); }
    }
    requestAnimationFrame(animate);
}

function processCellEnter() {
    let item = grid[ball.y][ball.x];
    if (item && item.type === 'arrow') { ball.dir = item.dir; playSound('snap'); } 
    else if (item && item.type === 'gate') {
        if (item.op === '+') ball.val += item.val;
        if (item.op === '-') ball.val -= item.val;
        if (item.op === '×') ball.val *= item.val;
        if (item.op === '÷') ball.val /= item.val;
        
        // ★修正：通るたびに小数は第1位までに丸める
        ball.val = Math.round(ball.val * 10) / 10; 
        
        playSound('pass'); document.getElementById('ui-current').innerText = ball.val;
    }
    else if (item && item.type === 'obstacle') {
        playSound('crash'); showMsg("ガシャン！🪨\n岩にぶつかった！", "#616161");
        setTimeout(stopRoll, 1500); return;
    }

    if (ball.x === GRID_W - 1 && ball.y === GRID_H - 1) {
        if (ball.val === levelData.target) {
            playSound('clear'); showMsg("ピッタリ！🎉\nだいせいこう！", "#4caf50");
            setTimeout(() => { startGame(); }, 3000); 
        } else {
            playSound('crash'); 
            // 差分も小数第1位で丸めて表示
            let diff = Math.round(Math.abs(levelData.target - ball.val) * 10) / 10;
            showMsg(`おしい！💦\nあと ${diff}たりない`, "#f44336");
            setTimeout(stopRoll, 2000);
        }
        return;
    }
    setTimeout(stepBall, 150);
}

function drawBlock(cx, cy, color, text, subtext) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(cx - CS/2 + 2, cy - CS/2 + 2, CS - 4, CS - 4, 8); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.stroke();
    
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `bold ${CS*0.45}px sans-serif`;
    ctx.fillText(text, cx, subtext ? cy - CS*0.1 : cy);
    if (subtext) { ctx.font = `bold ${CS*0.25}px sans-serif`; ctx.fillText(subtext, cx, cy + CS*0.28); }
}

function update() {
    ctx.clearRect(0, 0, W, H);
    let m = getMetrics();

    ctx.fillStyle = "#ffffff"; ctx.fillRect(m.gx, m.gy, CS*GRID_W, CS*GRID_H);
    ctx.lineWidth = 2; ctx.strokeStyle = "#e0f7fa";
    for(let i=0; i<=GRID_W; i++) {
        ctx.beginPath(); ctx.moveTo(m.gx + i*CS, m.gy); ctx.lineTo(m.gx + i*CS, m.gy + CS*GRID_H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(m.gx, m.gy + i*CS); ctx.lineTo(m.gx + CS*GRID_W, m.gy + i*CS); ctx.stroke();
    }

    ctx.fillStyle = "#81c784"; ctx.fillRect(m.gx, m.gy, CS, CS);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `bold ${CS*0.25}px sans-serif`; ctx.fillText("スタート", m.gx+CS/2, m.gy+CS*0.25);
    ctx.font = `${CS*0.4}px sans-serif`; ctx.fillText("➡️", m.gx+CS/2, m.gy+CS*0.65);

    ctx.fillStyle = "#ffb74d"; ctx.fillRect(m.gx + CS*(GRID_W-1), m.gy + CS*(GRID_H-1), CS, CS);
    ctx.fillStyle = "#fff"; ctx.font = `bold ${CS*0.25}px sans-serif`; ctx.fillText("ゴール", m.gx + CS*(GRID_W-1) + CS/2, m.gy + CS*(GRID_H-1) + CS*0.25);
    ctx.font = `${CS*0.45}px sans-serif`; ctx.fillText("👑", m.gx + CS*(GRID_W-1) + CS/2, m.gy + CS*(GRID_H-1) + CS*0.65);

    for(let y=0; y<GRID_H; y++) {
        for(let x=0; x<GRID_W; x++) {
            let item = grid[y][x];
            if (item) {
                let cx = m.gx + x*CS + CS/2; let cy = m.gy + y*CS + CS/2;
                if (item.type === 'arrow') drawBlock(cx, cy, "#2196f3", item.e);
                else if (item.type === 'gate') drawBlock(cx, cy, "#ff9800", item.op + item.val, "ゲート");
                else if (item.type === 'obstacle') drawBlock(cx, cy, "#757575", "🪨"); 
            }
        }
    }

    if (isPlaying) {
        let curX = ball.px + (ball.x - ball.px) * animProgress;
        let curY = ball.py + (ball.y - ball.py) * animProgress;
        let bx = m.gx + curX*CS + CS/2; let by = m.gy + curY*CS + CS/2;
        ctx.fillStyle = "#e91e63"; ctx.beginPath(); ctx.arc(bx, by, CS*0.35, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
        
        // ★修正：小数が表示されてもはみ出ないようにフォントサイズを自動調整
        let valStr = ball.val.toString();
        let fontSize = CS * 0.35;
        if (valStr.length > 3) fontSize = CS * 0.22;
        else if (valStr.length > 2) fontSize = CS * 0.28;
        
        ctx.fillStyle = "#fff"; ctx.font = `bold ${fontSize}px sans-serif`; 
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(valStr, bx, by);
    }

    if (!isPlaying) {
        ctx.fillStyle = "#00838f"; ctx.font = "bold 16px sans-serif"; ctx.textAlign="center";
        ctx.fillText("🔄 やじるしを おいて みちをまげよう", W/2, m.trayY);
        let arrowSpacing = W / 4;
        arrows.forEach((a, i) => { drawBlock(arrowSpacing * (i + 0.5), m.trayY + 45, "#2196f3", a.e); });
    }

    if (draggingItem) {
        if (draggingItem.type === 'arrow') drawBlock(draggingItem.x, draggingItem.y, "#2196f3", draggingItem.e);
    }

    requestAnimationFrame(update);
}

function startGame() {
    initAudio(); document.getElementById('start-screen').classList.add('hide');
    initLevel(); requestAnimationFrame(update);
}
</script>
