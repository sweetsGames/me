<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>こくご もじあつめ忍者</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4fc3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="もじあつめ">

<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * {
    box-sizing: border-box; user-select: none; -webkit-user-select: none;
    margin: 0; padding: 0; 
    touch-action: none; 
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
  }
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: #2c3e50; display: flex; flex-direction: column;
  }
  
  #opening-screen {
    position: fixed; inset: 0; background: #ffffff; z-index: 9999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .logo-container { text-align: center; animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  .logo-icon { font-size: clamp(50px, 15vw, 80px); margin-bottom: 10px; }
  .logo-text { font-size: clamp(24px, 7vw, 36px); font-weight: bold; color: #333; letter-spacing: 2px; }
  .logo-sub { font-size: clamp(18px, 5vw, 28px); font-weight: bold; color: #ff9800; letter-spacing: 4px; margin-top: 5px; }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  #game-wrapper {
    position: relative; flex: 1; width: 100%; max-width: 600px; margin: 0 auto;
    background: #34495e; box-shadow: 0 0 20px rgba(0,0,0,0.5); 
    display: flex; flex-direction: column; overflow: hidden;
  }
  
  #header {
    position: absolute; top: max(10px, var(--sat)); left: 0; width: 100%;
    padding: 0 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
    pointer-events: none;
  }
  .status-box {
    background: rgba(255, 255, 255, 0.95); padding: 8px 15px; border-radius: 12px;
    font-size: clamp(16px, 5vw, 22px); font-weight: bold; color: #333;
    border: 3px solid #7f8c8d; box-shadow: 0 4px 0 #2c3e50;
  }
  
  #question-board {
    position: absolute; bottom: calc(20px + var(--sab)); left: 50%; transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95); border: 5px solid #9b59b6; border-radius: 20px;
    padding: 10px 15px; width: 90%; max-width: 450px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.3); z-index: 10; text-align: center; pointer-events: none;
    display: none; flex-direction: column; gap: 5px;
  }
  #q-kanji { font-size: clamp(24px, 7vw, 36px); font-weight: bold; color: #2c3e50; }
  #q-yomi { font-size: clamp(20px, 5.5vw, 30px); font-weight: bold; color: #e65100; letter-spacing: 5px; }

  canvas { display: block; flex: 1; width: 100%; min-height: 0; object-fit: cover; touch-action: none; }

  .screen {
    position: absolute; inset: 0; background: rgba(236, 240, 241, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  h1 { font-size: clamp(32px, 8vw, 45px); color: #8e44ad; margin-bottom: 15px; text-shadow: 2px 2px 0 #d2b4de; text-align: center;}
  
  .settings-box {
    background: #fff; border-radius: 15px; padding: 15px; width: 90%; max-width: 350px; margin-bottom: 20px;
    border: 3px solid #bdc3c7; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .set-title { font-size: 18px; font-weight: bold; color: #555; margin-bottom: 10px; text-align: center; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
  .opt-btn {
    padding: 8px 12px; font-size: 14px; font-weight: bold; border: 2px solid #aaa;
    border-radius: 8px; background: #fff; color: #555; cursor: pointer;
  }
  .opt-btn.active { background: #9b59b6; color: white; border-color: #8e44ad; }

  .start-btn {
    padding: 15px 40px; font-size: 24px; font-weight: bold; color: white;
    background: #ff9800; border: none; border-radius: 30px; box-shadow: 0 6px 0 #e65100;
  }
  .start-btn:active { transform: translateY(6px); box-shadow: none; }

  #message-popup {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
    font-size: clamp(40px, 10vw, 60px); font-weight: bold; text-align: center;
    color: #f1c40f; text-shadow: 3px 3px 0 #c0392b; z-index: 50; pointer-events: none;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #message-popup.show { transform: translate(-50%, -50%) scale(1); }
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="opening-screen">
  <div class="logo-container">
    <div class="logo-icon">📱👨‍💻✨</div>
    <div class="logo-text">めー＆SEパパ</div>
    <div class="logo-sub">GAMES</div>
  </div>
</div>

<div id="game-wrapper">
  <div id="header">
    <div class="status-box">⏱ <span id="ui-time">60</span>秒</div>
    <div class="status-box">⭕️ <span id="ui-score">0</span></div>
  </div>
  
  <canvas id="c"></canvas>

  <div id="question-board">
    <div id="q-kanji">お題</div>
    <div id="q-yomi">_ _ _</div>
  </div>
  
  <div id="message-popup">ドロン！</div>

  <div id="start-screen" class="screen">
    <h1>🥷 こくご<br>もじあつめ忍者</h1>
    
    <div class="settings-box">
      <div class="set-title">１．レベルをえらぶ</div>
      <div class="btn-row" id="diff-group">
        <button class="opt-btn active" onclick="selDiff(0)">かんたん(2もじ)</button>
        <button class="opt-btn" onclick="selDiff(1)">ふつう(3〜4もじ)</button>
        <button class="opt-btn" onclick="selDiff(2)">むずかしい(1・2年漢字)</button>
        <button class="opt-btn" onclick="selDiff(3)">超むずかしい(四字熟語)</button>
      </div>
      
      <div class="set-title">２．じかんをえらぶ</div>
      <div class="btn-row" id="time-group">
        <button class="opt-btn active" onclick="selTime(60)">60びょう</button>
        <button class="opt-btn" onclick="selTime(90)">90びょう</button>
      </div>
    </div>
    <button class="start-btn" onclick="startGame()">スタート！</button>
  </div>

  <div id="result-screen" class="screen hide">
    <h1 id="result-title">タイムアップ！</h1>
    <div style="font-size:80px; margin-bottom:10px;">💮</div>
    <p style="font-size:24px; font-weight:bold; color:#333; margin-bottom:20px;">
      クリア：<span id="final-score" style="color:#e65100; font-size:1.5em;">0</span> こ
    </p>
    <button class="start-btn" onclick="showStartScreen()">もういっかい</button>
  </div>
</div>

<script>
document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

window.addEventListener('load', () => {
    setTimeout(() => {
        const opening = document.getElementById('opening-screen');
        opening.style.opacity = '0';
        opening.style.visibility = 'hidden';
    }, 1800);
});

let actx;
function initAudio() { if (!actx) { actx = new AudioContext(); if (actx.state === 'suspended') actx.resume(); } }
function playSound(type) {
    if (!actx) return;
    const now = actx.currentTime; const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    
    if (type === 'tap') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'correct') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(880, now + 0.1);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.setValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'end') {
        osc.type = 'square'; [523, 659, 783, 1046].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.15));
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.8); osc.start(now); osc.stop(now + 0.8);
    }
}

let diffSelected = 0; let timeSelected = 60;
let currentPatternIndex = 0;

function selDiff(val) { diffSelected = val; document.querySelectorAll('#diff-group .opt-btn').forEach((b, i) => b.classList.toggle('active', i === val)); }
function selTime(val) { timeSelected = val; document.querySelectorAll('#time-group .opt-btn').forEach(b => b.classList.toggle('active', parseInt(b.innerText) === val)); }

// --- 5パターン分割の大増量辞書データ ---
const dictionaries = [
    // 0: かんたん（2文字）
    [
        [{q:"いぬ", a:["い","ぬ"], d:"h"}, {q:"ねこ", a:["ね","こ"], d:"h"}, {q:"うし", a:["う","し"], d:"h"}, {q:"うま", a:["う","ま"], d:"h"}],
        [{q:"そら", a:["そ","ら"], d:"h"}, {q:"うみ", a:["う","み"], d:"h"}, {q:"やま", a:["や","ま"], d:"h"}, {q:"かわ", a:["か","わ"], d:"h"}],
        [{q:"あか", a:["あ","か"], d:"h"}, {q:"あお", a:["あ","お"], d:"h"}, {q:"くろ", a:["く","ろ"], d:"h"}, {q:"しろ", a:["し","ろ"], d:"h"}],
        [{q:"ほん", a:["ほ","ん"], d:"h"}, {q:"はこ", a:["は","こ"], d:"h"}, {q:"かぎ", a:["か","ぎ"], d:"h"}, {q:"かさ", a:["か","さ"], d:"h"}],
        [{q:"あし", a:["あ","し"], d:"h"}, {q:"かお", a:["か","お"], d:"h"}, {q:"ゆび", a:["ゆ","び"], d:"h"}, {q:"くち", a:["く","ち"], d:"h"}] 
    ],
    // 1: ふつう（3〜4文字）
    [
        [{q:"くるま", a:["く","る","ま"], d:"h"}, {q:"ふね", a:["ふ","ね"], d:"h"}, {q:"ひこうき", a:["ひ","こ","う","き"], d:"h"}],
        [{q:"りんご", a:["り","ん","ご"], d:"h"}, {q:"ばなな", a:["ば","な","な"], d:"h"}, {q:"みかん", a:["み","か","ん"], d:"h"}],
        [{q:"めがね", a:["め","が","ね"], d:"h"}, {q:"ぼうし", a:["ぼ","う","し"], d:"h"}, {q:"とけい", a:["と","け","い"], d:"h"}],
        [{q:"おにぎり", a:["お","に","ぎ","り"], d:"h"}, {q:"たまご", a:["た","ま","ご"], d:"h"}, {q:"ごはん", a:["ご","は","ん"], d:"h"}],
        [{q:"さくら", a:["さ","く","ら"], d:"h"}, {q:"ひまわり", a:["ひ","ま","わ","り"], d:"h"}, {q:"もみじ", a:["も","み","じ"], d:"h"}]
    ],
    // 2: むずかしい（小学1〜2年の漢字。漢字→読み、読み→漢字）
    [
        [{q:"学校", a:["が","っ","こ","う"], d:"h"}, {q:"がっこう", a:["学","校"], d:"k"}, {q:"先生", a:["せ","ん","せ","い"], d:"h"}, {q:"せんせい", a:["先","生"], d:"k"}],
        [{q:"毎日", a:["ま","い","に","ち"], d:"h"}, {q:"まいにち", a:["毎","日"], d:"k"}, {q:"日記", a:["に","っ","き"], d:"h"}, {q:"にっき", a:["日","記"], d:"k"}],
        [{q:"青空", a:["あ","お","ぞ","ら"], d:"h"}, {q:"あおぞら", a:["青","空"], d:"k"}, {q:"夕方", a:["ゆ","う","が","た"], d:"h"}, {q:"ゆうがた", a:["夕","方"], d:"k"}],
        [{q:"国語", a:["こ","く","ご"], d:"h"}, {q:"こくご", a:["国","語"], d:"k"}, {q:"算数", a:["さ","ん","す","う"], d:"h"}, {q:"さんすう", a:["算","数"], d:"k"}],
        [{q:"元気", a:["げ","ん","き"], d:"h"}, {q:"げんき", a:["元","気"], d:"k"}, {q:"名前", a:["な","ま","え"], d:"h"}, {q:"なまえ", a:["名","前"], d:"k"}]
    ],
    // 3: 超むずかしい（四字熟語など。交互に出るよう単語を増量）
    [
        [{q:"一石二鳥", a:["い","っ","せ","き","に","ち","ょ","う"], d:"h"}, {q:"いっせきにちょう", a:["一","石","二","鳥"], d:"k"}, {q:"前代未聞", a:["ぜ","ん","だ","い","み","も","ん"], d:"h"}, {q:"ぜんだいみもん", a:["前","代","未","聞"], d:"k"}],
        [{q:"十人十色", a:["じ","ゅ","う","に","ん","と","い","ろ"], d:"h"}, {q:"じゅうにんといろ", a:["十","人","十","色"], d:"k"}, {q:"春夏秋冬", a:["し","ゅ","ん","か","し","ゅ","う","と","う"], d:"h"}, {q:"しゅんかしゅうとう", a:["春","夏","秋","冬"], d:"k"}],
        [{q:"一生懸命", a:["い","っ","し","ょ","う","け","ん","め","い"], d:"h"}, {q:"いっしょうけんめい", a:["一","生","懸","命"], d:"k"}, {q:"絶体絶命", a:["ぜ","っ","た","い","ぜ","つ","め","い"], d:"h"}, {q:"ぜったいぜつめい", a:["絶","体","絶","命"], d:"k"}],
        [{q:"喜怒哀楽", a:["き","ど","あ","い","ら","く"], d:"h"}, {q:"きどあいらく", a:["喜","怒","哀","楽"], d:"k"}, {q:"以心伝心", a:["い","し","ん","で","ん","し","ん"], d:"h"}, {q:"いしんでんしん", a:["以","心","伝","心"], d:"k"}],
        [{q:"花鳥風月", a:["か","ち","ょ","う","ふ","う","げ","つ"], d:"h"}, {q:"かちょうふうげつ", a:["花","鳥","風","月"], d:"k"}, {q:"温故知新", a:["お","ん","こ","ち","し","ん"], d:"h"}, {q:"おんこちしん", a:["温","故","知","新"], d:"k"}]
    ]
];

const dummyHiragana = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
const dummyKanji = "春夏秋冬上下左右日月火水木金土山川林森男女父母子大小中高本気生休学先毎空青名日記図工音算国体元友公雨夕朝見";

const c = document.getElementById('c'); const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = c.clientWidth; H = c.height = c.clientHeight; }
window.addEventListener('resize', resize); resize();

let state = 'title'; let score = 0; let timeLeft = 0; let lastTime = 0;
let currentWord = null; let charIndex = 0; 
let items = []; 
let ninjaY = 0;

const UI_TIME = document.getElementById('ui-time');
const UI_SCORE = document.getElementById('ui-score');
const Q_BOARD = document.getElementById('question-board');
const Q_KANJI = document.getElementById('q-kanji');
const Q_YOMI = document.getElementById('q-yomi');
const MSG = document.getElementById('message-popup');

function showMsg(text, color) {
    MSG.innerText = text; MSG.style.color = color;
    MSG.classList.add('show'); setTimeout(() => MSG.classList.remove('show'), 800);
}

function updateYomiDisplay() {
    let display = "";
    for(let i=0; i<currentWord.a.length; i++) {
        if(i < charIndex) display += currentWord.a[i] + " ";
        else display += "_ ";
    }
    Q_YOMI.innerText = display;
}

function spawnWord() {
    let currentSet = dictionaries[diffSelected][currentPatternIndex];
    let candidates = currentSet;
    
    // 【ロジック1】連続出題の防止：直前の問題を候補から除外する
    if (currentWord) {
        candidates = candidates.filter(w => w.q !== currentWord.q);
    }
    
    // 【ロジック2】交互出題の徹底：h（ひらがな）とk（漢字）の切り替え
    let hasH = candidates.some(w => w.d === "h");
    let hasK = candidates.some(w => w.d === "k");
    
    if (hasH && hasK && currentWord) {
        // 直前が h なら k を、k なら h を次のターゲットにする
        let targetType = currentWord.d === "h" ? "k" : "h";
        let typeCandidates = candidates.filter(w => w.d === targetType);
        if (typeCandidates.length > 0) {
            candidates = typeCandidates;
        }
    }
    
    // 安全装置（万が一候補が空になったらリセット）
    if (candidates.length === 0) candidates = currentSet;
    
    // 絞り込まれた候補の中からランダムに1つ決定
    currentWord = candidates[Math.floor(Math.random() * candidates.length)];
    
    charIndex = 0;
    Q_KANJI.innerText = currentWord.q;
    updateYomiDisplay();
    
    items = [];
    let requiredChars = [...currentWord.a];
    
    let dummySource = currentWord.d === "k" ? dummyKanji : dummyHiragana;
    let dummyCount = 3 + diffSelected * 2; 
    
    for(let i=0; i<dummyCount; i++) {
        requiredChars.push(dummySource[Math.floor(Math.random() * dummySource.length)]);
    }
    
    let itemSize = Math.max(30, Math.min(48, W * 0.09));
    
    requiredChars.forEach(char => {
        let speedMult = 0.5 + (diffSelected * 0.3); 
        items.push({
            char: char,
            x: Math.random() * (W - itemSize*2) + itemSize,
            y: Math.random() * (H/2) + itemSize, 
            vx: (Math.random() - 0.5) * 200 * speedMult,
            vy: (Math.random() - 0.5) * 200 * speedMult,
            size: itemSize,
            active: true
        });
    });
}

c.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if(state !== 'play') return;
    
    let rect = c.getBoundingClientRect();
    let tx = e.clientX - rect.left;
    let ty = e.clientY - rect.top;
    
    for(let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        if(!it.active) continue;
        
        let dist = Math.hypot(tx - it.x, ty - it.y);
        if(dist < it.size * 1.3) {
            let targetChar = currentWord.a[charIndex];
            
            if(it.char === targetChar) {
                playSound('tap');
                it.active = false;
                charIndex++;
                updateYomiDisplay();
                
                if(charIndex >= currentWord.a.length) {
                    playSound('correct');
                    score++; UI_SCORE.innerText = score;
                    showMsg("見事！", "#2ecc71");
                    setTimeout(spawnWord, 500); 
                }
            } else {
                playSound('wrong');
                it.vx *= -1; 
                it.vy *= -1;
            }
            break; 
        }
    }
});

function update(time) {
    if (!lastTime) lastTime = time;
    let dt = (time - lastTime) / 1000; lastTime = time;
    
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 0, W, H);
    
    if (state === 'play') {
        timeLeft -= dt;
        UI_TIME.innerText = Math.ceil(Math.max(0, timeLeft));
        if (timeLeft <= 0) endGame();
        
        let boardTop = H - 120; 
        
        for(let i = 0; i < items.length; i++) {
            for(let j = i + 1; j < items.length; j++) {
                let it1 = items[i];
                let it2 = items[j];
                if(!it1.active || !it2.active) continue;
                
                let dx = it2.x - it1.x;
                let dy = it2.y - it1.y;
                let dist = Math.hypot(dx, dy);
                let minDist = it1.size + it2.size;
                
                if(dist < minDist) {
                    let angle = Math.atan2(dy, dx);
                    let overlap = minDist - dist;
                    it1.x -= Math.cos(angle) * overlap / 2;
                    it1.y -= Math.sin(angle) * overlap / 2;
                    it2.x += Math.cos(angle) * overlap / 2;
                    it2.y += Math.sin(angle) * overlap / 2;
                    
                    let v1x = it1.vx, v1y = it1.vy;
                    it1.vx = it2.vx; it1.vy = it2.vy;
                    it2.vx = v1x; it2.vy = v1y;
                }
            }
        }
        
        items.forEach(it => {
            if(!it.active) return;
            
            it.x += it.vx * dt;
            it.y += it.vy * dt;
            
            if(it.x < it.size) { it.x = it.size; it.vx *= -1; }
            if(it.x > W - it.size) { it.x = W - it.size; it.vx *= -1; }
            if(it.y < it.size) { it.y = it.size; it.vy *= -1; }
            if(it.y > boardTop - it.size) { it.y = boardTop - it.size; it.vy *= -1; }
            
            ctx.beginPath();
            ctx.arc(it.x, it.y, it.size, 0, Math.PI*2);
            ctx.fillStyle = '#ecf0f1'; ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#8e44ad'; ctx.stroke();
            
            ctx.fillStyle = '#2c3e50';
            let fontSize = it.size * 1.1; 
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(it.char, it.x, it.y + it.size*0.1);
        });
        
        ninjaY = Math.sin(time / 200) * 10;
        ctx.font = "60px sans-serif";
        ctx.fillText("🥷", W/2, boardTop - 40 + ninjaY);
    }
    
    requestAnimationFrame(update);
}

function startGame() {
    initAudio();
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hide'));
    
    let setsInDiff = dictionaries[diffSelected].length;
    currentPatternIndex = Math.floor(Math.random() * setsInDiff);
    
    currentWord = null; // リスタート時に直前の問題をリセット
    timeLeft = timeSelected; score = 0; UI_SCORE.innerText = score;
    Q_BOARD.style.display = 'flex';
    state = 'play'; lastTime = 0;
    
    spawnWord();
}

function endGame() {
    state = 'end'; Q_BOARD.style.display = 'none';
    document.getElementById('result-screen').classList.remove('hide');
    document.getElementById('final-score').innerText = score;
    playSound('end');
}

function showStartScreen() {
    document.getElementById('result-screen').classList.add('hide');
    document.getElementById('start-screen').classList.remove('hide');
}

requestAnimationFrame(update);
</script>
</body>
</html>
